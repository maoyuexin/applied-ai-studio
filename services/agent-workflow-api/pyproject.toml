[project]
name = "applied-ai-studio-agent-workflow-api"
version = "0.1.0"
description = "Runs and records multi-agent workflows (Microsoft Agent Framework) for the Agent Workflows tab"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core==1.20.0",
  "agent-framework-foundry==1.14.0",
  "agent-framework-orchestrations==1.3.0",
  "azure-identity>=1.25,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.24,<2",
  "sse-starlette>=2,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[tool.setuptools]
packages = ["app", "app.scenarios"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
