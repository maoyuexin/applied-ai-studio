[project]
name = "applied-ai-studio-pneumonia-api"
version = "0.1.0"
description = "Artifact-backed pediatric chest X-ray prioritization teaching service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "pyarrow>=17,<22",
  "pydantic-settings>=2.10,<3",
  "scikit-learn>=1.5,<2",
  # Install this from the CPU wheel index, not PyPI:
  #   pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
  # On Linux the default PyPI wheel is the CUDA build and drags in ~3 GB of
  # NVIDIA libraries (cuda-toolkit, cudnn, cublas, nccl, triton, ...). Nothing
  # here uses a GPU, and that download filled the disk in a 32 GB Codespace,
  # failing container creation with "No space left on device". `npm run
  # setup:torch-cpu` does this, and setup:notebook runs it first.
  "torch>=2.4,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"