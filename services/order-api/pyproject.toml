[project]
name = "applied-ai-studio-order-api"
version = "0.1.0"
description = "Executable Online Order Operations domain service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.40,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]
# Everything the teaching notebooks need. Deliberately separate from the
# runtime dependencies above: the Online Order service must not grow a
# machine-learning dependency just because teaching notebooks live in the repo.
notebook = [
  "github-copilot-sdk==1.0.8",
  "imbalanced-learn>=0.13,<1",
  "ipykernel>=6.29,<7",
  "ipywidgets>=8.1,<9",
  "matplotlib>=3.9,<4",
  "mlflow-skinny>=3.15,<4",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=17,<22",
  "scikit-learn>=1.5,<2",
  "skops>=0.13,<1",
  # Install this from the CPU wheel index, not PyPI:
  #   pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
  # On Linux the default PyPI wheel is the CUDA build and drags in ~3 GB of
  # NVIDIA libraries (cuda-toolkit, cudnn, cublas, nccl, triton, ...). Nothing
  # here uses a GPU, and that download filled the disk in a 32 GB Codespace,
  # failing container creation with "No space left on device". `npm run
  # setup:torch-cpu` does this, and setup:notebook runs it first.
  "torch>=2.4,<3",
]

# Name the package explicitly instead of letting setuptools guess.
#
# This directory is a flat layout with several top-level folders that contain Python files
# - app/, migrations/, and data/ once the database has been created. Modern setuptools
# refuses to auto-discover in that situation and fails the install with "Multiple top-level
# packages discovered in a flat-layout", which aborts the whole Codespaces bootstrap.
#
# Only app/ is the importable package. migrations/ is Alembic's script directory, loaded by
# path through alembic.ini rather than imported, and data/ holds the local SQLite file.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
