[project]
name = "applied-ai-studio-fraud-api"
version = "0.1.0"
description = "MLflow-backed fraud detection simulation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "imbalanced-learn>=0.13,<1",
  "mlflow-skinny>=3.15,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic-settings>=2.10,<3",
  "scikit-learn>=1.5,<2",
  "shap>=0.48,<1",
  "skops>=0.13,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"