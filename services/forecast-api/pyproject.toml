[project]
name = "applied-ai-studio-forecast-api"
version = "0.1.0"
description = "Weekly demand-forecast planning service backed by the demand-forecasting notebook artifacts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
