[project]
name = "applied-ai-studio-credit-api"
version = "0.1.0"
description = "Credit-account review prioritization service backed by the credit-risk notebook artifacts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "joblib==1.5.3",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "pyarrow>=17,<22",
  "pydantic-settings>=2.10,<3",
  "scikit-learn==1.9.0",
  "shap==0.51.0",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
