[project]
name = "applied-ai-studio-design-api"
version = "0.1.0"
description = "Design Studio: multi-step generative pipelines (video, image, voice) with human gates and run history"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.25,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[tool.setuptools]
packages = ["app", "app.providers", "app.pipelines"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
