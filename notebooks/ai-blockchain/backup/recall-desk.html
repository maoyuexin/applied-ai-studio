<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall Desk</title>
<style>
:root {
  --bg: #111318;
  --panel: #181a20;
  --panel-2: #222530;
  --line: #2e323d;
  --text: #f5f3f0;
  --dim: #b9bdc6;
  --faint: #858a97;
  --orange: #e8913c;
  --orange-soft: #3a2a17;
  --teal: #7eaeb8;
  --teal-bright: #a8d4dd;
  --red: #e5675f;
  --green: #7cc59a;
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-size: 17px; line-height: 1.45; }
button, select, input { font: inherit; }
[hidden] { display: none !important; }

.top {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  max-width: 1440px; margin: 0 auto; padding: 18px 32px 14px;
  border-bottom: 1px solid var(--line);
}
.brand { flex: 1 1 380px; }
.kicker { margin: 0; color: var(--teal); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.brand h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.15; }
.modes { display: flex; gap: 6px; }
.modes button, .speed select {
  min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--dim); cursor: pointer;
}
.modes button[aria-selected="true"] { background: var(--panel-2); color: var(--text); border-color: var(--teal); }
.speed { color: var(--dim); font-size: 15px; }
.speed select { margin-left: 6px; min-height: 40px; padding: 6px 10px; }

main { max-width: 1440px; margin: 0 auto; padding: 14px 32px 28px; }

.chapters { display: flex; gap: 6px; list-style: none; margin: 0 0 14px; padding: 0; flex-wrap: wrap; }
.chapters button {
  display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px 6px 6px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; font-size: 15px;
}
.chapters .num {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--faint); font-size: 14px; font-weight: 700;
}
.chapters button[aria-current="step"] { color: var(--text); border-color: var(--orange); }
.chapters button[aria-current="step"] .num { background: var(--orange); border-color: var(--orange); color: #1b1206; }
.chapters button.done .num { border-color: var(--teal); color: var(--teal); }

.step-kicker { margin: 0; color: var(--orange); font-size: 14px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.step-head h2 { margin: 4px 0 6px; font-size: 32px; line-height: 1.15; }
.lead { margin: 0 0 14px; color: var(--dim); font-size: 19px; max-width: 1000px; }

.step-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.95fr); gap: 22px; align-items: start; }
.stage-col { min-width: 0; }
.floor-wrap {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
  display: grid; place-items: center;
}
.floor-wrap.pair { grid-template-columns: 1fr 1fr; gap: 10px; }
svg.floor { width: 100%; height: auto; max-height: 440px; display: block; user-select: none; }
svg.floor.big { max-height: 470px; }
.floor-caption { margin: 8px 4px 0; color: var(--faint); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 4px 0; color: var(--dim); font-size: 14px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--swatch); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
.btn {
  min-height: 46px; padding: 9px 18px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); cursor: pointer; font-weight: 600;
}
.btn:hover:not(:disabled) { border-color: var(--teal); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #1b1206; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn:focus-visible, .chapters button:focus-visible, .modes button:focus-visible, .pad button:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
.btn .n { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: rgba(0,0,0,.25); font-size: 13px; }

.pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 48px); gap: 6px; }
.pad button { border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; }
.pad button:disabled { opacity: .4; }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }

.status { min-height: 26px; margin: 10px 4px 0; color: var(--dim); font-size: 16px; }
.status strong { color: var(--text); }

.explain { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.card h3 { margin: 0 0 8px; font-size: 14px; color: var(--teal); letter-spacing: .07em; text-transform: uppercase; }
.card p { margin: 0 0 8px; }
.card p:last-child { margin-bottom: 0; }
.card.accent { border-color: var(--orange); background: linear-gradient(0deg, rgba(232,145,60,.06), rgba(232,145,60,.06)), var(--panel); }
.card.good { border-color: var(--teal); }
.card.warn { border-color: var(--red); }
.muted { color: var(--dim); }
.small { font-size: 15px; }
.big-number { font-size: 34px; font-weight: 800; color: var(--orange); line-height: 1.1; }

.points { width: 100%; border-collapse: collapse; }
.points td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.points tr:last-child td { border-bottom: 0; }
.points td:last-child { text-align: right; font-weight: 800; font-size: 20px; white-space: nowrap; }
.plus { color: var(--green); }
.minus { color: var(--red); }

.formula {
  font-size: 19px; font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--panel-2);
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.formula .term { padding: 2px 8px; border-radius: 7px; background: var(--bg); }
.formula .t-new { color: var(--orange); }
.formula .t-now { color: var(--red); }
.formula .t-next { color: var(--teal-bright); }

.moveline { display: grid; grid-template-columns: 150px 1fr; gap: 3px 10px; font-size: 16px; }
.moveline dt { color: var(--faint); }
.moveline dd { margin: 0; }
.calc { margin-top: 8px; font-size: 21px; font-weight: 800; }
.calc .eq { color: var(--orange); }

.compass { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 40px); gap: 4px; justify-content: start; }
.compass div { display: grid; place-items: center; border-radius: 8px; background: var(--panel-2); font-weight: 700; }
.compass .c { background: transparent; color: var(--faint); font-size: 14px; }
.compass .hl { outline: 2px solid var(--orange); }
.compass .blank { color: var(--faint); }

table.data { width: 100%; border-collapse: collapse; font-size: 15px; }
table.data th { text-align: left; color: var(--faint); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.data td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.new td { background: rgba(126,174,184,.12); }
table.q { font-size: 14px; }
table.q td, table.q th { padding: 2px 6px; }
table.q td { text-align: center; }
table.q td:first-child, table.q th:first-child { text-align: left; }
table.q th { text-align: center; }

.terms { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; margin: 0; font-size: 16px; }
.terms dt { font-weight: 800; color: var(--text); }
.terms dd { margin: 0; color: var(--dim); }

.checklist { margin: 0; padding-left: 20px; }
.checklist li { margin: 4px 0; }
.steps-list { margin: 0; padding-left: 22px; }
.steps-list li { margin: 5px 0; }

.log { display: grid; gap: 8px; }
.log .entry { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.log .entry.bad { border-color: var(--red); }
.log .entry.ok { border-color: var(--teal); }
.log .entry strong { display: block; }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: inherit; }

.stepnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.stepnav .count { color: var(--faint); }

/* Floor drawing */
.tile { fill: #1d2028; stroke: #2c303a; stroke-width: 2; }
.tile.clickable { cursor: pointer; }
.tile.clickable:hover { stroke: var(--teal); }
.shelf-body { fill: #2a3446; stroke: #3a4760; stroke-width: 2; }
.shelf-line { stroke: #43506a; stroke-width: 3; }
.shelf-box { fill: #6a5238; }
.station-body { fill: var(--orange-soft); stroke: var(--orange); stroke-width: 3; }
.station-label { fill: var(--orange); font-size: 15px; font-weight: 800; letter-spacing: 1px; }
.coord { fill: var(--faint); font-size: 18px; font-weight: 700; }
.start-label { fill: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.score-tint { fill: var(--teal); }
.score-num { fill: var(--text); font-size: 30px; font-weight: 800; }
.score-num.low { fill: var(--faint); font-size: 22px; font-weight: 700; }
.score-arrow { fill: var(--teal-bright); font-size: 24px; font-weight: 800; }
.score-arrow.low { fill: var(--faint); font-size: 18px; }
.slot { fill: var(--faint); font-size: 16px; font-weight: 800; }
.slot.filled { fill: var(--text); }
.slot-box { fill: none; stroke: #4d5362; stroke-width: 2; stroke-dasharray: 4 3; }
.slot-box.filled { fill: #2b3140; stroke: var(--teal); stroke-dasharray: none; }
.flash { fill: none; stroke: var(--orange); stroke-width: 5; }
.path-test { fill: none; stroke: var(--orange); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.path-map { fill: none; stroke: var(--text); stroke-width: 4; stroke-dasharray: 10 10; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.robot { transition-property: transform; transition-timing-function: ease-in-out; }
.robot-body { fill: var(--teal); stroke: #d9eef2; stroke-width: 2; }
.robot-face { fill: #173038; }
.robot-eye { fill: #e8fbff; }
.robot-load { fill: var(--orange); }
.robot.bumped .robot-body { fill: var(--red); }
.pallet-body { fill: #7a4e24; stroke: #c98a4b; stroke-width: 3; }
.pallet-strap { stroke: #c98a4b; stroke-width: 4; }
.pallet-label { fill: #fbe3c8; font-size: 14px; font-weight: 800; letter-spacing: .5px; }

/* Lab */
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.95fr); gap: 22px; align-items: start; }
.settings { display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px; align-items: center; }
.settings label { color: var(--dim); font-size: 15px; }
.settings > div { display: flex; align-items: center; gap: 10px; }
.settings input[type="range"] { flex: 1; min-width: 0; accent-color: var(--orange); }
.settings select, .settings input[type="number"] {
  min-height: 40px; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
}
.value-out { color: var(--text); font-weight: 700; min-width: 44px; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 24px; }
.stat span { color: var(--faint); font-size: 13px; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.toggle button { min-height: 40px; padding: 6px 14px; border: 0; background: var(--panel); color: var(--dim); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -3px 0 var(--orange); }

/* Live labs: header gear, settings pop-up, play button, live panel */
.lab-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.gear-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.gear-btn svg { width: 22px; height: 22px; color: var(--orange); }
.gear-btn:hover { border-color: var(--teal); }
.gear-btn:focus-visible, .pop-close:focus-visible, .toggle button:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
dialog.settings-pop { position: fixed; inset: 88px 24px auto auto; margin: 0; width: min(470px, calc(100vw - 32px)); max-height: calc(100vh - 112px);
  padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: auto; }
dialog.settings-pop::backdrop { background: rgba(8,9,12,.55); }
.pop-inner { padding: 16px 18px 18px; }
.pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.pop-head h3 { margin: 0; font-size: 19px; }
.pop-inner h4 { margin: 18px 0 6px; font-size: 15px; color: var(--dim); }
.pop-close { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; }
.pop-note { color: var(--faint); font-size: 13px; margin: 12px 0 0; }
.help-btn { flex: none; width: 34px; height: 34px; margin-left: auto; border: 1px solid var(--line); border-radius: 50%; background: var(--panel);
  color: var(--orange); font: inherit; font-size: 18px; font-weight: 800; line-height: 1; cursor: pointer; }
.help-btn:hover { border-color: var(--teal); }
.help-btn:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
.card h3.with-help { display: flex; align-items: center; gap: 8px; }
.card h3.with-help .help-btn { width: 28px; height: 28px; font-size: 15px; }
dialog.settings-pop.help-pop { inset: 0; margin: auto; height: fit-content; width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
.help-pop p { margin: 0 0 10px; }
.help-pop .formula { font-size: 16px; margin-bottom: 12px; }
.help-pop .terms { font-size: 15px; }
.help-pop .steps-list { font-size: 15px; }
.play-btn { min-width: 124px; }
.live-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.live-now { border-left: 3px solid var(--orange); padding-left: 10px; margin: 0 0 8px; color: var(--dim); font-size: 14px; }
.live-log { list-style: none; margin: 0; padding: 0; font-size: 14px; max-height: 150px; overflow: auto; }
.live-log li { padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--dim); }
.live-log li:first-child { color: var(--text); }

/* One-screen live lab: scene across the top, one control bar, then a row of panels. */
body.lab-mode .top .speed { display: none; }
body.lab-mode main { padding-bottom: 0; }
.live-lab { display: flex; flex-direction: column; gap: 10px; }
.live-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.live-head .step-kicker { margin: 0; }
.live-head h2 { margin: 2px 0 0; font-size: 24px; line-height: 1.2; }
.live-head .lead { margin: 3px 0 0; font-size: 15px; max-width: none; }
.live-stage { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; align-items: stretch;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.live-stage .legend { flex: 0 0 170px; flex-direction: column; align-self: flex-start; gap: 7px; margin: 4px 0 0; font-size: 13px; }
.live-stage .scene { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.live-stage .scene > svg { width: 100%; height: 100%; max-height: none; }
.live-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.live-bar .controls { margin: 0; }
.live-bar .status { flex: 1 1 320px; margin: 0; min-height: 0; font-size: 15px; }
.live-panels { flex: 0 0 clamp(210px, 29vh, 290px); display: flex; gap: 10px; min-height: 0; }
.live-panels > * { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; }
.live-panels > .wide { flex-grow: 1.35; }
.live-panels > .wider { flex-grow: 1.7; }
.live-panels > .widest { flex-grow: 2; }
.live-panels > .narrow { flex-grow: 0.8; }
.live-panels > .stack { display: flex; flex-direction: column; gap: 10px; }
.live-panels .card { height: 100%; overflow: auto; padding: 10px 12px; }
.live-panels > .stack > .card { height: auto; flex: 0 0 auto; }
.live-panels .card h3 { font-size: 12.5px; margin-bottom: 6px; }
.live-panels .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.live-panels .stat { padding: 5px 8px; }
.live-panels .stat b { font-size: 18px; }
.live-panels .stat span { font-size: 12px; }
.live-panels .moveline { grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 13.5px; }
.live-panels .calc { font-size: 15px; margin-top: 6px; }
.live-panels .live-log { max-height: none; font-size: 13px; }
.live-panels table.data { font-size: 13px; }
.live-panels .pgrids { gap: 8px; }
.live-panels .pgrid h4 { font-size: 12.5px; margin-bottom: 4px; }
.live-panels .pgrid table { font-size: 11.5px; border-spacing: 2px; }
.live-panels .pgrid td { padding: 3px 1px; }
.live-panels .axis-note { display: none; }
.live-panels table.qd td, .live-panels table.qd th { padding: 3px 4px; font-size: 12px; }
.live-panels .steps-list { margin: 0 0 8px; }
/* Side layout (square scenes such as the New York map): columns of panels left and right of a full-height scene. */
.live-main { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
.live-side { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.live-side.right { flex-grow: 1.2; }
.live-side .card { flex: 0 0 auto; padding: 10px 12px; }
.live-side .card h3 { font-size: 12.5px; margin-bottom: 6px; }
.live-side .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.live-side .stat { padding: 5px 8px; }
.live-side .stat b { font-size: 18px; }
.live-side .stat span { font-size: 12px; }
.live-side .moveline { grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 13.5px; }
.live-side .calc { font-size: 15px; margin-top: 6px; }
.live-side .live-log { max-height: 96px; font-size: 13px; }
.live-side table.data { font-size: 13px; }
.live-side table.qd td, .live-side table.qd th { padding: 3px 4px; font-size: 12px; }
.live-side .steps-list { margin: 0 0 8px; }
.live-main > .live-stage { flex: 0 0 auto; position: relative; padding: 6px; }
.live-main > .live-stage .legend { position: absolute; top: 12px; left: 12px; z-index: 1; margin: 0; padding: 8px 10px; border-radius: 10px;
  background: rgba(14, 24, 34, .86); flex-direction: column; gap: 5px; font-size: 12.5px; }
@media (max-width: 900px) {
  .live-main { flex: none; flex-direction: column; }
  .live-main > .live-stage .legend { position: static; flex-direction: row; background: none; padding: 0 0 6px; }
  .live-side { flex: none; overflow: visible; }
}
.rule-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; font-size: 13px; color: var(--dim); }
.rule-list strong { color: var(--text); }

/* Guided lesson on one screen: controls column + scene, then explanation cards in a row ('top')
   or a column beside a height-sized square scene ('side'). Narrow screens keep the stacked page. */
.fit-stage { display: contents; }
.explain > div:empty { display: none; }
@media (max-width: 900px) {
  .fit-stage > .floor-wrap { order: -1; }
}
@media (min-width: 901px) {
  #lesson .chapters { margin-bottom: 8px; }
  #lesson .chapters button { min-height: 34px; padding: 3px 10px 3px 4px; font-size: 14px; }
  #lesson .chapters .num { width: 24px; height: 24px; font-size: 13px; }
  #lesson .step-head h2 { font-size: 25px; margin: 2px 0 4px; }
  #lesson .lead { font-size: 16px; margin-bottom: 8px; max-width: none; }
  #lesson .stepnav { margin-top: 10px; padding-top: 10px; }
  .step-body.fit-top, .step-body.fit-side { display: flex; gap: 10px; min-height: 0; align-items: stretch; }
  .step-body.fit-top { flex-direction: column; }
  .fit-stage { display: flex; gap: 14px; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
  .fit-top .fit-stage { flex: 1 1 0; }
  .fit-side .fit-stage { flex: 0 0 auto; }
  .fit-stage > .stage-col { flex: 0 0 300px; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }

/* Blockchain Explorer additions (after the shared lesson stylesheet, crop.css and water.css). */
svg.xchart { display: block; width: 100%; height: auto; user-select: none; }
svg.xchart text { font-family: inherit; }
.wide-chart > svg.xchart { width: 100%; height: 100%; }
code, .hash { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.hash { display: block; font-size: 14px; line-height: 1.5; word-break: break-all; color: var(--dim); background: var(--panel-2); border-radius: 8px; padding: 6px 9px; }
.hash .zeros { color: var(--orange); font-weight: 800; }

.mark.good, .good-word { color: var(--green); }
.mark.bad, .bad-word { color: var(--red); }

.blabel { display: block; color: var(--faint); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }

/* Step 1 */
.pick-buttons .btn[aria-pressed="true"] { border-color: var(--orange); box-shadow: inset 0 -3px 0 var(--orange); color: var(--text); }
.pic { display: flex; align-items: center; justify-content: center; }
.pic > svg { max-height: 100%; }
.job-right { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.payment { display: grid; grid-template-columns: 1fr auto 1.3fr; gap: 10px; align-items: center; }
.pay-in, .pay-out { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; border-left: 4px solid var(--faint); }
.pay-in b, .pay-out b { font-size: 22px; }

/* Step 2 */
.textin, .numin { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 18px; }
.numin { font-size: 15px; min-height: 40px; width: 150px; }
.in-label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 14px; }
.hash-ins { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.grid-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
svg.bitgrid { width: 100%; max-width: 330px; height: auto; }
.grid-cap { text-align: center; margin: 0; }

/* Step 3 */
.block-view { display: flex; flex-direction: column; gap: 14px; width: 100%; }
.hbar { display: flex; gap: 3px; height: 54px; }
.hseg { border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #111318; font-weight: 800; font-size: 14px; min-width: 0; overflow: hidden; text-align: center; line-height: 1.1; padding: 0 4px; }
.hseg small { font-weight: 600; font-size: 11.5px; opacity: .8; }
.hseg.changed { outline: 3px solid var(--red); outline-offset: 1px; }
.seg0 { --c: #b197fc; } .seg1 { --c: #7eaeb8; } .seg2 { --c: #7cc59a; } .seg3 { --c: #fbbf24; } .seg4 { --c: #e8913c; } .seg5 { --c: #f5f3f0; }
.hseg { background: var(--c); }
.hbar-note { margin: 4px 0 0; }
.hvalues { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14px; }
.hvalues dt { font-weight: 800; color: var(--c); }
.hvalues dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; color: var(--dim); font-size: 13px; }
.hvalues dd.changed { color: var(--red); font-weight: 700; }
.hash-result { display: flex; flex-direction: column; gap: 8px; }
.hr-row { display: flex; flex-direction: column; gap: 2px; }

/* Step 4 */
.chain-row { display: flex; align-items: center; gap: 0; width: 100%; }
.bcard { flex: 1 1 0; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.bcard.edited { border-color: var(--red); }
.bcard header { display: flex; flex-direction: column; }
.bcard header b { font-size: 19px; }
.brow { display: flex; flex-direction: column; }
.brow b { font-size: 18px; }
.brow.changed b, .brow.changed code { color: var(--red); }
code.bad { color: var(--red); box-shadow: inset 3px 0 0 var(--red); }
.link { flex: 0 0 74px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.link-line { width: 100%; height: 4px; border-radius: 2px; background: var(--green); position: relative; }
.link-line::after { content: ""; position: absolute; right: -2px; top: -6px; border: 8px solid transparent; border-left-color: var(--green); }
.link-text { font-size: 12px; font-weight: 800; color: var(--green); letter-spacing: .05em; }
.link.broken .link-line { background: repeating-linear-gradient(90deg, var(--red) 0 8px, transparent 8px 14px); }
.link.broken .link-line::after { border-left-color: var(--red); }
.link.broken .link-text { color: var(--red); }

/* Step 6 */
.mine-left { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.mine-left .stats { grid-template-columns: 1fr; }

/* Step 7 */
.merge { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.merge table.data { font-size: 14px; }

/* Explore */
.lab-block { flex-direction: column; align-items: stretch !important; justify-content: flex-start !important; gap: 12px; overflow: auto; }

/* Ledger Watch additions (after the shared lesson stylesheet, crop.css, water.css and explorer.css). */
.snap { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; min-height: 0; height: 100%; }

.lw-side .legend { flex-direction: column; gap: 6px; }
.lw-model > div { display: flex; align-items: center; justify-content: center; }

.lw-scene { flex-direction: column; gap: 8px; }
.lw-scene .snap { height: auto; flex: 1 1 auto; min-height: 0; }
.lw-scene .legend { flex-direction: row !important; flex: none !important; }

@media (min-width: 901px) {

  .fit-stage > .floor-wrap > .wide.lw-job > .lw-side { flex: 0 0 360px; }

.lw-ask p.lang { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--teal); margin-bottom: 2px; }
.lw-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; border-radius: 8px; background: var(--panel-2); }
.lw-row p { margin: 0; }
.lw-row > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.lw-row .tag { flex: 0 0 auto; min-width: 28px; text-align: center; border-radius: 6px; padding: 2px 6px; font-size: 11px; font-weight: 800; background: #2e323d; color: var(--dim); }
.lw-row.approval { border: 1px solid rgba(251,191,36,.45); }
.lw-row.approval .tag { background: rgba(251,191,36,.18); color: #fbbf24; }
.lw-row .checklist { margin: 0; }
.tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--teal-bright, #8fd3df); word-break: break-word; }
.lw-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lw-rec { display: inline-block; border: 1.5px solid var(--vc); color: var(--vc); background: color-mix(in srgb, var(--vc) 14%, transparent);
  border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; }

const live = (() => {
// Shared controls for the three "watch it learn" labs: play/pause loop, speed switch and a gear-button settings pop-up.
// Self-contained (no imports) so every lesson page can include it.

const make = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child.nodeType ? child : String(child));
  return node;
};

const SPEEDS = {watch: 'Watch', fast: 'Fast'};
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const frame = () => new Promise(resolve => requestAnimationFrame(() => resolve()));
const pause = ms => new Promise(resolve => setTimeout(resolve, REDUCED ? 0 : ms));

function gearIcon() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  for (let k = 0; k < 8; k += 1) {
    const tooth = document.createElementNS(ns, 'rect');
    Object.entries({x: 10, y: 1.5, width: 4, height: 5, rx: 1, fill: 'currentColor', transform: `rotate(${k * 45} 12 12)`}).forEach(([a, v]) => tooth.setAttribute(a, v));
    svg.append(tooth);
  }
  const ring = document.createElementNS(ns, 'circle');
  Object.entries({cx: 12, cy: 12, r: 6.2, fill: 'none', stroke: 'currentColor', 'stroke-width': 3.6}).forEach(([a, v]) => ring.setAttribute(a, v));
  svg.append(ring);
  return svg;
}

// A pop-up panel on a native <dialog>: Esc closes it, focus is managed by the browser.
function popup(title, content, closeLabel) {
  const close = make('button', {type: 'button', class: 'pop-close', 'aria-label': closeLabel}, '\u00d7');
  const dialog = make('dialog', {class: 'settings-pop', 'aria-label': title},
    make('div', {class: 'pop-inner'}, make('div', {class: 'pop-head'}, make('h3', {}, title), close), ...content));
  close.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
  return dialog;
}

function settingsPopup(title, ...content) {
  const dialog = popup(title, content, 'Close settings');
  const gear = make('button', {type: 'button', class: 'gear-btn', 'aria-haspopup': 'dialog', title: 'Settings'}, gearIcon(), make('span', {}, 'Settings'));
  gear.addEventListener('click', () => dialog.showModal());
  return {gear, dialog};
}

function helpPopup(title, ...content) {
  const dialog = popup(title, content, 'Close explanation');
  dialog.classList.add('help-pop');
  const button = make('button', {type: 'button', class: 'help-btn', 'aria-haspopup': 'dialog', 'aria-label': `Explain: ${title}`, title: 'Explain this'}, '?');
  button.addEventListener('click', () => dialog.showModal());
  return {button, dialog};
}

function speedSwitch(value, onChange) {
  const group = make('div', {class: 'toggle live-speed', role: 'group', 'aria-label': 'Speed'});
  const render = () => group.replaceChildren(...Object.entries(SPEEDS).map(([key, label]) =>
    make('button', {type: 'button', 'aria-pressed': String(key === value), onclick: () => { value = key; render(); onChange(key); }}, label)));
  render();
  return group;
}

// Sizes a lab to exactly fill the window below its top edge, so scene, controls and panels fit on one screen.
// Narrow screens keep the normal stacked page.
let refit = null;
function fillWindow(el, {minHeight = 620, bottom = 28, narrow = 900} = {}) {
  const fit = () => {
    if (!el.isConnected) return;
    if (window.innerWidth <= narrow) { el.style.height = ''; return; }
    const top = el.getBoundingClientRect().top + window.scrollY;
    el.style.height = `${Math.max(minHeight, Math.floor(window.innerHeight - top - bottom))}px`;
  };
  if (refit) window.removeEventListener('resize', refit);
  refit = fit;
  window.addEventListener('resize', fit);
  fit();
  requestAnimationFrame(fit);
}

// Keeps a stage as wide as its scene needs at the row's full height, leaving at least `reserve` px for the side columns.
let stageObserver = null;
function sizeStage(stage, row, {ratio = 1, reserve = 560, inset = 0, narrow = 900} = {}) {
  const fit = () => {
    if (window.innerWidth <= narrow) { stage.style.width = ''; return; }
    stage.style.width = `${Math.floor(Math.max(300, Math.min((row.clientHeight - inset) * ratio, row.clientWidth - reserve)))}px`;
  };
  if (stageObserver) stageObserver.disconnect();
  stageObserver = new ResizeObserver(fit);
  stageObserver.observe(row);
  fit();
}

// Guided-lesson steps: fill the window above the Back/Next bar; square scenes (layout 'side') get a height-sized stage.
function fitLesson(body, floorWrap, {layout = 'top', ratio = 1} = {}) {
  const footer = document.querySelector('.stepnav');
  fillWindow(body, {minHeight: 380, bottom: (footer ? footer.offsetHeight : 50) + 40});
  if (layout === 'side') sizeStage(floorWrap, body, {ratio, reserve: 730, inset: 24});
}

// Runs `unit` again and again while playing. Each unit must await a frame or a timer so the page stays responsive,
// and should change the model before its last await, so a pause never leaves half a step behind.
function player({unit, alive, onChange = () => {}}) {
  let playing = false, token = 0;
  const button = make('button', {type: 'button', class: 'btn primary play-btn'});
  const draw = () => { button.textContent = playing ? '\u275a\u275a Pause' : '\u25b6 Play'; button.setAttribute('aria-pressed', String(playing)); };
  const loop = async mine => {
    while (playing && mine === token && alive()) await unit();
    if (playing && mine === token) { playing = false; draw(); onChange(false); }
  };
  const api = {
    button,
    get playing() { return playing; },
    play() { if (playing) return; playing = true; draw(); onChange(true); loop(++token); },
    stop() { if (!playing) return; playing = false; token += 1; draw(); onChange(false); },
  };
  button.addEventListener('click', () => (playing ? api.stop() : api.play()));
  draw();
  return api;
}

return {SPEEDS, REDUCED, frame, pause, settingsPopup, helpPopup, speedSwitch, fillWindow, sizeStage, fitLesson, player};
})();
// Shared page pieces for the transportation lesson pages: DOM helpers, small SVG charts and the step/lab navigation.
const SVGNS = 'http://www.w3.org/2000/svg';
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEEDS = {
  slow: {move: 700, trip: 150, batch: 70},
  normal: {move: 360, trip: 70, batch: 28},
  fast: {move: 120, trip: 18, batch: 4},
};
const page = {speed: 'normal', generation: 0, keyHandler: null, current: 0, steps: [], mountLab: null};
const timing = () => SPEEDS[page.speed];
const wait = ms => new Promise(resolve => setTimeout(resolve, REDUCED ? 0 : ms));

function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === false || value === null || value === undefined) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

function s(tag, attrs = {}, content) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (content !== undefined) node.textContent = content;
  return node;
}

const minus = n => (n < 0 ? `\u2212${Math.abs(n)}` : String(n));
const signed = n => (n > 0 ? `+${n}` : minus(n));
const money = n => `${n < 0 ? '\u2212' : ''}$${Math.abs(n).toFixed(2)}`;
const round1 = n => Math.round(n * 10) / 10;

function button(label, onclick, {primary = false, title} = {}) {
  return h('button', {class: `btn${primary ? ' primary' : ''}`, type: 'button', onclick, title}, label);
}

function card(title, ...children) {
  return h('section', {class: 'card'}, title ? h('h3', {}, title) : null, ...children);
}

function accent(title, ...children) {
  return h('section', {class: 'card accent'}, h('h3', {}, title), ...children);
}

function legend(items) {
  return h('div', {class: 'legend'}, ...items.map(([label, color]) => h('span', {style: `--swatch:${color}`}, label)));
}

function terms(pairs) {
  return h('dl', {class: 'terms'}, ...pairs.flatMap(([term, meaning]) => [h('dt', {}, term), h('dd', {}, meaning)]));
}

function dataTable(headers, rows, {numeric = []} = {}) {
  return h('table', {class: 'data'},
    h('thead', {}, h('tr', {}, ...headers.map((t, i) => h('th', {class: numeric.includes(i) ? 'num' : null}, t)))),
    h('tbody', {}, ...rows.map(row => h('tr', {class: row.className || null},
      ...row.cells.map((c, i) => h('td', {class: numeric.includes(i) ? 'num' : null}, c))))));
}

/* ── Small charts ───────────────────────────────────────────────────── */

function niceMax(value) {
  const steps = [5, 10, 20, 25, 50, 100, 150, 200, 250, 300, 400, 500, 600, 800, 1000];
  return steps.find(step => step >= value) || Math.ceil(value / 100) * 100;
}

function chartFrame(title, width, height) {

}

function axes(chart, {left, top, plotW, plotH, yMax, yLabel, xLabel, width}) {
  for (const fraction of [0, 0.5, 1]) {
    const y = top + plotH - fraction * plotH;
    chart.append(s('line', {x1: left, y1: y, x2: left + plotW, y2: y, stroke: '#2e323d', 'stroke-width': 1}));
    chart.append(s('text', {x: left - 8, y: y + 5, 'text-anchor': 'end', fill: '#858a97', 'font-size': 13}, String(Math.round(fraction * yMax))));
  }
  if (yLabel) chart.append(s('text', {x: left, y: top - 9, fill: '#b9bdc6', 'font-size': 13}, yLabel));
  if (xLabel) chart.append(s('text', {x: width - 12, y: top + plotH + 32, 'text-anchor': 'end', fill: '#b9bdc6', 'font-size': 13}, xLabel));
}

function barChart({values, ref = null, refLabel = '', max, title, yLabel = '', xLabel = '', color = '#7eaeb8', height = 210, firstIndex = 1, labels = null, valueLabels = false, width = 560}) {
  const left = 44, right = ref === null ? 14 : 96, top = 26, bottom = 38;
  const plotW = width - left - right, plotH = height - top - bottom;
  const yMax = niceMax(max ?? Math.max(1, ...values, ref ?? 0));
  const chart = chartFrame(title, width, height);
  axes(chart, {left, top, plotW, plotH, yMax, yLabel, xLabel, width});
  const slot = plotW / Math.max(values.length, 1);
  values.forEach((v, index) => {
    const barH = Math.max(1.5, (Math.min(v, yMax) / yMax) * plotH);
    const fill = Array.isArray(color) ? color[index] : color;
    chart.append(s('rect', {x: left + index * slot + slot * 0.15, y: top + plotH - barH, width: slot * 0.7, height: barH, rx: 2, fill}));
    if (valueLabels) chart.append(s('text', {x: left + index * slot + slot / 2, y: top + plotH - barH - 6, 'text-anchor': 'middle', fill: '#f5f3f0', 'font-size': 13, 'font-weight': 700}, typeof valueLabels === 'function' ? valueLabels(v) : String(v)));
    const label = labels ? labels[index] : firstIndex + index;
    if (labels || values.length <= 20 || label === firstIndex || label % 10 === 0) {
      chart.append(s('text', {x: left + index * slot + slot / 2, y: top + plotH + 17, 'text-anchor': 'middle', fill: '#858a97', 'font-size': 12}, String(label)));
    }
  });
  if (ref !== null) {
    const y = top + plotH - (ref / yMax) * plotH;
    chart.append(s('line', {x1: left, y1: y, x2: left + plotW + 4, y2: y, stroke: '#e8913c', 'stroke-width': 2, 'stroke-dasharray': '7 6'}));
    chart.append(s('text', {x: left + plotW + 8, y: y + 5, fill: '#e8913c', 'font-size': 13, 'font-weight': 700}, refLabel));
  }
  return chart;
}

function lineChart({series, xMax, yMax, title, yLabel, xLabel, height = 240, refs = []}) {
  const width = 560;
  const left = 44, right = refs.length ? 110 : 18, top = 40, bottom = 38;
  const plotW = width - left - right, plotH = height - top - bottom;
  const chart = chartFrame(title, width, height);
  axes(chart, {left, top, plotW, plotH, yMax, yLabel, xLabel, width});
  for (const x of [0, xMax / 2, xMax]) {
    chart.append(s('text', {x: left + (x / xMax) * plotW, y: top + plotH + 17, 'text-anchor': 'middle', fill: '#858a97', 'font-size': 12}, String(x)));
  }
  for (const ref of refs) {
    const y = top + plotH - (Math.min(ref.value, yMax) / yMax) * plotH;
    chart.append(s('line', {x1: left, y1: y, x2: left + plotW + 4, y2: y, stroke: ref.color, 'stroke-width': 2, 'stroke-dasharray': '7 6'}));
    chart.append(s('text', {x: left + plotW + 8, y: y + 5, fill: ref.color, 'font-size': 12, 'font-weight': 700}, ref.label));
  }
  for (const line of series) {
    if (!line.points.length) continue;
    const pts = line.points.map(([x, y]) => `${left + (x / xMax) * plotW},${top + plotH - (Math.min(y, yMax) / yMax) * plotH}`);
    chart.append(s('polyline', {points: pts.join(' '), fill: 'none', stroke: line.color, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-dasharray': line.dash || ''}));
  }
  let lx = width - right;
  for (const line of [...series].reverse()) {
    lx -= 26 + line.name.length * 7.4;
    chart.append(s('rect', {x: lx, y: 9, width: 16, height: 5, fill: line.color}));
    chart.append(s('text', {x: lx + 21, y: 16, fill: '#b9bdc6', 'font-size': 13}, line.name));
  }
  return chart;
}

function showMode(mode) {
  const lab = mode === 'lab';

function routeFromHash() {
  const hash = location.hash.slice(1);

function showError(message) {
  const banner = document.getElementById('error-banner');
  banner.textContent = `Something went wrong (${message}). Reload the page before continuing; do not trust the current result.`;
  banner.hidden = false;
}

function startPage(steps, mountLab, {layout = 'top', ratio = 1} = {}) {
  page.steps = steps;
  page.mountLab = mountLab;
  page.layout = layout;
  page.ratio = ratio;
  document.getElementById('mode-lesson').addEventListener('click', () => showMode('lesson'));
  document.getElementById('mode-lab').addEventListener('click', () => showMode('lab'));
  document.getElementById('back').addEventListener('click', () => { renderStep(page.current - 1); window.scrollTo({top: 0}); });
  document.getElementById('next').addEventListener('click', () => { renderStep(page.current + 1); window.scrollTo({top: 0}); });
  document.getElementById('speed').addEventListener('change', event => { page.speed = event.target.value; });
  window.addEventListener('keydown', event => {
    const tag = (event.target.tagName || '').toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag)) return;
    if (page.keyHandler) page.keyHandler(event);
  });
  window.addEventListener('hashchange', routeFromHash);
  window.addEventListener('error', event => showError(event.message));
  window.addEventListener('unhandledrejection', event => showError(String(event.reason)));
  routeFromHash();
}

// One 64-byte block of the compression function; `state` is updated in place.
function compress(state, bytes, offset) {
  for (let i = 0; i < 16; i += 1) {
    const j = offset + i * 4;

  for (let i = 16; i < 64; i += 1) {
    const a = W[i - 15], b = W[i - 2];
    const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
    const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
    W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
  }
  let [a, b, c, d, e, f, g, hh] = state;
  for (let i = 0; i < 64; i += 1) {
    const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
    const t1 = (hh + S1 + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
    const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
    const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
    hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;

  state[4] = (state[4] + e) | 0; state[5] = (state[5] + f) | 0; state[6] = (state[6] + g) | 0; state[7] = (state[7] + hh) | 0;

function pad(bytes) {

function digest(state) {

const utf8 = text => new TextEncoder().encode(text);

const toHex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
function fromHex(hex) {

/* ── Block headers ───────────────────────────────────────────────── */
const u32le = (out, off, v) => { out[off] = v & 255; out[off + 1] = (v >>> 8) & 255; out[off + 2] = (v >>> 16) & 255; out[off + 3] = (v >>> 24) & 255; };
const readU32le = (b, off) => (b[off] | (b[off + 1] << 8) | (b[off + 2] << 16) | (b[off + 3] << 24)) >>> 0;

const HEADER_FIELDS = [
  {key: 'version', bytes: 4, name: 'Version', plain: 'Which rules this block follows'},
  {key: 'prev', bytes: 32, name: 'Previous block', plain: 'The fingerprint of the block before: the link in the chain'},
  {key: 'merkle', bytes: 32, name: 'Merkle root', plain: 'One fingerprint of every transaction in the block'},
  {key: 'time', bytes: 4, name: 'Time', plain: 'When the miner says it built the block'},
  {key: 'bits', bytes: 4, name: 'Target', plain: 'How small the hash must be (the difficulty)'},
  {key: 'nonce', bytes: 4, name: 'Nonce', plain: 'The number a miner keeps changing until the hash is small enough'},
];

function parseHeader(hex) {
  const b = fromHex(hex);
  return {version: readU32le(b, 0), prev: displayHash(b.slice(4, 36)), merkle: displayHash(b.slice(36, 68)),
    time: readU32le(b, 68), bits: readU32le(b, 72), nonce: readU32le(b, 76)};
}

function headerBytes(f) {
  const out = new Uint8Array(80);
  u32le(out, 0, f.version);
  out.set(reverse(fromHex(f.prev)), 4);
  out.set(reverse(fromHex(f.merkle)), 36);
  u32le(out, 68, f.time); u32le(out, 72, f.bits); u32le(out, 76, f.nonce);
  return out;
}

function targetFromBits(bits) {

/* ── Merkle trees ────────────────────────────────────────────────── */
function merkleLevels(txids) {
  const levels = [txids.map(t => reverse(fromHex(t)))];
  while (levels[levels.length - 1].length > 1) {
    const cur = levels[levels.length - 1], next = [];
    for (let i = 0; i < cur.length; i += 2) {
      const right = cur[i + 1] || cur[i]; // an odd node is paired with itself
      const joined = new Uint8Array(64);
      joined.set(cur[i]); joined.set(right, 32);
      next.push(dsha(joined));
    }
    levels.push(next);
  }
  return levels;
}
const merkleRoot = txids => displayHash(merkleLevels(txids).at(-1)[0]);

function merkleProof(levels, index) {
  const proof = [];
  let i = index;
  for (let d = 0; d < levels.length - 1; d += 1) {
    const level = levels[d], sibling = i % 2 ? i - 1 : Math.min(i + 1, level.length - 1);
    proof.push({level: d, index: sibling, side: i % 2 ? 'left' : 'right', hash: displayHash(level[sibling])});
    i = Math.floor(i / 2);

  return proof;
}

function verifyProof(txid, proof) {
  let node = reverse(fromHex(txid));
  for (const step of proof) {
    const sib = reverse(fromHex(step.hash)), joined = new Uint8Array(64);
    if (step.side === 'left') { joined.set(sib); joined.set(node, 32); } else { joined.set(node); joined.set(sib, 32); }
    node = dsha(joined);
  }
  return displayHash(node);
}

/* ── Transactions (the 2009 format: no SegWit) ───────────────────── */
function readVarint(b, off) {
  const first = b[off];
  if (first < 0xfd) return [first, 1];
  if (first === 0xfd) return [b[off + 1] | (b[off + 2] << 8), 3];
  return [readU32le(b, off + 1), 5];
}

function parseTx(hex) {
  const b = fromHex(hex);
  let off = 4;
  const [nIn, a] = readVarint(b, off); off += a;
  for (let k = 0; k < nIn; k += 1) {
    off += 36;
    const [len, c] = readVarint(b, off); off += c + len + 4;
  }
  const [nOut, d] = readVarint(b, off); off += d;
  const outputs = [];
  for (let k = 0; k < nOut; k += 1) {
    let sats = 0;
    for (let j = 7; j >= 0; j -= 1) sats = sats * 256 + b[off + j];
    outputs.push({offset: off, sats});
    off += 8;
    const [len, c] = readVarint(b, off); off += c + len;
  }
  return {outputs};
}

function setOutputSats(hex, index, sats) {
  const b = fromHex(hex), off = parseTx(hex).outputs[index].offset;
  let v = sats;
  for (let j = 0; j < 8; j += 1) { b[off + j] = v % 256; v = Math.floor(v / 256); }
  return toHex(b);
}

/* ── Mining ──────────────────────────────────────────────────────── */
// Fast double SHA-256 for many nonces of one header: the first 64 bytes never change, so hash them once (the "midstate").
function makeMiner(fields) {
  const header = headerBytes(fields);
  const mid = Int32Array.from(IV);
  compress(mid, header, 0);
  const tail = new Uint8Array(64);
  tail.set(header.subarray(64, 80));
  tail[16] = 0x80; tail[62] = 0x02; tail[63] = 0x80; // 80 bytes = 640 bits
  const second = new Uint8Array(64);
  second[32] = 0x80; second[62] = 0x01; second[63] = 0x00; // 32 bytes = 256 bits
  const st = new Int32Array(8), st2 = new Int32Array(8);
  // Returns the display hash for one nonce.
  const hashAt = nonce => {
    u32le(tail, 12, nonce >>> 0);
    st.set(mid); compress(st, tail, 0);
    for (let i = 0; i < 8; i += 1) { second[i * 4] = st[i] >>> 24; second[i * 4 + 1] = (st[i] >>> 16) & 255; second[i * 4 + 2] = (st[i] >>> 8) & 255; second[i * 4 + 3] = st[i] & 255; }
    st2.set(IV); compress(st2, second, 0);
    return st2;
  };
  // Leading zero hex digits of the display hash = zeros at the END of the raw digest.
  const zerosOf = s => {
    let z = 0;
    for (let i = 7; i >= 0; i -= 1) {
      const w = s[i] >>> 0;
      const bytes = [w & 255, (w >>> 8) & 255, (w >>> 16) & 255, w >>> 24];
      for (const by of bytes) {
        if (by === 0) { z += 2; continue; }
        return z + (by < 16 ? 1 : 0);
      }
    }
    return z;
  };
  return {
    // Try `count` nonces from `start`; stop at the first hash with at least `zeros` leading zero hex digits.
    search(start, count, zeros) {
      let best = -1, bestNonce = start;
      for (let n = start; n < start + count; n += 1) {
        const z = zerosOf(hashAt(n));
        if (z > best) { best = z; bestNonce = n; }
        if (z >= zeros) return {found: true, nonce: n >>> 0, tried: n - start + 1, best, bestNonce};
      }
      return {found: false, tried: count, best, bestNonce};
    },
    hashOf: nonce => displayHash(digest(hashAt(nonce))),
  };
}

/* ── Agreement: the attacker race from the Bitcoin white paper (section 11) ── */
function attackerSuccess(q, z) {
  const p = 1 - q;
  if (q >= p) return 1;
  const lambda = z * (q / p);
  let sum = 1, poisson = Math.exp(-lambda);
  for (let k = 0; k <= z; k += 1) {
    if (k > 0) poisson *= lambda / k;
    sum -= poisson * (1 - (q / p) ** (z - k));
  }
  return Math.max(0, sum);
}

// Recall Desk pictures: the supply network, a record card, the inclusion proof, the AI's table and the batch timeline.

const C = {teal: '#7eaeb8', orange: '#e8913c', red: '#e5675f', green: '#7cc59a', amber: '#fbbf24', purple: '#b197fc', dim: '#b9bdc6', faint: '#858a97',
  line: '#2e323d', text: '#f5f3f0', panel2: '#222530', ghost: '#3d424e'};
const commas = n => Math.round(n).toLocaleString('en-US');
const short = (hex, n = 10) => `${hex.slice(0, n)}…${hex.slice(-6)}`;
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const niceDate = iso => { const [, m, d] = iso.split('-').map(Number); return `${MONTH[m - 1]} ${d}`; };

// The same fingerprint the anchoring script used: sha256 of the record's JSON with its keys sorted.
const canonical = obj => JSON.stringify(obj, Object.keys(obj).sort());
const leafOf = record => toHex(sha256(utf8(canonical(record))));

// Walk an inclusion proof and keep every intermediate fingerprint, for display.
function proofWalk(leaf, proof) {
  let node = reverse(fromHex(leaf));
  const steps = [];
  for (const p of proof) {
    const sib = reverse(fromHex(p.hash)), joined = new Uint8Array(64);
    if (p.side === 'left') { joined.set(sib); joined.set(node, 32); } else { joined.set(node); joined.set(sib, 32); }
    node = dsha(joined);
    steps.push({...p, result: displayHash(node)});
  }
  return {steps, root: displayHash(node)};
}

function chip(hex, {tone = '', n = 12, label = null} = {}) {
  return h('code', {class: `hash tiny ${tone}`, title: hex}, label ? h('span', {class: 'chip-label'}, label) : null, short(hex, n));
}

function mark(ok, yes = 'matches', no = 'does not match') {
  return h('strong', {class: ok ? 'good-word' : 'bad-word'}, ok ? `✓ ${yes}` : `✗ ${no}`);
}

/* ── The supply network ───────────────────────────────────────────── */
function networkPicture(F, W, {trace = false, width = 900, height = 470} = {}) {
  const svg = s('svg', {viewBox: `0 0 ${width} ${height}`, class: 'xchart network', role: 'img',
    'aria-label': trace ? `Forward trace: ${F.answer.farmName} field 2 to ${F.forward.stores.length} stores` : `${W.fields.length} farm fields, 2 coolers, 1 salad maker, 3 distribution centers and 24 stores`});
  const top = 42, bottom = height - 18;
  const col = (items, x) => items.map((it, i) => ({...it, x, y: top + (i + 0.5) * (bottom - top) / items.length}));
  const fields = col(W.fields, 120), coolers = col(W.coolers, 330), proc = col([W.processor], 500), dcs = col(W.dcs, 650), stores = col(W.stores, 820);
  const at = Object.fromEntries([...fields, ...coolers, ...proc, ...dcs, ...stores].map(n => [n.id, n]));
  const reached = new Set(F.forward.stores), bad = `${F.answer.farm}-${F.answer.field}`;
  const hot = id => !trace || id === bad || id === 'VC2' || id === 'GC' || F.forward.dcs.includes(id) || reached.has(id);
  const edge = (a, b, on) => svg.append(s('line', {x1: at[a].x, y1: at[a].y, x2: at[b].x, y2: at[b].y, stroke: on ? C.orange : '#3a3f4b',
    'stroke-width': on ? 2.4 : 1.1, opacity: on ? 1 : trace ? 0.45 : 0.9}));
  for (const f of fields) edge(f.id, f.cooler, trace && f.id === bad);
  for (const c of coolers) edge(c.id, 'GC', trace && c.id === 'VC2');
  for (const d of dcs) edge('GC', d.id, trace && F.forward.dcs.includes(d.id));
  for (const st of stores) edge(st.dc, st.id, trace && reached.has(st.id));
  for (const [x, label] of [[120, 'Farm fields'], [330, 'Coolers'], [500, 'Salad maker'], [650, 'Warehouses'], [820, 'Stores']]) {
    svg.append(s('text', {x, y: 22, 'text-anchor': 'middle', fill: C.faint, 'font-size': 13, 'font-weight': 700}, label));
  }
  const node = (n, r, fill, label, anchor = 'end', dx = -12) => {
    svg.append(s('circle', {cx: n.x, cy: n.y, r, fill: hot(n.id) ? fill : C.ghost, stroke: '#111318', 'stroke-width': 1.5}));
    if (label) svg.append(s('text', {x: n.x + dx, y: n.y + 4, 'text-anchor': anchor, fill: hot(n.id) ? C.text : C.faint, 'font-size': 12}, label));
  };
  for (const f of fields) node(f, f.id === bad && trace ? 8 : 6, f.id === bad && trace ? C.orange : C.green, f.label);
  for (const c of coolers) node(c, 10, C.teal, c.label, 'middle', 0), svg.lastChild.setAttribute('y', c.y - 16);
  node(proc[0], 12, C.teal, proc[0].label, 'middle', 0); svg.lastChild.setAttribute('y', proc[0].y - 20);
  for (const d of dcs) node(d, 9, C.teal, d.label, 'middle', 0), svg.lastChild.setAttribute('y', d.y - 15);
  for (const st of stores) {
    node(st, 4.5, C.dim, null);
    const n = W.caseCount[st.id] || 0;
    if (n) {
      svg.append(s('circle', {cx: st.x, cy: st.y, r: 4 + Math.sqrt(n) * 2.2, fill: 'none', stroke: C.red, 'stroke-width': 2}));
      svg.append(s('text', {x: st.x + 16, y: st.y + 4, fill: C.red, 'font-size': 11, 'font-weight': 700}, String(n)));
    }
  }
  return svg;
}

/* ── A record, with optional editable fields ──────────────────────── */
const LABELS = {cte: 'Event', company: 'Recorded by', date: 'Date', time: 'Time', product: 'Product', quantity: 'Quantity', unit: 'Unit', field: 'Field',
  farm: 'Farm', harvest_lot: 'Harvest lot', on_behalf_of: 'On behalf of', source_doc: 'Source document', tlc: 'Lot code', inputs: 'Inputs',
  ship_from: 'From', ship_to: 'To', reference: 'Reference', location: 'Location', corrects: 'Corrects record', field_changed: 'Field changed',
  was: 'Was', now: 'Now', reason: 'Reason', id: 'Record', day: 'Day'};
function recordCard(rec, {editable = [], original = null, onEdit = null, title = null, tone = '', hide = [], names = {}} = {}) {
  const rows = Object.entries(rec).filter(([k, v]) => v !== null && k !== 'day' && !hide.includes(k)).map(([k, v]) => {
    const changed = original && String(original[k]) !== String(v);
    const value = editable.includes(k)
      ? h('input', {class: `rec-in${changed ? ' changed' : ''}`, value: String(v), 'aria-label': LABELS[k] || k, type: typeof v === 'number' ? 'number' : 'text',
        oninput: e => { e.target.classList.toggle('changed', original && String(original[k]) !== e.target.value); onEdit(k, typeof v === 'number' ? Number(e.target.value) : e.target.value); }})
      : h('span', {class: changed ? 'changed' : ''}, Array.isArray(v) ? v.join(', ') : k === 'company' ? (names[v] || v) : String(v));
    return [h('dt', {}, LABELS[k] || k), h('dd', {}, value)];
  });
  return h('section', {class: `rec-card ${tone}`}, title ? h('h4', {class: 'table-title'}, title) : null, h('dl', {class: 'rec'}, ...rows.flat()));
}

/* ── The inclusion proof, step by step ────────────────────────────── */
// Every fingerprint above an edited record changes (red); the neighbors' fingerprints never do (teal).
function proofPicture(leaf, proof, anchoredRoot, {count, block, tx, company, date, originalLeaf = leaf} = {}) {
  const walk = proofWalk(leaf, proof), before = proofWalk(originalLeaf, proof);
  const ok = walk.root === anchoredRoot;
  return h('div', {class: 'proof'},
    h('div', {class: 'proof-row'}, h('span', {class: 'blabel'}, 'Record'), chip(leaf, {tone: leaf === originalLeaf ? '' : 'bad', n: 14})),
    ...walk.steps.map((st, i) => h('div', {class: 'proof-row step'}, h('span', {class: 'blabel'}, `Step ${i + 1} \u00b7 ${st.side}`),
      h('div', {class: 'proof-pair'}, chip(st.hash, {tone: 'sib', n: 8}), h('span', {class: 'arrow'}, '\u2192'), chip(st.result, {tone: st.result === before.steps[i].result ? '' : 'bad', n: 8})))),
    h('div', {class: `proof-root ${ok ? 'good' : 'bad'}`},
      h('div', {class: 'proof-row'}, h('span', {class: 'blabel'}, 'Computed here'), chip(walk.root, {tone: ok ? 'good' : 'bad', n: 14})),
      h('div', {class: 'proof-row'}, h('span', {class: 'blabel'}, `On the chain \u00b7 block ${block}`), chip(anchoredRoot, {tone: 'good', n: 14})),
      h('p', {class: 'proof-verdict'}, mark(ok, 'Matches: exactly what was anchored', 'No match: not what was anchored')),
      h('p', {class: 'small muted'}, `${company}, ${date}: ${proof.length} neighbor fingerprints prove 1 of ${count} records without showing the others. Tx ${short(tx, 8)}.`)));
}

/* ── The AI's reading, cell by cell ───────────────────────────────── */
function readingTable(run, truth, smudgedRow) {
  const cols = [['date', 'Date'], ['harvest_lot', 'Lot code'], ['quantity', 'Cartons'], ['time', 'Start']];
  return h('table', {class: 'data reading'},
    h('thead', {}, h('tr', {}, h('th', {}, '#'), ...cols.map(([, t]) => h('th', {}, t)))),
    h('tbody', {}, ...truth.map((t, i) => {
      const got = run.rows[i] || {};
      return h('tr', {class: i + 1 === smudgedRow ? 'flagged' : ''}, h('td', {}, String(i + 1)),
        ...cols.map(([k]) => {
          const ok = String(got[k]) === String(t[k]);
          return h('td', {class: ok ? 'ok' : 'wrong', title: ok ? 'matches the paper' : `paper says ${t[k]}`}, String(got[k] ?? '—'), i + 1 === smudgedRow && k === 'harvest_lot' ? h('span', {class: 'flag'}, ' ⚑') : null);
        }));

}

/* global F, NET, EV, BATCH, IMG */
const byId = Object.fromEntries(EV.map(e => [e.id, e]));
const stat = (value, label) => h('div', {class: 'stat'}, h('b', {}, value), h('span', {}, label));
const FW = F.forward, AN = F.answer, T = F.target, AI = F.ai, FX = F.correction, M8 = F.m8;
const company = id => NET.names[id] || id;
const TRUTH_ROWS = EV.filter(e => e.cte === 'Harvesting' && e.farm === 'KM').sort((a, b) => a.day - b.day || a.time.localeCompare(b.time));

function toggle(options, value, onChange, label) {
  const group = h('div', {class: 'toggle', role: 'group', 'aria-label': label});
  const render = () => group.replaceChildren(...options.map(([key, text]) =>
    h('button', {type: 'button', 'aria-pressed': String(key === value), onclick: () => { value = key; render(); onChange(key); }}, text)));
  render();
  return group;
}

// One batch: its records' fingerprints, the proof for one record, and the root the company anchored.
function proofFor(batch, record) {
  const leaves = batch.ids.map(id => (id === record.id ? leafOf(record) : leafOf(byId[id])));
  const index = batch.ids.indexOf(record.id);
  return {leaf: leaves[index], proof: merkleProof(merkleLevels(leaves), index)};
}

/* ── Step 2 · Tamper ──────────────────────────────────────────────── */
function mountTamper(ctx) {
  const original = byId[T.id], batch = BATCH[`${T.company}|${T.day}`];

  const left = h('div', {class: 'tamper-left'}), right = h('div', {class: 'tamper-right'});
  ctx.floorWrap.append(h('div', {class: 'wide tamper'}, left, right));
  const draw = (rebuildLeft = true) => {
    const {leaf, proof} = proofFor(batch, rec);
    const changed = leaf !== T.leaf;
    if (rebuildLeft) left.replaceChildren(recordCard(rec, {editable: ['quantity', 'harvest_lot', 'time'], original, names: NET.names, hide: ['product', 'unit', 'farm', 'on_behalf_of', 'field'], title: `Record ${T.id} · typed in from the paper log`, onEdit: (k, v) => { rec = {...rec, [k]: v}; draw(false); }}));

    card('Each company anchors its own records', h('p', {}, `Every record is signed by the company that made it. Once a day each company puts one fingerprint (the Merkle root) of its records in a small contract: ${F.chain.batches} daily roots for ${commas(F.chain.records)} records.`),

    card('What the check needs', terms([['The record', 'as the company shows it'], ['A short proof', `${Math.ceil(Math.log2(batch.ids.length))} neighbor fingerprints`], ['The chain', 'the root anchored that day']])),
    accent('Tampering is caught', h('p', {}, 'Change one digit, one letter, one minute, and the fingerprint no longer leads to the anchored root. Nobody can quietly edit a record after the fact.')));
}

    ['Proves', `Who recorded what, and when; and that nothing changed afterward (step 2). ${F.chain.signaturesVerified} signatures and ${F.chain.batches} roots check out.`, 'good'],
    ['Does not prove', 'That a record is true (step 4), that the AI read the paper right (step 3), or that a copy of a file is the same picture (step 5).', 'warn'],
    ['Costs', `Every company must join, sign and keep keys safe; corrections need a process. A shared database run by one trusted party gives step 2 too, if everyone trusts that party.`, 'mixed'],
    ['Who decides', 'The clerk who signs the AI’s reading. The recall team that names the lots. The FDA, which can order a recall.', 'mixed'],
  ];
  ctx.floorWrap.append(h('div', {class: 'tests-grid'}, ...cards.map(([q, text, tone]) => h('section', {class: `test-card ${tone}`}, h('h3', {}, q), h('p', {}, text)))));
  ctx.controls.append(h('p', {class: 'small'}, 'The ledger guards the AI’s inputs, up to a point.'));
  ctx.explain.append(
    card('Real anchors (check before quoting)', h('ul', {class: 'checklist small'}, h('li', {}, 'FDA Food Traceability Rule (FSMA 204): records of key events, shared within 24 hours of a request'),
      h('li', {}, 'Walmart traced mangoes in seconds instead of days (IBM Food Trust pilot)'), h('li', {}, 'TradeLens, a shipping ledger, shut down in 2022 for lack of members'))),
    card('This page', h('p', {class: 'small'}, `A fictional world in real cryptography: ${F.chain.records} records, ${F.chain.batches} anchored batches, ${AI.n} recorded ${AI.model} readings, and the real Module 8 files.`)),
    accent('Your call', h('p', {}, 'Would GreenCrate’s suppliers join a shared ledger, or would a database run by the FDA be enough? What would make a farm keep its keys safe?')));
}

const steps = [
  {id: 'job', label: 'The job', stage: 'Stage 1 \u00b7 The job', title: 'Sick shoppers. Which lots do we pull?', lead: `${F.world.cases} illnesses, ${F.world.stores} stores, ${F.world.farms} farms. Fictional, but shaped like the FDA\u2019s food tracing rules.`,
    story: 'Shoppers are sick after eating bagged salad. A recall team must decide which lots to pull. An AI that reads pictures (Module 8\u2019s kind) typed in a farm\u2019s paper log; every company sealed its records on a ledger. The recall team decides.',
    words: [['Lot', 'One batch of produce with its own code, so it can be traced.'], ['Recall', 'Pulling specific lots off the shelves.'], ['Traceback', 'Following the records from a sick shopper\u2019s store back to the farm.']], mount: mountJob},
  {id: 'tamper', label: 'Tampering is caught', stage: 'Stage 2 \u00b7 Integrity', title: 'Change one record. The chain notices.', lead: 'Edit one number in a sealed record and watch the check fail.', deeper: true,
    remember: 'Once a company seals its day\u2019s records on the chain, nobody can quietly edit one later.',
    words: [['Fingerprint (hash)', 'A short code made from a record. Change one digit and the code is new.'], ['Anchored', 'Sealed: the day\u2019s one fingerprint was written into the chain.'], ['Proof', 'The few neighbor fingerprints that connect one record to that seal.']], mount: mountTamper},
  {id: 'ai', label: 'The AI reads paper', stage: 'Stage 3 \u00b7 AI input', title: 'An AI types in the paper log.', lead: `${AI.n} recorded runs of ${AI.model} reading a handwritten log with one smudged lot code.`,
    words: [['Vision model', 'An AI that reads pictures, like the image models in Module 8.'], ['Smudge', 'One lot code is half hidden; the model has to guess the field number.'], ['Flagged', 'The model said \u201cI am not sure about this one\u201d.']], mount: mountAI},
  {id: 'truth', label: 'Integrity is not truth', stage: 'Stage 4 \u00b7 Limits', title: 'A wrong record, preserved perfectly.', lead: 'What if a person approves the wrong reading? The chain keeps it exactly.',
    words: [['Integrity', 'Nothing was changed after it was sealed. The chain proves this.'], ['Oracle problem', 'A chain cannot check whether a record was true when it was written.'], ['Correction', 'A new record that points to the old one. The old one stays.']], mount: mountTruth},
  {id: 'follow', label: 'Hashes and copies', stage: 'Stage 4 \u00b7 Limits', title: 'A fingerprint follows bytes, not pictures.', deeper: true,
    lead: 'Leaving the salad for a minute: the same fingerprint idea, applied to the car picture the class made in Module 8. One resize, and the ledger no longer knows the file.',
    remember: 'A chain can prove an exact file existed. It cannot recognize a copy of it.',
    words: [['Bytes', 'The exact file. Resize a picture and the bytes are all new.'], ['Content Credentials', 'A signed label inside a file saying who made it (Module 8). It fell off at the resize.']], mount: mountFollow},
  {id: 'proves', label: 'What it proves', stage: 'Stage 5 \u00b7 Use and limits', title: 'What the ledger proves, and who decides.', lead: 'The ledger guards the AI\u2019s inputs: what it can and cannot do.',
    words: [['Proves / does not prove', 'Unchanged since it was sealed: yes. True: no.'], ['Shared database', 'The simpler option when everyone trusts one keeper of the records.']], mount: mountProves},
];

/* ── Check any record (second tab) ───────────────────────────────── */
function mountLab(root) {
  const companies = [...new Set(Object.values(BATCH).map(b => b.company))];
  const state = {company: 'VC2', day: 5, id: T.id, edits: {}};
  const side = h('div', {class: 'lab-side'}), proofSlot = h('div', {class: 'scene lab-proof'});
  const status = h('p', {class: 'status', 'aria-live': 'polite'});
  const pickC = h('select', {'aria-label': 'Company', onchange: e => { state.company = e.target.value; pickBatch(); }}, ...companies.map(c => h('option', {value: c, selected: c === state.company}, company(c))));
  const pickD = h('select', {'aria-label': 'Day', onchange: e => { state.day = Number(e.target.value); pickBatch(); }});
  const pickR = h('select', {'aria-label': 'Record', onchange: e => { state.id = e.target.value; state.edits = {}; draw(); }});
  function pickBatch() {
    const days = Object.values(BATCH).filter(b => b.company === state.company).map(b => b.day).sort((a, b) => a - b);
    if (!days.includes(state.day)) state.day = days[0];
    pickD.replaceChildren(...days.map(d => h('option', {value: d, selected: d === state.day}, niceDate(BATCH[`${state.company}|${d}`].date))));
    const b = BATCH[`${state.company}|${state.day}`];
    if (!b.ids.includes(state.id)) state.id = b.ids[0];
    state.edits = {};
    pickR.replaceChildren(...b.ids.map(id => h('option', {value: id, selected: id === state.id}, `${id} · ${byId[id].cte}`)));
    draw();
  }
  function draw(rebuild = true) {
    const b = BATCH[`${state.company}|${state.day}`], original = byId[state.id], rec = {...original, ...state.edits};
    const {leaf, proof} = proofFor(b, rec);
    if (rebuild) side.replaceChildren(recordCard(rec, {editable: Object.keys(original).filter(k => ['quantity', 'time', 'tlc', 'harvest_lot', 'reference'].includes(k) && original[k] !== null), original,
      names: NET.names, title: `${company(b.company)} · ${niceDate(b.date)} · ${b.ids.length} records`, onEdit: (k, v) => { state.edits[k] = v; draw(false); }}));
    proofSlot.replaceChildren(proofPicture(leaf, proof, b.root, {count: b.ids.length, block: b.block, tx: b.tx, company: company(b.company), date: niceDate(b.date), originalLeaf: leafOf(original)}));
    status.innerHTML = leaf === leafOf(original) ? `Record ${state.id} matches the root ${company(b.company)} anchored in block ${b.block}.` : `<strong>Edited.</strong> Record ${state.id} no longer matches block ${b.block}.`;
  }
  const layout = h('div', {class: 'live-lab'},
    h('div', {class: 'live-head'}, h('div', {},
      h('p', {class: 'step-kicker'}, 'Recall desk · check any record'),
      h('h2', {}, `Any of the ${commas(F.chain.records)} records, against the chain.`),
      h('p', {class: 'lead'}, 'Pick a company, a day and a record. Edit a value and watch the proof fail.'))),
    h('div', {class: 'live-bar'}, h('div', {class: 'controls live-controls lab-picks'}, h('label', {}, 'Company ', pickC), h('label', {}, 'Day ', pickD), h('label', {}, 'Record ', pickR)), status),
    h('div', {class: 'live-main recall-lab'}, side, proofSlot),
    card('Things to try', h('ol', {class: 'steps-list small'},
      h('li', {}, 'Find the GreenCrate record that made salad lot GC-0307-A. Which packed lots went into it?'),
      h('li', {}, 'Change a time by one minute. How many proof steps turn red?'),
      h('li', {}, 'Which company anchored the most records in one day?'))));
  root.replaceChildren(layout);
  pickBatch();
}

startPage(withWords(steps), mountLab, {layout: 'top'});

</script>
