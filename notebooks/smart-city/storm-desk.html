<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Desk: AI flood alerts</title>
<style>
:root {
  --bg: #111318;
  --panel: #181a20;
  --panel-2: #222530;
  --line: #2e323d;
  --text: #f5f3f0;
  --dim: #b9bdc6;
  --faint: #858a97;
  --orange: #e8913c;
  --orange-soft: #3a2a17;
  --teal: #7eaeb8;
  --teal-bright: #a8d4dd;
  --red: #e5675f;
  --green: #7cc59a;
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-size: 17px; line-height: 1.45; }
button, select, input { font: inherit; }
[hidden] { display: none !important; }

.top {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  max-width: 1440px; margin: 0 auto; padding: 18px 32px 14px;
  border-bottom: 1px solid var(--line);
}
.brand { flex: 1 1 380px; }
.kicker { margin: 0; color: var(--teal); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.brand h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.15; }
.modes { display: flex; gap: 6px; }
.modes button, .speed select {
  min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--dim); cursor: pointer;
}
.modes button[aria-selected="true"] { background: var(--panel-2); color: var(--text); border-color: var(--teal); }
.speed { color: var(--dim); font-size: 15px; }
.speed select { margin-left: 6px; min-height: 40px; padding: 6px 10px; }

main { max-width: 1440px; margin: 0 auto; padding: 14px 32px 28px; }

.chapters { display: flex; gap: 6px; list-style: none; margin: 0 0 14px; padding: 0; flex-wrap: wrap; }
.chapters button {
  display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px 6px 6px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; font-size: 15px;
}
.chapters .num {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--faint); font-size: 14px; font-weight: 700;
}
.chapters button[aria-current="step"] { color: var(--text); border-color: var(--orange); }
.chapters button[aria-current="step"] .num { background: var(--orange); border-color: var(--orange); color: #1b1206; }
.chapters button.done .num { border-color: var(--teal); color: var(--teal); }

.step-kicker { margin: 0; color: var(--orange); font-size: 14px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.step-head h2 { margin: 4px 0 6px; font-size: 32px; line-height: 1.15; }
.lead { margin: 0 0 14px; color: var(--dim); font-size: 19px; max-width: 1000px; }

.step-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.95fr); gap: 22px; align-items: start; }
.stage-col { min-width: 0; }
.floor-wrap {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
  display: grid; place-items: center;
}
.floor-wrap.pair { grid-template-columns: 1fr 1fr; gap: 10px; }
svg.floor { width: 100%; height: auto; max-height: 440px; display: block; user-select: none; }
svg.floor.big { max-height: 470px; }
.floor-caption { margin: 8px 4px 0; color: var(--faint); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 4px 0; color: var(--dim); font-size: 14px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--swatch); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
.btn {
  min-height: 46px; padding: 9px 18px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); cursor: pointer; font-weight: 600;
}
.btn:hover:not(:disabled) { border-color: var(--teal); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #1b1206; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn:focus-visible, .chapters button:focus-visible, .modes button:focus-visible, .pad button:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
.btn .n { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: rgba(0,0,0,.25); font-size: 13px; }

.pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 48px); gap: 6px; }
.pad button { border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; }
.pad button:disabled { opacity: .4; }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }

.status { min-height: 26px; margin: 10px 4px 0; color: var(--dim); font-size: 16px; }
.status strong { color: var(--text); }

.explain { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.card h3 { margin: 0 0 8px; font-size: 14px; color: var(--teal); letter-spacing: .07em; text-transform: uppercase; }
.card p { margin: 0 0 8px; }
.card p:last-child { margin-bottom: 0; }
.card.accent { border-color: var(--orange); background: linear-gradient(0deg, rgba(232,145,60,.06), rgba(232,145,60,.06)), var(--panel); }
.card.good { border-color: var(--teal); }
.card.warn { border-color: var(--red); }
.muted { color: var(--dim); }
.small { font-size: 15px; }
.big-number { font-size: 34px; font-weight: 800; color: var(--orange); line-height: 1.1; }

.points { width: 100%; border-collapse: collapse; }
.points td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.points tr:last-child td { border-bottom: 0; }
.points td:last-child { text-align: right; font-weight: 800; font-size: 20px; white-space: nowrap; }
.plus { color: var(--green); }
.minus { color: var(--red); }

.formula {
  font-size: 19px; font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--panel-2);
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.formula .term { padding: 2px 8px; border-radius: 7px; background: var(--bg); }
.formula .t-new { color: var(--orange); }
.formula .t-now { color: var(--red); }
.formula .t-next { color: var(--teal-bright); }

.moveline { display: grid; grid-template-columns: 150px 1fr; gap: 3px 10px; font-size: 16px; }
.moveline dt { color: var(--faint); }
.moveline dd { margin: 0; }
.calc { margin-top: 8px; font-size: 21px; font-weight: 800; }
.calc .eq { color: var(--orange); }

.compass { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 40px); gap: 4px; justify-content: start; }
.compass div { display: grid; place-items: center; border-radius: 8px; background: var(--panel-2); font-weight: 700; }
.compass .c { background: transparent; color: var(--faint); font-size: 14px; }
.compass .hl { outline: 2px solid var(--orange); }
.compass .blank { color: var(--faint); }

table.data { width: 100%; border-collapse: collapse; font-size: 15px; }
table.data th { text-align: left; color: var(--faint); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.data td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.new td { background: rgba(126,174,184,.12); }
table.q { font-size: 14px; }
table.q td, table.q th { padding: 2px 6px; }
table.q td { text-align: center; }
table.q td:first-child, table.q th:first-child { text-align: left; }
table.q th { text-align: center; }

.terms { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; margin: 0; font-size: 16px; }
.terms dt { font-weight: 800; color: var(--text); }
.terms dd { margin: 0; color: var(--dim); }

.checklist { margin: 0; padding-left: 20px; }
.checklist li { margin: 4px 0; }
.steps-list { margin: 0; padding-left: 22px; }
.steps-list li { margin: 5px 0; }

.log { display: grid; gap: 8px; }
.log .entry { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.log .entry.bad { border-color: var(--red); }
.log .entry.ok { border-color: var(--teal); }
.log .entry strong { display: block; }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: inherit; }

.stepnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.stepnav .count { color: var(--faint); }

/* Floor drawing */
.tile { fill: #1d2028; stroke: #2c303a; stroke-width: 2; }
.tile.clickable { cursor: pointer; }
.tile.clickable:hover { stroke: var(--teal); }
.shelf-body { fill: #2a3446; stroke: #3a4760; stroke-width: 2; }
.shelf-line { stroke: #43506a; stroke-width: 3; }
.shelf-box { fill: #6a5238; }
.station-body { fill: var(--orange-soft); stroke: var(--orange); stroke-width: 3; }
.station-label { fill: var(--orange); font-size: 15px; font-weight: 800; letter-spacing: 1px; }
.coord { fill: var(--faint); font-size: 18px; font-weight: 700; }
.start-label { fill: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.score-tint { fill: var(--teal); }
.score-num { fill: var(--text); font-size: 30px; font-weight: 800; }
.score-num.low { fill: var(--faint); font-size: 22px; font-weight: 700; }
.score-arrow { fill: var(--teal-bright); font-size: 24px; font-weight: 800; }
.score-arrow.low { fill: var(--faint); font-size: 18px; }
.slot { fill: var(--faint); font-size: 16px; font-weight: 800; }
.slot.filled { fill: var(--text); }
.slot-box { fill: none; stroke: #4d5362; stroke-width: 2; stroke-dasharray: 4 3; }
.slot-box.filled { fill: #2b3140; stroke: var(--teal); stroke-dasharray: none; }
.flash { fill: none; stroke: var(--orange); stroke-width: 5; }
.path-test { fill: none; stroke: var(--orange); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.path-map { fill: none; stroke: var(--text); stroke-width: 4; stroke-dasharray: 10 10; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.robot { transition-property: transform; transition-timing-function: ease-in-out; }
.robot-body { fill: var(--teal); stroke: #d9eef2; stroke-width: 2; }
.robot-face { fill: #173038; }
.robot-eye { fill: #e8fbff; }
.robot-load { fill: var(--orange); }
.robot.bumped .robot-body { fill: var(--red); }
.pallet-body { fill: #7a4e24; stroke: #c98a4b; stroke-width: 3; }
.pallet-strap { stroke: #c98a4b; stroke-width: 4; }
.pallet-label { fill: #fbe3c8; font-size: 14px; font-weight: 800; letter-spacing: .5px; }

/* Lab */
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.95fr); gap: 22px; align-items: start; }
.settings { display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px; align-items: center; }
.settings label { color: var(--dim); font-size: 15px; }
.settings > div { display: flex; align-items: center; gap: 10px; }
.settings input[type="range"] { flex: 1; min-width: 0; accent-color: var(--orange); }
.settings select, .settings input[type="number"] {
  min-height: 40px; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
}
.value-out { color: var(--text); font-weight: 700; min-width: 44px; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 24px; }
.stat span { color: var(--faint); font-size: 13px; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.toggle button { min-height: 40px; padding: 6px 14px; border: 0; background: var(--panel); color: var(--dim); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -3px 0 var(--orange); }

/* Live labs: header gear, settings pop-up, play button, live panel */
.lab-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.gear-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.gear-btn svg { width: 22px; height: 22px; color: var(--orange); }
.gear-btn:hover { border-color: var(--teal); }
.gear-btn:focus-visible, .pop-close:focus-visible, .toggle button:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
dialog.settings-pop { position: fixed; inset: 88px 24px auto auto; margin: 0; width: min(470px, calc(100vw - 32px)); max-height: calc(100vh - 112px);
  padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: auto; }
dialog.settings-pop::backdrop { background: rgba(8,9,12,.55); }
.pop-inner { padding: 16px 18px 18px; }
.pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.pop-head h3 { margin: 0; font-size: 19px; }
.pop-inner h4 { margin: 18px 0 6px; font-size: 15px; color: var(--dim); }
.pop-close { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; }
.pop-note { color: var(--faint); font-size: 13px; margin: 12px 0 0; }
.help-btn { flex: none; width: 34px; height: 34px; margin-left: auto; border: 1px solid var(--line); border-radius: 50%; background: var(--panel);
  color: var(--orange); font: inherit; font-size: 18px; font-weight: 800; line-height: 1; cursor: pointer; }
.help-btn:hover { border-color: var(--teal); }
.help-btn:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
.card h3.with-help { display: flex; align-items: center; gap: 8px; }
.card h3.with-help .help-btn { width: 28px; height: 28px; font-size: 15px; }
dialog.settings-pop.help-pop { inset: 0; margin: auto; height: fit-content; width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
.help-pop p { margin: 0 0 10px; }
.help-pop .formula { font-size: 16px; margin-bottom: 12px; }
.help-pop .terms { font-size: 15px; }
.help-pop .steps-list { font-size: 15px; }
.play-btn { min-width: 124px; }
.live-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.live-now { border-left: 3px solid var(--orange); padding-left: 10px; margin: 0 0 8px; color: var(--dim); font-size: 14px; }
.live-log { list-style: none; margin: 0; padding: 0; font-size: 14px; max-height: 150px; overflow: auto; }
.live-log li { padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--dim); }
.live-log li:first-child { color: var(--text); }

/* One-screen live lab: scene across the top, one control bar, then a row of panels. */
body.lab-mode .top .speed { display: none; }
body.lab-mode main { padding-bottom: 0; }
.live-lab { display: flex; flex-direction: column; gap: 10px; }
.live-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.live-head .step-kicker { margin: 0; }
.live-head h2 { margin: 2px 0 0; font-size: 24px; line-height: 1.2; }
.live-head .lead { margin: 3px 0 0; font-size: 15px; max-width: none; }
.live-stage { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; align-items: stretch;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.live-stage .legend { flex: 0 0 170px; flex-direction: column; align-self: flex-start; gap: 7px; margin: 4px 0 0; font-size: 13px; }
.live-stage .scene { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.live-stage .scene > svg { width: 100%; height: 100%; max-height: none; }
.live-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.live-bar .controls { margin: 0; }
.live-bar .status { flex: 1 1 320px; margin: 0; min-height: 0; font-size: 15px; }
.live-panels { flex: 0 0 clamp(210px, 29vh, 290px); display: flex; gap: 10px; min-height: 0; }
.live-panels > * { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; }
.live-panels > .wide { flex-grow: 1.35; }
.live-panels > .wider { flex-grow: 1.7; }
.live-panels > .widest { flex-grow: 2; }
.live-panels > .narrow { flex-grow: 0.8; }
.live-panels > .stack { display: flex; flex-direction: column; gap: 10px; }
.live-panels .card { height: 100%; overflow: auto; padding: 10px 12px; }
.live-panels > .stack > .card { height: auto; flex: 0 0 auto; }
.live-panels .card h3 { font-size: 12.5px; margin-bottom: 6px; }
.live-panels .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.live-panels .stat { padding: 5px 8px; }
.live-panels .stat b { font-size: 18px; }
.live-panels .stat span { font-size: 12px; }
.live-panels .moveline { grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 13.5px; }
.live-panels .calc { font-size: 15px; margin-top: 6px; }
.live-panels .live-log { max-height: none; font-size: 13px; }
.live-panels table.data { font-size: 13px; }
.live-panels .pgrids { gap: 8px; }
.live-panels .pgrid h4 { font-size: 12.5px; margin-bottom: 4px; }
.live-panels .pgrid table { font-size: 11.5px; border-spacing: 2px; }
.live-panels .pgrid td { padding: 3px 1px; }
.live-panels .axis-note { display: none; }
.live-panels table.qd td, .live-panels table.qd th { padding: 3px 4px; font-size: 12px; }
.live-panels .steps-list { margin: 0 0 8px; }
/* Side layout (square scenes such as the New York map): columns of panels left and right of a full-height scene. */
.live-main { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
.live-side { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.live-side.right { flex-grow: 1.2; }
.live-side .card { flex: 0 0 auto; padding: 10px 12px; }
.live-side .card h3 { font-size: 12.5px; margin-bottom: 6px; }
.live-side .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.live-side .stat { padding: 5px 8px; }
.live-side .stat b { font-size: 18px; }
.live-side .stat span { font-size: 12px; }
.live-side .moveline { grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 13.5px; }
.live-side .calc { font-size: 15px; margin-top: 6px; }
.live-side .live-log { max-height: 96px; font-size: 13px; }
.live-side table.data { font-size: 13px; }
.live-side table.qd td, .live-side table.qd th { padding: 3px 4px; font-size: 12px; }
.live-side .steps-list { margin: 0 0 8px; }
.live-main > .live-stage { flex: 0 0 auto; position: relative; padding: 6px; }
.live-main > .live-stage .legend { position: absolute; top: 12px; left: 12px; z-index: 1; margin: 0; padding: 8px 10px; border-radius: 10px;
  background: rgba(14, 24, 34, .86); flex-direction: column; gap: 5px; font-size: 12.5px; }
@media (max-width: 900px) {
  .live-main { flex: none; flex-direction: column; }
  .live-main > .live-stage .legend { position: static; flex-direction: row; background: none; padding: 0 0 6px; }
  .live-side { flex: none; overflow: visible; }
}
.rule-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; font-size: 13px; color: var(--dim); }
.rule-list strong { color: var(--text); }

/* Guided lesson on one screen: controls column + scene, then explanation cards in a row ('top')
   or a column beside a height-sized square scene ('side'). Narrow screens keep the stacked page. */
.fit-stage { display: contents; }
.explain > div:empty { display: none; }
@media (max-width: 900px) {
  .fit-stage > .floor-wrap { order: -1; }
}
@media (min-width: 901px) {
  #lesson .chapters { margin-bottom: 8px; }
  #lesson .chapters button { min-height: 34px; padding: 3px 10px 3px 4px; font-size: 14px; }
  #lesson .chapters .num { width: 24px; height: 24px; font-size: 13px; }
  #lesson .step-head h2 { font-size: 25px; margin: 2px 0 4px; }
  #lesson .lead { font-size: 16px; margin-bottom: 8px; max-width: none; }
  #lesson .stepnav { margin-top: 10px; padding-top: 10px; }
  .step-body.fit-top, .step-body.fit-side { display: flex; gap: 10px; min-height: 0; align-items: stretch; }
  .step-body.fit-top { flex-direction: column; }
  .fit-stage { display: flex; gap: 14px; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
  .fit-top .fit-stage { flex: 1 1 0; }
  .fit-side .fit-stage { flex: 0 0 auto; }
  .fit-stage > .stage-col { flex: 0 0 300px; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }

/* Storm Desk additions (loaded after the shared Studio lesson stylesheet). */
:root { --amber: #fbbf24; }
.top .speed { display: none; }
:lang(zh) { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", sans-serif; }
:lang(vi) { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial, sans-serif; }

.sample-banner { position: sticky; top: 0; z-index: 20; padding: 8px 16px; text-align: center; background: #5a1f1c; border-bottom: 2px solid var(--red);
  color: var(--text); font-size: 15px; letter-spacing: .02em; }
.sample-banner strong { color: #ffd2cf; letter-spacing: .08em; }

/* Desk layout: facts on the left, drafts on the right; the page scrolls normally. */
.step-body.desk { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 18px; align-items: start; height: auto !important; }
.desk-side, .desk-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; align-content: start; }
.desk-main > .controls { margin-top: 0; }
.desk-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.lang-tabs { flex-wrap: wrap; }
.lang-hint { margin: -4px 2px 0; }
.facts { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15.5px; }
.facts .num-hl { color: var(--teal-bright); }
.question { font-size: 19px; font-weight: 600; }
blockquote.prompt { margin: 0 0 8px; padding: 8px 12px; border-left: 3px solid var(--teal); background: var(--panel-2); border-radius: 0 8px 8px 0; color: var(--dim); font-size: 15px; }
.score-strip { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 10px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--orange); font-size: 15px; }
.score-head { color: var(--teal); font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.score-line { font-size: 16px; }
.flag-word { color: var(--red); }
.ok-word { color: var(--green); }

/* Draft cards */
.drafts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; align-items: start; }
.draft { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.draft.decided.approve { border-left-color: var(--green); }
.draft.decided.edit { border-left-color: var(--amber); }
.draft.decided.reject { border-left-color: var(--red); }
.draft-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.draft-id { font-weight: 700; }
.draft-time { color: var(--faint); font-size: 13px; }
.draft-tag { margin-left: auto; padding: 2px 8px; border: 1px solid var(--orange); border-radius: 6px; color: var(--orange); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
.msg { display: grid; gap: 4px; }
.msg-label { display: flex; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.msg-text { margin: 0; padding: 9px 11px; border-radius: 10px; background: var(--panel-2); font-size: 16.5px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.alert .msg-text { border: 1px solid #3a3f4c; }
.msg-text.missing { color: var(--faint); font-style: italic; }
.count { color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
.count.over { color: var(--red); }
.draft-actions { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.draft-actions .btn { min-height: 40px; padding: 6px 14px; font-size: 15px; }
.verdicts button { min-width: 78px; font-weight: 600; }
.verdicts button:disabled { cursor: default; opacity: .55; }
.verdicts button.v-approve[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--green); color: var(--text); }
.verdicts button.v-edit[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--amber); color: var(--text); }
.verdicts button.v-reject[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--red); color: var(--text); }
.verdicts button:disabled[aria-pressed="true"] { opacity: 1; }
.edit-box { width: 100%; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--teal); background: var(--bg); color: var(--text); font: inherit; font-size: 16px; line-height: 1.45; resize: vertical; }
.edit-box:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 1px; }
.editor { display: grid; gap: 8px; }

/* Reveal */
.reveal { display: grid; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.reveal h5, .review-note h5, .back h5 { margin: 0 0 4px; color: var(--teal); font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; }
.compare { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; color: var(--dim); }
.compare strong { color: var(--text); }
.compare strong.flag-word { color: var(--red); }
.compare strong.ok-word { color: var(--green); }
.warn-line { margin: 0; color: #ffd2cf; }
.chips { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.chip { padding: 4px 8px; border-radius: 8px; background: var(--panel-2); border-left: 4px solid var(--faint); font-size: 14px; overflow-wrap: anywhere; }
.chip b { display: inline-block; min-width: 42px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.chip.ok { border-left-color: var(--green); }
.chip.ok b { color: var(--green); }
.chip.bad { border-left-color: var(--red); }
.chip.bad b { color: var(--red); }
.chip.warn { border-left-color: var(--amber); }
.chip.warn b { color: var(--amber); }
.chip .basis { color: var(--faint); font-size: 12.5px; }
.small-chips .chip { font-size: 13px; padding: 3px 7px; }
.back p, .review-note p { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
.back { padding: 8px 10px; border-radius: 10px; background: rgba(126,174,184,.08); }
.review-note { padding: 8px 10px; border-radius: 10px; background: rgba(232,145,60,.07); border: 1px solid rgba(232,145,60,.35); }
.review-none { margin: 0; }
.verdict-tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 13px; font-weight: 700; background: var(--panel-2); }
.verdict-tag.approve { color: var(--green); }
.verdict-tag.edit { color: var(--amber); }
.verdict-tag.reject { color: var(--red); }
details.orig summary { cursor: pointer; color: var(--dim); font-size: 14px; }
details.orig p { margin: 6px 0 0; color: var(--dim); font-size: 14.5px; overflow-wrap: anywhere; }

.table-scroll { overflow-x: auto; max-width: 100%; }
.table-scroll table.data { min-width: 460px; }

/* What we found */
.found { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.found .live-head .lead { font-size: 16px; max-width: 1000px; }
.found-head { display: flex; flex-wrap: wrap; gap: 12px; }
.big-stat { flex: 1 1 280px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.big-stat b { font-size: 36px; font-weight: 800; color: var(--orange); line-height: 1; font-variant-numeric: tabular-nums; }
.big-stat span { color: var(--dim); font-size: 15px; }
.found-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 12px; align-items: start; }
.sbars { display: grid; gap: 7px; margin-bottom: 10px; }
.sbar { display: grid; grid-template-columns: minmax(90px, 1fr) minmax(60px, 1.4fr) 44px max-content; gap: 8px; align-items: center; font-size: 14px; }
.sbar-label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbar-track { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.sbar-fill { display: block; height: 100%; border-radius: 5px; background: var(--orange); }
.sbar-value { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.sbar-of { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }

@media (max-width: 900px) {
  .step-body.desk { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .sample-banner { position: static; font-size: 14px; }
  .draft-tag { margin-left: 0; }
  .sbar { grid-template-columns: minmax(70px, 1fr) minmax(40px, 1fr) 40px; }
  .sbar-of { grid-column: 1 / -1; margin-top: -4px; }
  table.data { font-size: 13px; }
  .big-stat b { font-size: 30px; }
}

const make = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child.nodeType ? child : String(child));

};

function gearIcon() {

// A pop-up panel on a native <dialog>: Esc closes it, focus is managed by the browser.
function popup(title, content, closeLabel) {
  const close = make('button', {type: 'button', class: 'pop-close', 'aria-label': closeLabel}, '\u00d7');
  const dialog = make('dialog', {class: 'settings-pop', 'aria-label': title},
    make('div', {class: 'pop-inner'}, make('div', {class: 'pop-head'}, make('h3', {}, title), close), ...content));
  close.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });

}

function settingsPopup(title, ...content) {

// Sizes a lab to exactly fill the window below its top edge, so scene, controls and panels fit on one screen.
// Narrow screens keep the normal stacked page.
let refit = null;
function fillWindow(el, {minHeight = 620, bottom = 28, narrow = 900} = {}) {
  const fit = () => {
    if (!el.isConnected) return;
    if (window.innerWidth <= narrow) { el.style.height = ''; return; }
    const top = el.getBoundingClientRect().top + window.scrollY;
    el.style.height = `${Math.max(minHeight, Math.floor(window.innerHeight - top - bottom))}px`;
  };
  if (refit) window.removeEventListener('resize', refit);
  refit = fit;
  window.addEventListener('resize', fit);
  fit();
  requestAnimationFrame(fit);
}

// Keeps a stage as wide as its scene needs at the row's full height, leaving at least `reserve` px for the side columns.
let stageObserver = null;
function sizeStage(stage, row, {ratio = 1, reserve = 560, inset = 0, narrow = 900} = {}) {
  const fit = () => {
    if (window.innerWidth <= narrow) { stage.style.width = ''; return; }
    stage.style.width = `${Math.floor(Math.max(300, Math.min((row.clientHeight - inset) * ratio, row.clientWidth - reserve)))}px`;
  };
  if (stageObserver) stageObserver.disconnect();
  stageObserver = new ResizeObserver(fit);
  stageObserver.observe(row);
  fit();
}

// Guided-lesson steps: fill the window above the Back/Next bar; square scenes (layout 'side') get a height-sized stage.
function fitLesson(body, floorWrap, {layout = 'top', ratio = 1} = {}) {
  const footer = document.querySelector('.stepnav');
  fillWindow(body, {minHeight: 380, bottom: (footer ? footer.offsetHeight : 50) + 40});
  if (layout === 'side') sizeStage(floorWrap, body, {ratio, reserve: 730, inset: 24});

// Runs `unit` again and again while playing. Each unit must await a frame or a timer so the page stays responsive,
// and should change the model before its last await, so a pause never leaves half a step behind.
function player({unit, alive, onChange = () => {}}) {
  let playing = false, token = 0;
  const button = make('button', {type: 'button', class: 'btn primary play-btn'});
  const draw = () => { button.textContent = playing ? '\u275a\u275a Pause' : '\u25b6 Play'; button.setAttribute('aria-pressed', String(playing)); };
  const loop = async mine => {
    while (playing && mine === token && alive()) await unit();
    if (playing && mine === token) { playing = false; draw(); onChange(false); }
  };
  const api = {
    button,
    get playing() { return playing; },
    play() { if (playing) return; playing = true; draw(); onChange(true); loop(++token); },
    stop() { if (!playing) return; playing = false; token += 1; draw(); onChange(false); },
  };
  button.addEventListener('click', () => (playing ? api.stop() : api.play()));
  draw();
  return api;
}

return {SPEEDS, REDUCED, frame, pause, settingsPopup, helpPopup, speedSwitch, fillWindow, sizeStage, fitLesson, player};

function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === false || value === null || value === undefined) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }

}

  const yMax = niceMax(max ?? Math.max(1, ...values, ref ?? 0));
  const chart = chartFrame(title, width, height);
  axes(chart, {left, top, plotW, plotH, yMax, yLabel, xLabel, width});
  const slot = plotW / Math.max(values.length, 1);
  values.forEach((v, index) => {
    const barH = Math.max(1.5, (Math.min(v, yMax) / yMax) * plotH);
    const fill = Array.isArray(color) ? color[index] : color;
    chart.append(s('rect', {x: left + index * slot + slot * 0.15, y: top + plotH - barH, width: slot * 0.7, height: barH, rx: 2, fill}));
    if (valueLabels) chart.append(s('text', {x: left + index * slot + slot / 2, y: top + plotH - barH - 6, 'text-anchor': 'middle', fill: '#f5f3f0', 'font-size': 13, 'font-weight': 700}, typeof valueLabels === 'function' ? valueLabels(v) : String(v)));
    const label = labels ? labels[index] : firstIndex + index;
    if (labels || values.length <= 20 || label === firstIndex || label % 10 === 0) {
      chart.append(s('text', {x: left + index * slot + slot / 2, y: top + plotH + 17, 'text-anchor': 'middle', fill: '#858a97', 'font-size': 12}, String(label)));
    }
  });
  if (ref !== null) {
    const y = top + plotH - (ref / yMax) * plotH;
    chart.append(s('line', {x1: left, y1: y, x2: left + plotW + 4, y2: y, stroke: '#e8913c', 'stroke-width': 2, 'stroke-dasharray': '7 6'}));
    chart.append(s('text', {x: left + plotW + 8, y: y + 5, fill: '#e8913c', 'font-size': 13, 'font-weight': 700}, refLabel));
  }
  return chart;
}

function lineChart({series, xMax, yMax, title, yLabel, xLabel, height = 240, refs = []}) {
  const width = 560;
  const left = 44, right = refs.length ? 110 : 18, top = 40, bottom = 38;
  const plotW = width - left - right, plotH = height - top - bottom;
  const chart = chartFrame(title, width, height);
  axes(chart, {left, top, plotW, plotH, yMax, yLabel, xLabel, width});
  for (const x of [0, xMax / 2, xMax]) {
    chart.append(s('text', {x: left + (x / xMax) * plotW, y: top + plotH + 17, 'text-anchor': 'middle', fill: '#858a97', 'font-size': 12}, String(x)));
  }
  for (const ref of refs) {
    const y = top + plotH - (Math.min(ref.value, yMax) / yMax) * plotH;
    chart.append(s('line', {x1: left, y1: y, x2: left + plotW + 4, y2: y, stroke: ref.color, 'stroke-width': 2, 'stroke-dasharray': '7 6'}));
    chart.append(s('text', {x: left + plotW + 8, y: y + 5, fill: ref.color, 'font-size': 12, 'font-weight': 700}, ref.label));
  }
  for (const line of series) {
    if (!line.points.length) continue;
    const pts = line.points.map(([x, y]) => `${left + (x / xMax) * plotW},${top + plotH - (Math.min(y, yMax) / yMax) * plotH}`);
    chart.append(s('polyline', {points: pts.join(' '), fill: 'none', stroke: line.color, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-dasharray': line.dash || ''}));
  }
  let lx = width - right;
  for (const line of [...series].reverse()) {
    lx -= 26 + line.name.length * 7.4;
    chart.append(s('rect', {x: lx, y: 9, width: 16, height: 5, fill: line.color}));
    chart.append(s('text', {x: lx + 21, y: 16, fill: '#b9bdc6', 'font-size': 13}, line.name));
  }
  return chart;
}

/* ── Lesson and lab navigation ─────────────────────────────────────── */

function renderChapters() {
  const list = document.getElementById('chapters');
  list.replaceChildren(...page.steps.map((step, index) => h('li', {},
    h('button', {type: 'button', 'aria-current': index === page.current ? 'step' : null, class: index < page.current ? 'done' : '',
      onclick: () => renderStep(index)}, h('span', {class: 'num'}, String(index + 1)), h('span', {class: 'label'}, step.label)))));
}

function renderStep(index) {
  page.generation += 1;
  page.keyHandler = null;
  page.current = Math.max(0, Math.min(page.steps.length - 1, index));
  const step = page.steps[page.current];
  const layout = step.layout || page.layout;
  const article = document.getElementById('step');
  const floorWrap = h('div', {class: 'floor-wrap'});
  const controls = h('div', {class: 'controls'});
  const status = h('p', {class: 'status', 'aria-live': 'polite'});
  const stageCol = h('div', {class: 'stage-col'}, controls, status);
  const explain = h('aside', {class: 'explain', 'aria-label': 'Explanation'});
  const body = h('div', {class: `step-body fit-${layout}`}, h('div', {class: 'fit-stage'}, stageCol, floorWrap), explain);
  article.replaceChildren(
    h('div', {class: 'step-head'}, h('p', {class: 'step-kicker'}, `Step ${page.current + 1} of ${page.steps.length} \u00b7 ${step.stage}`),
      h('h2', {}, step.title), h('p', {class: 'lead'}, step.lead)),
    body);
  step.mount({floorWrap, controls, status, explain, stageCol, g: page.generation});
  live.fitLesson(body, floorWrap, {layout, ratio: page.ratio});
  renderChapters();
  document.getElementById('count').textContent = `${page.current + 1} / ${page.steps.length}`;
  document.getElementById('back').disabled = page.current === 0;
  document.getElementById('next').disabled = page.current === page.steps.length - 1;
  if (location.hash !== `#${step.id}`) history.replaceState(null, '', `#${step.id}`);
}

function showMode(mode) {
  const lab = mode === 'lab';
  document.getElementById('lesson').hidden = lab;
  document.getElementById('lab').hidden = !lab;
  document.getElementById('mode-lesson').setAttribute('aria-selected', String(!lab));
  document.getElementById('mode-lab').setAttribute('aria-selected', String(lab));
  document.body.classList.toggle('lab-mode', lab);
  if (lab) {
    page.generation += 1;
    page.keyHandler = null;
    page.mountLab(document.getElementById('lab'));
    history.replaceState(null, '', '#lab');
  } else renderStep(page.current);
}

function routeFromHash() {
  const hash = location.hash.slice(1);
  if (hash === 'lab') { showMode('lab'); return; }
  const index = page.steps.findIndex(step => step.id === hash);
  page.current = index >= 0 ? index : 0;
  showMode('lesson');
}

function showError(message) {
  const banner = document.getElementById('error-banner');
  banner.textContent = `Something went wrong (${message}). Reload the page before continuing; do not trust the current result.`;
  banner.hidden = false;
}

function startPage(steps, mountLab, {layout = 'top', ratio = 1} = {}) {
  page.steps = steps;
  page.mountLab = mountLab;
  page.layout = layout;
  page.ratio = ratio;
  document.getElementById('mode-lesson').addEventListener('click', () => showMode('lesson'));
  document.getElementById('mode-lab').addEventListener('click', () => showMode('lab'));
  document.getElementById('back').addEventListener('click', () => { renderStep(page.current - 1); window.scrollTo({top: 0}); });
  document.getElementById('next').addEventListener('click', () => { renderStep(page.current + 1); window.scrollTo({top: 0}); });
  document.getElementById('speed').addEventListener('change', event => { page.speed = event.target.value; });
  window.addEventListener('keydown', event => {
    const tag = (event.target.tagName || '').toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag)) return;
    if (page.keyHandler) page.keyHandler(event);
  });
  window.addEventListener('hashchange', routeFromHash);
  window.addEventListener('error', event => showError(event.message));
  window.addEventListener('unhandledrejection', event => showError(String(event.reason)));
  routeFromHash();
}


/* global REPORT, FACTS, REVIEW, META */
const LANGS = REPORT.languages;
const LANG = Object.fromEntries(LANGS.map(l => [l.code, l]));
const MAX = REPORT.max_chars;
const MOMENTS = REPORT.moments;
const PARTS = ['alert', 'answer'];
const keyOf = d => `m${d.moment}-${d.model}-t${d.try}`;
const DRAFTS = REPORT.drafts.map(d => ({...d, key: keyOf(d)}));
const STORMS = {Harvey: 'Hurricane Harvey, 2017', Beryl: 'Hurricane Beryl, 2024'};
const CHECKS = {
  length: ['Length', `The alert fits one text message (${MAX} characters or fewer).`],
  disclosure: ['AI line', 'The alert says it is AI-assisted, in its own language (Texas TRAIGA asks agencies to disclose AI to the public).'],
  numbers: ['Numbers', 'Every number in the message is in the facts.'],
  watch: ['Watch words', `No risky words the facts never mention (${REPORT.watch_terms.slice(0, 6).join(', ')}, …). Searched in the message and its back-translation.`],
  reviewer: ['Second model', 'A second AI model read the message against the facts. Its reading is advice; a person decides.'],
  missing: ['Missing', 'The model returned no message.'],
};
const STATE_WORD = {ok: 'OK', bad: 'Flag', warn: 'Check'};
const VERDICTS = [['approve', 'Approve'], ['edit', 'Edit'], ['reject', 'Reject']];
const PAST = {approve: 'Approved', edit: 'Edited', reject: 'Rejected'};
const LABEL = 'TEACHING DRAFT · AI-assisted · not sent';

const isFlag = c => c.state === 'bad' || c.state === 'warn';
const checksOf = (d, code, part) => d.grades?.[code]?.[part] || [];
const flagsOf = (d, code) => PARTS.flatMap(p => checksOf(d, code, p).filter(isFlag));
const textOf = (d, part, code) => d.messages?.[part]?.[code] ?? null;
const chars = t => Array.from(t || '').length;
const pct = (n, of) => (of ? Math.round((100 * n) / of) : 0);
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
const momentTitle = m => `${m.group} · ${m.name}`;

/* ── State: decisions live in memory, and in localStorage when the browser allows it ── */
const STORE = `m11-storm-desk:${META.source}:${REPORT.made || ''}`;
const fresh = () => ({lang: 'en', all: {}, desk: {}});
const state = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && typeof saved.desk === 'object' && LANG[saved.lang]) return {...fresh(), ...saved};
  } catch { /* storage blocked or corrupt: start fresh */ }
  return fresh();
})();
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch { /* memory only */ } };
const entry = (d, code) => state.desk[d.key]?.[code] || null;
const setEntry = (d, code, value) => { (state.desk[d.key] ??= {})[code] = value; save(); refresh(); };
let refreshers = [];
const refresh = () => refreshers.forEach(f => f());

function tally(filter = () => true) {
  const t = {total: 0, decided: 0, approve: 0, edit: 0, reject: 0, revealed: 0, flagged: 0, approvedFlagged: 0, rejectedClean: 0};
  for (const d of DRAFTS.filter(filter)) {
    for (const {code} of LANGS) {
      t.total += 1;
      const e = entry(d, code);
      if (!e?.verdict) continue;
      t.decided += 1;
      t[e.verdict] += 1;
      if (!e.revealed) continue;
      t.revealed += 1;
      const flagged = flagsOf(d, code).length > 0;
      if (flagged) t.flagged += 1;
      if (flagged && e.verdict === 'approve') t.approvedFlagged += 1;
      if (!flagged && e.verdict === 'reject') t.rejectedClean += 1;
    }
  }
  return t;
}

/* ── Small pieces ─────────────────────────────────────────────────── */
// Facts lines with every number in bold, so students can check numbers quickly.
function factLine(line) {
  const parts = line.split(/(\d+(?:[.:]\d+)?)/);
  return h('li', {}, ...parts.map((p, i) => (i % 2 ? h('b', {class: 'num-hl'}, p) : p)));
}

function langTabs(onChange) {
  const group = h('div', {class: 'toggle lang-tabs', role: 'group', 'aria-label': 'Language'});
  const render = () => group.replaceChildren(...LANGS.map(l => h('button', {type: 'button', 'aria-pressed': String(l.code === state.lang),
    onclick: () => { state.lang = l.code; save(); render(); onChange(); }}, l.name.replace(/ \(.*\)$/, ''))));
  render();
  return group;
}

// The Studio's labels often start with the check's name ("Second model: ...", "Numbers not in ..."); add the name only when missing.
function checkText(c) {
  const name = CHECKS[c.key]?.[0] || c.key;
  return c.label.toLowerCase().startsWith(name.split(' ')[0].toLowerCase()) ? c.label : `${name}: ${c.label}`;
}

function chipList(title, checks) {
  if (!checks.length) return h('div', {class: 'chips-block'}, h('h5', {}, title), h('p', {class: 'small muted'}, 'No checks recorded.'));
  return h('div', {class: 'chips-block'}, h('h5', {}, title),
    h('ul', {class: 'chips'}, ...checks.map(c => h('li', {class: `chip ${c.state}`},
      h('b', {}, STATE_WORD[c.state] || c.state), h('span', {}, ` ${checkText(c)}`),
      c.basis ? h('span', {class: 'basis'}, ` (${c.basis})`) : null))));
}

function signoffText(s) {
  if (!s) return null;
  if (typeof s === 'string') return s;
  const v = s.verdict || s.decision || s.state;
  const note = s.note || s.text || s.reason;
  return [v ? (PAST[v] || v) : null, note].filter(Boolean).join(': ') || null;
}

function reviewBlock(d) {
  const r = REVIEW.drafts[d.key];
  const studio = signoffText(d.signoff);
  if (r) {
    return h('div', {class: 'review-note'}, h('h5', {}, 'Instructor’s hand review'),
      r.verdict ? h('p', {}, h('span', {class: `verdict-tag ${r.verdict}`}, PAST[r.verdict] || r.verdict)) : null,
      r.note ? h('p', {}, r.note) : null,
      studio ? h('p', {class: 'small muted'}, `Studio sign-off: ${studio}`) : null);
  }
  if (studio) return h('div', {class: 'review-note'}, h('h5', {}, 'Instructor’s sign-off in the Studio'), h('p', {}, studio));
  return h('p', {class: 'small muted review-none'}, META.reviewed
    ? 'The instructor did not write a note on this draft.'
    : 'The instructor’s hand review is not in this build yet.');
}

// The page's own quick check of a student's edit: length, AI line, numbers. (No watch words: those need the back-translation.)
function quickCheck(text, code, part, factsText) {
  const factNums = new Set((factsText.match(/\d+(?:\.\d+)?/g) || []).map(Number));
  const extra = [...new Set(text.match(/\d+(?:\.\d+)?/g) || [])].filter(n => !factNums.has(Number(n)));
  const out = [];
  if (part === 'alert') {
    const n = chars(text);
    out.push({state: n <= MAX ? 'ok' : 'bad', key: 'length', label: `${n} of ${MAX} characters`});
    const disc = LANG[code].disclosure;
    out.push({state: text.includes(disc) ? 'ok' : 'bad', key: 'disclosure', label: text.includes(disc) ? 'Discloses AI' : `No “${disc}” line`});
  }
  out.push({state: extra.length ? 'bad' : 'ok', key: 'numbers', label: extra.length ? `Numbers not in the facts: ${extra.join(', ')}` : 'Every number is in the facts'});
  return out;
}

/* ── One draft card (one model, one try, one language) ────────────── */
function draftCard(d, code) {
  const m = MOMENTS[d.moment];
  const el = h('article', {class: 'draft', 'aria-label': `${d.model}, try ${d.try}, ${LANG[code].name}`});
  let editing = false;

  function messageBlock(part, text, {edited = false} = {}) {
    const label = part === 'alert' ? 'Alert (text message)' : 'Answer to the resident';
    if (text === null) return h('div', {class: 'msg'}, h('div', {class: 'msg-label'}, label), h('p', {class: 'msg-text missing'}, 'The model returned no message.'));
    const n = chars(text);
    return h('div', {class: `msg ${part}`},
      h('div', {class: 'msg-label'}, edited ? `${label} · your edit` : label,
        part === 'alert' ? h('span', {class: `count${n > MAX ? ' over' : ''}`}, `${n} / ${MAX}`) : null),
      h('p', {class: 'msg-text', lang: code}, text));
  }

  function editor() {
    const e = entry(d, code);
    const boxes = PARTS.map(part => {
      const start = (e?.verdict === 'edit' && e[part] != null) ? e[part] : (textOf(d, part, code) || '');
      const area = h('textarea', {class: 'edit-box', lang: code, rows: part === 'alert' ? 3 : 4, 'aria-label': `Edit the ${part}`}, start);
      const check = h('ul', {class: 'chips small-chips'});
      const update = () => check.replaceChildren(...quickCheck(area.value, code, part, m.facts).map(c =>
        h('li', {class: `chip ${c.state}`}, h('b', {}, STATE_WORD[c.state]), ` ${c.label}`)));
      area.addEventListener('input', update);
      update();
      return {part, area, node: h('div', {class: 'msg'}, h('div', {class: 'msg-label'}, part === 'alert' ? 'Alert (text message)' : 'Answer to the resident'), area, check)};
    });
    return h('div', {class: 'editor'}, ...boxes.map(b => b.node),
      h('p', {class: 'small muted'}, 'Quick check of your edit: length, AI line and numbers only.'),
      h('div', {class: 'draft-actions'},
        button('Save edit', () => { editing = false; setEntry(d, code, {verdict: 'edit', alert: boxes[0].area.value, answer: boxes[1].area.value}); }, {primary: true}),
        button('Cancel', () => { editing = false; render(); })));
  }

  function reveal(e) {
    const flags = flagsOf(d, code).length;
    const back = d.back?.[code];
    const r = REVIEW.drafts[d.key];
    return h('div', {class: 'reveal'},
      h('p', {class: 'compare'}, h('span', {}, 'You: ', h('strong', {}, PAST[e.verdict])), h('span', {}, 'Checks: ',
        h('strong', {class: flags ? 'flag-word' : 'ok-word'}, flags ? plural(flags, 'flag') : 'no flags')),
        r?.verdict ? h('span', {}, 'Instructor: ', h('strong', {}, PAST[r.verdict] || r.verdict)) : null),
      e.verdict === 'approve' && flags ? h('p', {class: 'small warn-line'}, 'You approved a draft the checks flagged. Read the flags: would you still send it?') : null,
      chipList('Alert checks', checksOf(d, code, 'alert')),
      chipList('Answer checks', checksOf(d, code, 'answer')),
      code !== 'en' && back ? h('div', {class: 'back'}, h('h5', {}, `Back into English (by a second model)`),
        h('p', {lang: 'en'}, h('span', {class: 'muted'}, 'Alert: '), back.alert ?? '—'),
        h('p', {lang: 'en'}, h('span', {class: 'muted'}, 'Answer: '), back.answer ?? '—')) : null,
      e.verdict === 'edit' && e.alert != null ? h('details', {class: 'orig'}, h('summary', {}, 'The AI’s original draft'),
        PARTS.map(p => h('p', {lang: code}, textOf(d, p, code) ?? '—'))) : null,
      reviewBlock(d));
  }

  function render() {
    const e = entry(d, code);
    const locked = !!e?.revealed;
    const edited = e?.verdict === 'edit' && e.alert != null;
    const head = h('div', {class: 'draft-head'},
      h('span', {class: 'draft-id'}, `${d.model} · try ${d.try}`),
      d.seconds ? h('span', {class: 'draft-time'}, `drafted in ${d.seconds.toFixed(1)} s`) : null,
      h('span', {class: 'draft-tag'}, LABEL));
    const body = editing ? [editor()] : PARTS.map(p => messageBlock(p, edited ? e[p] : textOf(d, p, code), {edited}));
    const verdicts = h('div', {class: 'toggle verdicts', role: 'group', 'aria-label': 'Your decision'},
      ...VERDICTS.map(([v, label]) => h('button', {type: 'button', class: `v-${v}`, 'aria-pressed': String(e?.verdict === v), disabled: locked || editing,
        onclick: () => { if (v === 'edit') { editing = true; render(); } else setEntry(d, code, {verdict: v}); }}, label)));
    const actions = editing ? null : h('div', {class: 'draft-actions'}, verdicts,
      locked ? h('span', {class: 'small muted'}, 'Your call is locked.')
        : button('Reveal the checks', () => setEntry(d, code, {...e, revealed: true}), {primary: !!e?.verdict, title: e?.verdict ? null : 'Decide first'}));
    if (actions && !locked && !e?.verdict) actions.lastChild.disabled = true;
    el.className = `draft${e?.verdict ? ` decided ${e.verdict}` : ''}${locked ? ' revealed' : ''}`;
    el.replaceChildren(head, ...body, actions || '', locked ? reveal(e) : '');
  }
  render();
  const redraw = () => { if (!editing && el.isConnected) render(); };
  redraw.card = true;
  refreshers.push(redraw);
  return el;
}

/* ── Layout helpers ───────────────────────────────────────────────── */
// Desk steps use their own two-column layout instead of the kit's one-screen fit.
function desk(ctx) {
  const body = ctx.explain.parentElement;
  body.className = 'step-body desk';
  const side = h('div', {class: 'desk-side'}), main = h('div', {class: 'desk-main'});
  body.replaceChildren(side, main);
  return {side, main};
}

function scoreStrip() {
  const slot = h('div', {class: 'score-strip', 'aria-live': 'polite'});
  const draw = () => {
    const t = tally();
    slot.replaceChildren(
      h('span', {class: 'score-head'}, 'Your desk'),
      h('span', {}, h('strong', {}, `${t.decided}`), ` of ${t.total} decided · `, h('strong', {}, `${t.revealed}`), ' revealed'),
      h('span', {class: 'score-line'}, 'You approved ', h('strong', {class: t.approvedFlagged ? 'flag-word' : ''}, plural(t.approvedFlagged, 'draft')),

}

/* ── Step 1 · The job ─────────────────────────────────────────────── */

      h('p', {}, `${n} drafts in all. Same prompt, same facts, asked ${REPORT.tries} times: the answers still differ.`),
      h('p', {class: 'small muted'}, `Languages: ${LANGS.map(l => l.name).join(', ')}. A second model translated each message back into English so you can check it.`)),
    h('div', {class: 'controls'}, button('Start at the first storm moment →', () => { renderStep(1); window.scrollTo({top: 0}); }, {primary: true})));
}

/* ── Steps 2–6 · One storm moment ─────────────────────────────────── */
function mountMoment(index) {
  return ctx => {
    refreshers = [];
    const m = MOMENTS[index];
    const {side, main} = desk(ctx);
    const momentNote = REVIEW.moments?.[String(index)];
    const goodSlot = h('div');
    const showGood = open => goodSlot.replaceChildren(open
      ? h('div', {}, h('p', {}, m.note || 'No note for this moment.'), momentNote ? h('p', {class: 'small'}, h('strong', {}, 'Instructor: '), momentNote) : null)
      : button('Show what a good answer says', () => showGood(true)));
    showGood(false);
    side.append(
      card(`The facts · ${STORMS[m.group] || m.group}`, h('ul', {class: 'facts'}, ...m.facts.split('\n').filter(Boolean).map(factLine)),
        h('p', {class: 'small muted'}, 'This is all the AI was given.')),
      accent('A resident asks', h('p', {class: 'question'}, `“${m.question}”`), goodSlot));

    const list = h('div', {class: 'drafts'});
    const more = h('div');
    const hint = h('p', {class: 'small muted lang-hint'});
    const draw = () => {
      refreshers = refreshers.filter(f => !f.card);
      const all = !!state.all[index];
      const drafts = DRAFTS.filter(d => d.moment === index && (all || d.try === 1)).sort((a, b) => a.try - b.try || REPORT.models.indexOf(a.model) - REPORT.models.indexOf(b.model));
      list.replaceChildren(...drafts.map(d => draftCard(d, state.lang)));
      more.replaceChildren(button(all ? 'Show try 1 only' : `Show all ${REPORT.tries} tries (${DRAFTS.filter(d => d.moment === index).length} drafts)`, () => { state.all[index] = !all; save(); draw(); }));
      hint.textContent = state.lang === 'en' ? 'Each card is one model’s draft. Try 1 first; the other tries asked the same thing again.'
        : `Can’t read ${LANG[state.lang].name.replace(/ \(.*\)$/, '')}? Most city staff can’t either. Decide what you would do; the reveal shows the back-translation.`;
      progress();
    };
    const prog = h('span', {class: 'small muted'});
    const progress = () => {
      const t = tally(d => d.moment === index);
      prog.textContent = `This moment: ${t.decided} of ${t.total} decided`;
    };
    refreshers.push(progress);
    main.append(scoreStrip(), h('div', {class: 'desk-bar'}, langTabs(draw), prog), hint, list, more);
    draw();
  };
}

/* ── Step 7 · Your sign-off record ────────────────────────────────── */
function mountRecord(ctx) {
  refreshers = [];
  const {side, main} = desk(ctx);
  const t = tally();
  side.append(
    card('Your desk, all moments',
      h('div', {class: 'stats'},
        h('div', {class: 'stat'}, h('b', {}, `${t.decided} / ${t.total}`), h('span', {}, 'decided')),
        h('div', {class: 'stat'}, h('b', {}, String(t.revealed)), h('span', {}, 'revealed')),
        h('div', {class: 'stat'}, h('b', {}, String(t.approve)), h('span', {}, 'approved')),
        h('div', {class: 'stat'}, h('b', {}, String(t.edit)), h('span', {}, 'edited')),
        h('div', {class: 'stat'}, h('b', {}, String(t.reject)), h('span', {}, 'rejected')),
        h('div', {class: 'stat'}, h('b', {class: t.approvedFlagged ? 'flag-word' : ''}, String(t.approvedFlagged)), h('span', {}, 'approved but flagged'))),
      t.revealed ? h('p', {class: 'small muted'}, `Of the ${t.revealed} you revealed, the checks flagged ${t.flagged}. You rejected ${plural(t.rejectedClean, 'draft')} the checks found nothing wrong with.`)
        : h('p', {class: 'small muted'}, 'Reveal a few drafts to see how your calls compare with the checks.')),
    accent('Talk about it',
      h('ul', {class: 'checklist'},
        h('li', {}, 'Which flag would you never send past? Which flag would you overrule?'),
        h('li', {}, 'You could not read every language. Who should sign the Vietnamese and Chinese alerts?'),
        h('li', {}, 'The AI wrote in seconds. How long did your sign-off take?'))),
    resetButton());
  const rows = MOMENTS.map((m, i) => {
    const mt = tally(d => d.moment === i);
    const ids = DRAFTS.filter(d => d.moment === i).map(d => REVIEW.drafts[d.key]?.verdict).filter(Boolean);
    const inst = ids.length ? VERDICTS.map(([v]) => [v, ids.filter(x => x === v).length]).filter(([, c]) => c).map(([v, c]) => `${c} ${v}`).join(', ') : '—';
    return {cells: [momentTitle(m), `${mt.decided} / ${mt.total}`, String(mt.approve), String(mt.reject), String(mt.approvedFlagged), inst]};
  });
  main.append(
    card('Moment by moment',
      h('div', {class: 'table-scroll'}, dataTable(['Storm moment', 'Decided', 'Approved', 'Rejected', 'Approved, flagged', 'Instructor (per draft)'], rows, {numeric: [1, 2, 3, 4]})),
      h('p', {class: 'small muted'}, 'Your counts are per draft and language. The instructor reviewed each draft once, across languages.')),
    card('What the checks cannot see',
      h('p', {}, 'The checks look for length, the AI line, numbers and a list of risky words. They cannot tell if “still rising” is still true, if the tone will scare people, or if a translation reads naturally to a native speaker.'),
      h('p', {class: 'small muted'}, 'That is why a person signs every message (level L2 on our scale: draft and ask).')),
    h('div', {class: 'controls'}, button('See what the whole run found →', () => document.getElementById('mode-lab').click(), {primary: true})));
}

function resetButton() {
  let armed = false;
  const btn = button('Clear my desk', () => {
    if (!armed) { armed = true; btn.textContent = 'Click again to clear every decision'; return; }
    state.desk = {}; state.all = {}; save(); renderStep(page.current);
  });
  return h('div', {class: 'controls'}, btn);
}

/* ── What we found (second tab) ───────────────────────────────────── */
function bars(rows) {
  return h('div', {class: 'sbars'}, ...rows.map(r => h('div', {class: 'sbar'},
    h('span', {class: 'sbar-label'}, r.label),
    h('span', {class: 'sbar-track'}, h('span', {class: 'sbar-fill', style: `width:${Math.max(r.share > 0 ? 1.5 : 0, r.share * 100)}%`})),
    h('span', {class: 'sbar-value'}, `${Math.round(r.share * 100)}%`),
    h('span', {class: 'sbar-of'}, `${r.n} of ${r.of}`))));
}

function mountFound(root) {
  refreshers = [];
  const run = FACTS.run;
  const date = (FACTS.made || REPORT.made || '').slice(0, 10);
  const models = Object.entries(FACTS.byModel);
  const modelCard = card('Flagged messages, by model',
    bars(models.map(([name, r]) => ({label: name, share: r.messages ? r.flagged / r.messages : 0, n: r.flagged, of: r.messages}))),
    dataTable(['Model', 'Drafts with any flag', 'Median time'], models.map(([name, r]) => ({cells: [name, `${r.drafts_flagged} of ${r.drafts}`, r.median_seconds === null ? '—' : `${r.median_seconds} s`]})), {numeric: [1, 2]}));
  const langCard = card('Flagged messages, by language',
    bars(LANGS.map(l => { const r = FACTS.byLanguage[l.code] || {messages: 0, flagged: 0}; return {label: l.name.replace(/ \(.*\)$/, ''), share: r.messages ? r.flagged / r.messages : 0, n: r.flagged, of: r.messages}; })),
    h('p', {class: 'small muted'}, 'Same facts, same prompt; only the language changed.'));
  const checkKeys = Object.keys(META.checkTotals).sort((a, b) => Object.keys(CHECKS).indexOf(a) - Object.keys(CHECKS).indexOf(b));
  const checkCard = card('What the flags were, by check',
    bars(checkKeys.map(k => { const t = META.checkTotals[k]; return {label: CHECKS[k]?.[0] || k, share: t.total ? t.flagged / t.total : 0, n: t.flagged, of: t.total}; })),
    h('p', {class: 'small muted'}, 'Length and the AI line apply to alerts only; the others to alerts and answers. One message can fail more than one check.'));
  const momentCard = card('By storm moment',
    dataTable(['Storm moment', ...REPORT.models], FACTS.byMoment.map(m => ({cells: [`${m.group} · ${m.name}`,
      ...REPORT.models.map(name => { const r = m.models[name]; return r ? `${r.flagged} of ${r.messages}` : '—'; })]})), {numeric: REPORT.models.map((_, i) => i + 1)}),
    h('p', {class: 'small muted'}, 'Flagged messages out of all messages for that moment.'));
  const reviewed = Object.values(REVIEW.drafts);
  const signed = REPORT.signed && (REPORT.signed.approve || REPORT.signed.edit || REPORT.signed.reject) ? REPORT.signed : null;
  const reviewCard = card('The instructor’s hand review',
    reviewed.length
      ? h('div', {}, h('p', {}, `${plural(reviewed.length, 'draft')} reviewed by hand: `,
        VERDICTS.map(([v]) => `${reviewed.filter(r => r.verdict === v).length} ${PAST[v].toLowerCase()}`).join(', '), '.'),
      h('p', {class: 'small muted'}, 'Open a draft on the Sign-off desk and reveal it to read the note.'))
      : h('p', {class: 'muted'}, 'Not in this build yet. The checks are automatic; a person still has to read every draft.'),
    signed ? h('p', {class: 'small muted'}, `Signed in the Studio: ${signed.approve} approved, ${signed.edit} edited, ${signed.reject} rejected${signed.approved_flagged ? `; ${signed.approved_flagged} approved despite a flag` : ''}.`) : null);
  const t = tally();
  const youCard = card('You, on the Sign-off desk',
    t.revealed ? h('p', {}, `You revealed ${plural(t.revealed, 'draft')} and approved ${t.approvedFlagged} that the checks flagged.`)
      : h('p', {class: 'muted'}, 'You have not revealed any drafts yet.'));
  const limits = accent('What these numbers are, and are not',
    h('p', {}, h('strong', {}, 'Our prompt, our two models, these five moments, on this date.'), ' They are not a score for “how good generative AI is.” A new model or a new prompt could do better or worse.'),
    h('p', {class: 'small'}, 'The checks are simple rules plus one model’s reading. They miss some mistakes and flag some fine messages. Nobody who speaks Vietnamese or Chinese natively has scored these drafts unless the hand review says so.'));
  root.replaceChildren(h('div', {class: 'found'},
    h('div', {class: 'live-head'}, h('div', {},
      h('p', {class: 'step-kicker'}, `Storm Desk · the whole run${date ? ` · recorded ${date}` : ''}`),
      h('h2', {}, `What the checks found in ${run.messages} messages.`),
      h('p', {class: 'lead'}, `${run.drafts} drafts: ${run.moments.length} storm moments × ${run.models.length} models × ${run.tries} tries, each with an alert and an answer in ${run.languages.length} languages. Back-translation and second reading by ${run.judge || 'a second model'}.`))),
    h('div', {class: 'found-head'},
      h('div', {class: 'big-stat'}, h('b', {}, `${pct(META.unitsFlagged, META.units)}%`), h('span', {}, `of drafts had at least one flag in at least one message (${META.unitsFlagged} of ${META.units}, counting each language)`)),
      h('div', {class: 'big-stat'}, h('b', {}, `${pct(FACTS.flagged, run.messages)}%`), h('span', {}, `of messages flagged (${FACTS.flagged} of ${run.messages})`))),
    h('div', {class: 'found-grid'}, modelCard, langCard, checkCard, momentCard, reviewCard, youCard),
    limits));
}

/* ── Start ────────────────────────────────────────────────────────── */
if (META.sample) {
  document.body.prepend(h('div', {class: 'sample-banner', role: 'note'},
    h('strong', {}, 'SAMPLE DATA'), ' · placeholder text, not the recorded run. Rebuild with the real report before class.'));
}

const steps = [
  {id: 'job', label: 'The job', stage: 'The job', title: 'The AI drafts. You sign.',
    lead: 'Real flood readings from two Houston storms. AI drafted the public alerts and an answer to a resident, in four languages.', mount: ctx => { refreshers = []; mountJob(ctx); }},
  ...MOMENTS.map((m, i) => ({id: `moment-${i + 1}`, label: momentTitle(m), stage: `Moment ${i + 1} of ${MOMENTS.length}`,
    title: `${STORMS[m.group] || m.group} · ${m.name}`,
    lead: 'Read the facts, then decide on each draft: approve, edit or reject. Then reveal what the checks found.', mount: mountMoment(i)})),
  {id: 'record', label: 'Your record', stage: 'Your sign-off record', title: 'How did your desk do?',
    lead: 'Your calls next to the checks and the instructor’s review.', mount: mountRecord},
];

startPage(steps, mountFound);

</script>
</body>
</html>
