<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flood Watch: Brays Bayou</title>
<style>
:root {
  --bg: #111318;
  --panel: #181a20;
  --panel-2: #222530;
  --line: #2e323d;
  --text: #f5f3f0;
  --dim: #b9bdc6;
  --faint: #858a97;
  --orange: #e8913c;
  --orange-soft: #3a2a17;
  --teal: #7eaeb8;
  --teal-bright: #a8d4dd;
  --red: #e5675f;
  --green: #7cc59a;
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-size: 17px; line-height: 1.45; }
button, select, input { font: inherit; }
[hidden] { display: none !important; }

.top {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  max-width: 1440px; margin: 0 auto; padding: 18px 32px 14px;
  border-bottom: 1px solid var(--line);
}
.brand { flex: 1 1 380px; }
.kicker { margin: 0; color: var(--teal); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.brand h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.15; }
.modes { display: flex; gap: 6px; }
.modes button, .speed select {
  min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--dim); cursor: pointer;
}
.modes button[aria-selected="true"] { background: var(--panel-2); color: var(--text); border-color: var(--teal); }
.speed { color: var(--dim); font-size: 15px; }
.speed select { margin-left: 6px; min-height: 40px; padding: 6px 10px; }

main { max-width: 1440px; margin: 0 auto; padding: 14px 32px 28px; }

.chapters { display: flex; gap: 6px; list-style: none; margin: 0 0 14px; padding: 0; flex-wrap: wrap; }
.chapters button {
  display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px 6px 6px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; font-size: 15px;
}
.chapters .num {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--faint); font-size: 14px; font-weight: 700;
}
.chapters button[aria-current="step"] { color: var(--text); border-color: var(--orange); }
.chapters button[aria-current="step"] .num { background: var(--orange); border-color: var(--orange); color: #1b1206; }
.chapters button.done .num { border-color: var(--teal); color: var(--teal); }

.step-kicker { margin: 0; color: var(--orange); font-size: 14px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.step-head h2 { margin: 4px 0 6px; font-size: 32px; line-height: 1.15; }
.lead { margin: 0 0 14px; color: var(--dim); font-size: 19px; max-width: 1000px; }

.step-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.95fr); gap: 22px; align-items: start; }
.stage-col { min-width: 0; }
.floor-wrap {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
  display: grid; place-items: center;
}
.floor-wrap.pair { grid-template-columns: 1fr 1fr; gap: 10px; }
svg.floor { width: 100%; height: auto; max-height: 440px; display: block; user-select: none; }
svg.floor.big { max-height: 470px; }
.floor-caption { margin: 8px 4px 0; color: var(--faint); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 4px 0; color: var(--dim); font-size: 14px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--swatch); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
.btn {
  min-height: 46px; padding: 9px 18px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); cursor: pointer; font-weight: 600;
}
.btn:hover:not(:disabled) { border-color: var(--teal); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #1b1206; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn:focus-visible, .chapters button:focus-visible, .modes button:focus-visible, .pad button:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
.btn .n { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: rgba(0,0,0,.25); font-size: 13px; }

.pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 48px); gap: 6px; }
.pad button { border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; }
.pad button:disabled { opacity: .4; }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }

.status { min-height: 26px; margin: 10px 4px 0; color: var(--dim); font-size: 16px; }
.status strong { color: var(--text); }

.explain { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.card h3 { margin: 0 0 8px; font-size: 14px; color: var(--teal); letter-spacing: .07em; text-transform: uppercase; }
.card p { margin: 0 0 8px; }
.card p:last-child { margin-bottom: 0; }
.card.accent { border-color: var(--orange); background: linear-gradient(0deg, rgba(232,145,60,.06), rgba(232,145,60,.06)), var(--panel); }
.card.good { border-color: var(--teal); }
.card.warn { border-color: var(--red); }
.muted { color: var(--dim); }
.small { font-size: 15px; }
.big-number { font-size: 34px; font-weight: 800; color: var(--orange); line-height: 1.1; }

.points { width: 100%; border-collapse: collapse; }
.points td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.points tr:last-child td { border-bottom: 0; }
.points td:last-child { text-align: right; font-weight: 800; font-size: 20px; white-space: nowrap; }
.plus { color: var(--green); }
.minus { color: var(--red); }

.formula {
  font-size: 19px; font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--panel-2);
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.formula .term { padding: 2px 8px; border-radius: 7px; background: var(--bg); }
.formula .t-new { color: var(--orange); }
.formula .t-now { color: var(--red); }
.formula .t-next { color: var(--teal-bright); }

.moveline { display: grid; grid-template-columns: 150px 1fr; gap: 3px 10px; font-size: 16px; }
.moveline dt { color: var(--faint); }
.moveline dd { margin: 0; }
.calc { margin-top: 8px; font-size: 21px; font-weight: 800; }
.calc .eq { color: var(--orange); }

.compass { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 40px); gap: 4px; justify-content: start; }
.compass div { display: grid; place-items: center; border-radius: 8px; background: var(--panel-2); font-weight: 700; }
.compass .c { background: transparent; color: var(--faint); font-size: 14px; }
.compass .hl { outline: 2px solid var(--orange); }
.compass .blank { color: var(--faint); }

table.data { width: 100%; border-collapse: collapse; font-size: 15px; }
table.data th { text-align: left; color: var(--faint); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.data td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.new td { background: rgba(126,174,184,.12); }
table.q { font-size: 14px; }
table.q td, table.q th { padding: 2px 6px; }
table.q td { text-align: center; }
table.q td:first-child, table.q th:first-child { text-align: left; }
table.q th { text-align: center; }

.terms { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; margin: 0; font-size: 16px; }
.terms dt { font-weight: 800; color: var(--text); }
.terms dd { margin: 0; color: var(--dim); }

.checklist { margin: 0; padding-left: 20px; }
.checklist li { margin: 4px 0; }
.steps-list { margin: 0; padding-left: 22px; }
.steps-list li { margin: 5px 0; }

.log { display: grid; gap: 8px; }
.log .entry { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.log .entry.bad { border-color: var(--red); }
.log .entry.ok { border-color: var(--teal); }
.log .entry strong { display: block; }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: inherit; }

.stepnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.stepnav .count { color: var(--faint); }

/* Floor drawing */
.tile { fill: #1d2028; stroke: #2c303a; stroke-width: 2; }
.tile.clickable { cursor: pointer; }
.tile.clickable:hover { stroke: var(--teal); }
.shelf-body { fill: #2a3446; stroke: #3a4760; stroke-width: 2; }
.shelf-line { stroke: #43506a; stroke-width: 3; }
.shelf-box { fill: #6a5238; }
.station-body { fill: var(--orange-soft); stroke: var(--orange); stroke-width: 3; }
.station-label { fill: var(--orange); font-size: 15px; font-weight: 800; letter-spacing: 1px; }
.coord { fill: var(--faint); font-size: 18px; font-weight: 700; }
.start-label { fill: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.score-tint { fill: var(--teal); }
.score-num { fill: var(--text); font-size: 30px; font-weight: 800; }
.score-num.low { fill: var(--faint); font-size: 22px; font-weight: 700; }
.score-arrow { fill: var(--teal-bright); font-size: 24px; font-weight: 800; }
.score-arrow.low { fill: var(--faint); font-size: 18px; }
.slot { fill: var(--faint); font-size: 16px; font-weight: 800; }
.slot.filled { fill: var(--text); }
.slot-box { fill: none; stroke: #4d5362; stroke-width: 2; stroke-dasharray: 4 3; }
.slot-box.filled { fill: #2b3140; stroke: var(--teal); stroke-dasharray: none; }
.flash { fill: none; stroke: var(--orange); stroke-width: 5; }
.path-test { fill: none; stroke: var(--orange); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.path-map { fill: none; stroke: var(--text); stroke-width: 4; stroke-dasharray: 10 10; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.robot { transition-property: transform; transition-timing-function: ease-in-out; }
.robot-body { fill: var(--teal); stroke: #d9eef2; stroke-width: 2; }
.robot-face { fill: #173038; }
.robot-eye { fill: #e8fbff; }
.robot-load { fill: var(--orange); }
.robot.bumped .robot-body { fill: var(--red); }
.pallet-body { fill: #7a4e24; stroke: #c98a4b; stroke-width: 3; }
.pallet-strap { stroke: #c98a4b; stroke-width: 4; }
.pallet-label { fill: #fbe3c8; font-size: 14px; font-weight: 800; letter-spacing: .5px; }

/* Lab */
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.95fr); gap: 22px; align-items: start; }
.settings { display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px; align-items: center; }
.settings label { color: var(--dim); font-size: 15px; }
.settings > div { display: flex; align-items: center; gap: 10px; }
.settings input[type="range"] { flex: 1; min-width: 0; accent-color: var(--orange); }
.settings select, .settings input[type="number"] {
  min-height: 40px; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
}
.value-out { color: var(--text); font-weight: 700; min-width: 44px; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 24px; }
.stat span { color: var(--faint); font-size: 13px; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.toggle button { min-height: 40px; padding: 6px 14px; border: 0; background: var(--panel); color: var(--dim); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -3px 0 var(--orange); }

/* Live labs: header gear, settings pop-up, play button, live panel */
.lab-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.gear-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.gear-btn svg { width: 22px; height: 22px; color: var(--orange); }
.gear-btn:hover { border-color: var(--teal); }
.gear-btn:focus-visible, .pop-close:focus-visible, .toggle button:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
dialog.settings-pop { position: fixed; inset: 88px 24px auto auto; margin: 0; width: min(470px, calc(100vw - 32px)); max-height: calc(100vh - 112px);
  padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: auto; }
dialog.settings-pop::backdrop { background: rgba(8,9,12,.55); }
.pop-inner { padding: 16px 18px 18px; }
.pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.pop-head h3 { margin: 0; font-size: 19px; }
.pop-inner h4 { margin: 18px 0 6px; font-size: 15px; color: var(--dim); }
.pop-close { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; }
.pop-note { color: var(--faint); font-size: 13px; margin: 12px 0 0; }
.help-btn { flex: none; width: 34px; height: 34px; margin-left: auto; border: 1px solid var(--line); border-radius: 50%; background: var(--panel);
  color: var(--orange); font: inherit; font-size: 18px; font-weight: 800; line-height: 1; cursor: pointer; }
.help-btn:hover { border-color: var(--teal); }
.help-btn:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
.card h3.with-help { display: flex; align-items: center; gap: 8px; }
.card h3.with-help .help-btn { width: 28px; height: 28px; font-size: 15px; }
dialog.settings-pop.help-pop { inset: 0; margin: auto; height: fit-content; width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
.help-pop p { margin: 0 0 10px; }
.help-pop .formula { font-size: 16px; margin-bottom: 12px; }
.help-pop .terms { font-size: 15px; }
.help-pop .steps-list { font-size: 15px; }
.play-btn { min-width: 124px; }
.live-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.live-now { border-left: 3px solid var(--orange); padding-left: 10px; margin: 0 0 8px; color: var(--dim); font-size: 14px; }
.live-log { list-style: none; margin: 0; padding: 0; font-size: 14px; max-height: 150px; overflow: auto; }
.live-log li { padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--dim); }
.live-log li:first-child { color: var(--text); }

/* One-screen live lab: scene across the top, one control bar, then a row of panels. */
body.lab-mode .top .speed { display: none; }
body.lab-mode main { padding-bottom: 0; }
.live-lab { display: flex; flex-direction: column; gap: 10px; }
.live-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.live-head .step-kicker { margin: 0; }
.live-head h2 { margin: 2px 0 0; font-size: 24px; line-height: 1.2; }
.live-head .lead { margin: 3px 0 0; font-size: 15px; max-width: none; }
.live-stage { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; align-items: stretch;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.live-stage .legend { flex: 0 0 170px; flex-direction: column; align-self: flex-start; gap: 7px; margin: 4px 0 0; font-size: 13px; }
.live-stage .scene { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.live-stage .scene > svg { width: 100%; height: 100%; max-height: none; }
.live-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.live-bar .controls { margin: 0; }
.live-bar .status { flex: 1 1 320px; margin: 0; min-height: 0; font-size: 15px; }
.live-panels { flex: 0 0 clamp(210px, 29vh, 290px); display: flex; gap: 10px; min-height: 0; }
.live-panels > * { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; }
.live-panels > .wide { flex-grow: 1.35; }
.live-panels > .wider { flex-grow: 1.7; }
.live-panels > .widest { flex-grow: 2; }
.live-panels > .narrow { flex-grow: 0.8; }
.live-panels > .stack { display: flex; flex-direction: column; gap: 10px; }
.live-panels .card { height: 100%; overflow: auto; padding: 10px 12px; }
.live-panels > .stack > .card { height: auto; flex: 0 0 auto; }
.live-panels .card h3 { font-size: 12.5px; margin-bottom: 6px; }
.live-panels .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.live-panels .stat { padding: 5px 8px; }
.live-panels .stat b { font-size: 18px; }
.live-panels .stat span { font-size: 12px; }
.live-panels .moveline { grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 13.5px; }
.live-panels .calc { font-size: 15px; margin-top: 6px; }
.live-panels .live-log { max-height: none; font-size: 13px; }
.live-panels table.data { font-size: 13px; }
.live-panels .pgrids { gap: 8px; }
.live-panels .pgrid h4 { font-size: 12.5px; margin-bottom: 4px; }
.live-panels .pgrid table { font-size: 11.5px; border-spacing: 2px; }
.live-panels .pgrid td { padding: 3px 1px; }
.live-panels .axis-note { display: none; }
.live-panels table.qd td, .live-panels table.qd th { padding: 3px 4px; font-size: 12px; }
.live-panels .steps-list { margin: 0 0 8px; }
/* Side layout (square scenes such as the New York map): columns of panels left and right of a full-height scene. */
.live-main { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
.live-side { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.live-side.right { flex-grow: 1.2; }
.live-side .card { flex: 0 0 auto; padding: 10px 12px; }
.live-side .card h3 { font-size: 12.5px; margin-bottom: 6px; }
.live-side .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.live-side .stat { padding: 5px 8px; }
.live-side .stat b { font-size: 18px; }
.live-side .stat span { font-size: 12px; }
.live-side .moveline { grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 13.5px; }
.live-side .calc { font-size: 15px; margin-top: 6px; }
.live-side .live-log { max-height: 96px; font-size: 13px; }
.live-side table.data { font-size: 13px; }
.live-side table.qd td, .live-side table.qd th { padding: 3px 4px; font-size: 12px; }
.live-side .steps-list { margin: 0 0 8px; }
.live-main > .live-stage { flex: 0 0 auto; position: relative; padding: 6px; }
.live-main > .live-stage .legend { position: absolute; top: 12px; left: 12px; z-index: 1; margin: 0; padding: 8px 10px; border-radius: 10px;
  background: rgba(14, 24, 34, .86); flex-direction: column; gap: 5px; font-size: 12.5px; }
@media (max-width: 900px) {
  .live-main { flex: none; flex-direction: column; }
  .live-main > .live-stage .legend { position: static; flex-direction: row; background: none; padding: 0 0 6px; }
  .live-side { flex: none; overflow: visible; }
}
.rule-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; font-size: 13px; color: var(--dim); }
.rule-list strong { color: var(--text); }

/* Guided lesson on one screen: controls column + scene, then explanation cards in a row ('top')
   or a column beside a height-sized square scene ('side'). Narrow screens keep the stacked page. */
.fit-stage { display: contents; }
.explain > div:empty { display: none; }
@media (max-width: 900px) {
  .fit-stage > .floor-wrap { order: -1; }
}
@media (min-width: 901px) {
  #lesson .chapters { margin-bottom: 8px; }
  #lesson .chapters button { min-height: 34px; padding: 3px 10px 3px 4px; font-size: 14px; }
  #lesson .chapters .num { width: 24px; height: 24px; font-size: 13px; }
  #lesson .step-head h2 { font-size: 25px; margin: 2px 0 4px; }
  #lesson .lead { font-size: 16px; margin-bottom: 8px; max-width: none; }
  #lesson .stepnav { margin-top: 10px; padding-top: 10px; }
  .step-body.fit-top, .step-body.fit-side { display: flex; gap: 10px; min-height: 0; align-items: stretch; }
  .step-body.fit-top { flex-direction: column; }
  .fit-stage { display: flex; gap: 14px; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
  .fit-top .fit-stage { flex: 1 1 0; }
  .fit-side .fit-stage { flex: 0 0 auto; }
  .fit-stage > .stage-col { flex: 0 0 300px; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }

const live = (() => {
// Shared controls for the three "watch it learn" labs: play/pause loop, speed switch and a gear-button settings pop-up.
// Self-contained (no imports) so every lesson page can include it.

const make = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child.nodeType ? child : String(child));
  return node;
};

// A pop-up panel on a native <dialog>: Esc closes it, focus is managed by the browser.
function popup(title, content, closeLabel) {
  const close = make('button', {type: 'button', class: 'pop-close', 'aria-label': closeLabel}, '\u00d7');
  const dialog = make('dialog', {class: 'settings-pop', 'aria-label': title},

}

function settingsPopup(title, ...content) {

    if (start !== null && i - last <= RULES.merge) last = i;

  update({upTo, forecasts = [], line = null, score = null, showCrossing = true, note = null}) {
    const r = this.replay;
    if (!r) return;
    const last = Math.min(upTo, r.main.length - 1);
    const {alerts, lines, marks, cursor} = this.layers;
    alerts.replaceChildren(); lines.replaceChildren(); marks.replaceChildren(); cursor.replaceChildren();
    const base = this.top + this.plotH;
    if (score) {
      for (const ep of score.episodes) {
        if (ep.a > last) continue;
        const b = Math.min(ep.b, last);
        const w = Math.max(4, this.x(b + 1) - this.x(ep.a));
        alerts.append(s('rect', {x: this.x(ep.a), y: base - 16, width: w, height: 16, rx: 3,
          fill: COLORS.alert, opacity: ep.falseAlarm && ep.b + 12 <= last ? 0.45 : 0.9}));
        if (w > 74) alerts.append(s('text', {x: this.x(ep.a) + 6, y: base - 4, fill: '#1b1206', 'font-size': 12, 'font-weight': 800}, 'ALERT ON'));
      }
    }
    if (line !== null) {
      const y = this.y(line);
      lines.append(s('line', {x1: this.left, x2: this.left + this.plotW, y1: y, y2: y, stroke: COLORS.line, 'stroke-width': 2, 'stroke-dasharray': '9 6'}));
      lines.append(s('text', {x: this.left + 8, y: y - 7, fill: COLORS.line, 'font-size': 14, 'font-weight': 700}, `Alert line ${line.toFixed(1)} ft`));
    }
    for (const f of forecasts) {
      if (last < 0) break;
      lines.append(s('path', {d: this.path(f.values, {to: last, shift: 8}), fill: 'none', stroke: f.color, 'stroke-width': 3, 'stroke-dasharray': f.dash || '8 5', 'stroke-linejoin': 'round', opacity: 0.95}));
    }
    if (last >= 0) {
      lines.append(s('path', {d: this.path(r.main, {to: last}), fill: 'none', stroke: COLORS.actual, 'stroke-width': 4, 'stroke-linejoin': 'round'}));
    }
    if (score && showCrossing) {
      for (const c of score.crossings) {
        if (c.i > last) continue;
        const x = this.x(c.i);
        marks.append(s('line', {x1: x, x2: x, y1: this.top + 4, y2: base, stroke: '#fbbf24', 'stroke-width': 2, 'stroke-dasharray': '3 4'}));
        marks.append(s('circle', {cx: x, cy: this.y(r.main[c.i]), r: 6, fill: '#fbbf24'}));
        const right = x > this.left + this.plotW * 0.7;
        marks.append(s('text', {x: x + (right ? -8 : 8), y: this.top + 18, 'text-anchor': right ? 'end' : 'start', fill: '#fbbf24', 'font-size': 14, 'font-weight': 800}, `Reached 38 ft at ${local(r, c.i).time}`));
        const ep = score.episodes.find(e => e.b >= c.i - 12 && e.a <= c.i + 8);
        if (ep && ep.a <= last) {
          const x0 = this.x(Math.max(ep.a, c.i - 48)), yb = base - 30;
          const good = c.warning > 0;
          const col = good ? '#7cc59a' : '#e5675f';
          marks.append(s('line', {x1: Math.min(x0, x), x2: Math.max(x0, x), y1: yb, y2: yb, stroke: col, 'stroke-width': 3}));
          for (const xx of [x0, x]) marks.append(s('line', {x1: xx, x2: xx, y1: yb - 7, y2: yb + 7, stroke: col, 'stroke-width': 3}));
          const label = c.warning === 0 ? 'no warning' : good ? `${minutes(c.warning)} warning` : `${minutes(-c.warning)} late`;
          const mid = (x0 + x) / 2;
          marks.append(s('text', {x: Math.min(Math.max(mid, this.left + 70), this.left + this.plotW - 70), y: yb - 11, 'text-anchor': 'middle', fill: col, 'font-size': 15, 'font-weight': 800}, label));
        }
      }
    }
    if (last >= 0 && last < r.main.length - 1) {
      const x = this.x(last);
      cursor.append(s('line', {x1: x, x2: x, y1: this.top, y2: base, stroke: '#f5f3f0', 'stroke-width': 1.5, opacity: 0.6}));
      cursor.append(s('text', {x, y: this.top - 8, 'text-anchor': x > this.left + this.plotW - 60 ? 'end' : 'middle', fill: '#f5f3f0', 'font-size': 13, 'font-weight': 700}, `now: ${clock(r, last)}`));
    }
    if (note) cursor.append(s('text', {x: this.left + this.plotW, y: 18, 'text-anchor': 'end', fill: COLORS.faint, 'font-size': 13}, note));
  }
}

function minutes(steps) {
  const m = steps * 15;
  return m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}` : `${m} min`;
}

/* ── River map (real NHDPlus channel geometry from USGS NLDI) ─────── */
class RiverMap {
  constructor(channel, gauges, ranges, {width = 1000, height = 400} = {}) {
    Object.assign(this, {gauges, ranges, width, height});
    const all = [...channel.brays, ...channel.keegans, ...gauges.map(g => [g.lon, g.lat])];
    const k = Math.cos(29.69 * Math.PI / 180);
    const xs = all.map(p => p[0] * k), ys = all.map(p => p[1]);
    const pad = {l: 40, r: 40, t: 70, b: 70};
    const sx = (width - pad.l - pad.r) / (Math.max(...xs) - Math.min(...xs));
    const sy = (height - pad.t - pad.b) / (Math.max(...ys) - Math.min(...ys));
    const sc = Math.min(sx, sy);
    const x0 = Math.min(...xs), y1 = Math.max(...ys);
    const offX = (width - pad.l - pad.r - (Math.max(...xs) - x0) * sc) / 2 + pad.l;
    const offY = (height - pad.t - pad.b - (y1 - Math.min(...ys)) * sc) / 2 + pad.t;
    this.p = ([lon, lat]) => [offX + (lon * k - x0) * sc, offY + (y1 - lat) * sc];
    this.kmPx = sc / 111.32;  // pixels per km (1 degree latitude ~ 111.32 km)
    const line = pts => pts.map(q => this.p(q).map(v => v.toFixed(1)).join(',')).join(' ');
    this.el = s('svg', {viewBox: `0 0 ${width} ${height}`, class: 'rivermap', role: 'img', 'aria-label': 'Map of Brays Bayou with four USGS gauges'});
    this.el.append(s('rect', {x: 0, y: 0, width, height, rx: 14, fill: '#141821'}));
    this.brays = s('polyline', {points: line(channel.brays), fill: 'none', stroke: COLORS.calm, 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'});
    this.keegans = s('polyline', {points: line(channel.keegans), fill: 'none', stroke: COLORS.calm, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'});
    this.el.append(this.keegans, this.brays);
    this.el.append(s('text', {x: width - 18, y: height - 42, 'text-anchor': 'end', fill: COLORS.faint, 'font-size': 14}, 'Brays flows east to the Houston Ship Channel \u2192'));
    // scale bar: 5 km
    const bar = 5 * this.kmPx;
    this.el.append(s('line', {x1: 30, x2: 30 + bar, y1: height - 26, y2: height - 26, stroke: COLORS.dim, 'stroke-width': 3}));
    this.el.append(s('text', {x: 30 + bar / 2, y: height - 34, 'text-anchor': 'middle', fill: COLORS.dim, 'font-size': 13}, '5 km'));
    this.el.append(s('text', {x: width - 18, y: height - 20, 'text-anchor': 'end', fill: COLORS.faint, 'font-size': 12}, 'Channel: USGS NLDI / NHDPlus \u00b7 gauges: USGS'));
    this.dots = {};
    const place = {alief: [0, -1], keegans: [0, 1], gessner: [0, -1], main: [0, -1]};
    for (const g of gauges) {
      const [x, y] = this.p([g.lon, g.lat]);
      const grp = s('g', {class: 'gauge'});
      const ring = s('circle', {cx: x, cy: y, r: 22, fill: 'none', stroke: '#e8913c', 'stroke-width': 3, opacity: 0});
      const dot = s('circle', {cx: x, cy: y, r: 13, fill: COLORS.calm, stroke: '#f5f3f0', 'stroke-width': 3});
      const below = place[g.key][1] > 0;
      const ty = below ? y + 42 : y - 46;
      const name = s('text', {x, y: ty, 'text-anchor': 'middle', fill: '#f5f3f0', 'font-size': 17, 'font-weight': 800}, g.key === 'main' ? 'Main St \u00b7 forecast point' : g.short);
      const value = s('text', {x, y: ty + 21, 'text-anchor': 'middle', fill: COLORS.dim, 'font-size': 15}, '');
      grp.append(ring, dot, name, value);
      this.el.append(grp);
      this.dots[g.key] = {ring, dot, value, name, x, y};
    }
  }
  addDistance(fromKey, toKey, text, {dx = 0, dy = 26} = {}) {
    const a = this.dots[fromKey], b = this.dots[toKey];
    this.el.append(s('text', {x: (a.x + b.x) / 2 + dx, y: (a.y + b.y) / 2 + dy, 'text-anchor': 'middle', fill: COLORS.faint, 'font-size': 15, 'font-weight': 700}, text));
  }
  fullness(key, v) {
    const r = this.ranges[key];
    return Math.max(0, Math.min(1, (v - r.lo) / (r.hi - r.lo)));
  }
  static color(f) {
    const stops = [[0, [47, 111, 134]], [0.55, [126, 174, 184]], [0.8, [232, 145, 60]], [1, [229, 103, 95]]];
    let i = 1;
    while (i < stops.length - 1 && f > stops[i][0]) i += 1;
    const [a, ca] = stops[i - 1], [b, cb] = stops[i];
    const t = Math.max(0, Math.min(1, (f - a) / (b - a)));
    return `rgb(${ca.map((c, k) => Math.round(c + (cb[k] - c) * t)).join(',')})`;
  }
  // levels/rises: {key: ft}; dark: set of gauge keys with no data shown
  update(levels, rises = {}, dark = new Set()) {
    for (const g of this.gauges) {
      const d = this.dots[g.key];
      const v = levels[g.key];
      if (dark.has(g.key) || v === null || v === undefined) {
        d.dot.setAttribute('fill', '#2a2d35');
        d.dot.setAttribute('stroke', '#5b606c');
        d.dot.setAttribute('stroke-dasharray', '4 4');
        d.value.textContent = dark.has(g.key) ? 'switched off' : 'no reading';
        d.value.setAttribute('fill', '#e5675f');
        d.ring.setAttribute('opacity', 0);
        continue;
      }
      const f = this.fullness(g.key, v);
      d.dot.setAttribute('fill', RiverMap.color(f));
      d.dot.setAttribute('stroke', '#f5f3f0');
      d.dot.removeAttribute('stroke-dasharray');
      const rise = rises[g.key];
      const arrow = rise > 0.05 ? ` \u25b2${rise.toFixed(1)}` : rise < -0.05 ? ` \u25bc${Math.abs(rise).toFixed(1)}` : '';
      d.value.textContent = `${v.toFixed(1)} ft${arrow}`;
      d.value.setAttribute('fill', rise > 0.5 ? '#f0a35e' : COLORS.dim);
      d.ring.setAttribute('opacity', rise > 0.5 ? 0.9 : 0);
    }
    const m = levels.main;
    if (m !== null && m !== undefined) this.brays.setAttribute('stroke', RiverMap.color(this.fullness('main', m)));
    const kv = levels.keegans;
    this.keegans.setAttribute('stroke', dark.has('keegans') || kv === null || kv === undefined ? '#3a3f4b' : RiverMap.color(this.fullness('keegans', kv)));
  }
}

/* ── Trade-off chart: warning time vs false alarms, one dot per alert line ── */
function tradeoffChart({table, lines, line, methods, width = 640, height = 400}) {
  const left = 64, right = 24, top = 30, bottom = 56;
  const plotW = width - left - right, plotH = height - top - bottom;
  const xMax = 200, yMin = -30, yMax = 120;
  const sx = v => left + (Math.sqrt(Math.min(v, xMax)) / Math.sqrt(xMax)) * plotW;
  const sy = v => top + plotH - ((Math.max(yMin, Math.min(yMax, v)) - yMin) / (yMax - yMin)) * plotH;
  const svg = s('svg', {viewBox: `0 0 ${width} ${height}`, class: 'chart tradeoff', role: 'img', 'aria-label': 'Median warning time against false alarms for each alert line'});
  for (const v of [-30, 0, 30, 60, 90, 120]) {
    svg.append(s('line', {x1: left, x2: left + plotW, y1: sy(v), y2: sy(v), stroke: v === 0 ? '#4d5362' : COLORS.grid}));
    svg.append(s('text', {x: left - 8, y: sy(v) + 5, 'text-anchor': 'end', fill: COLORS.faint, 'font-size': 13}, v === 0 ? '0' : `${v}`));
  }
  for (const v of [0, 5, 25, 50, 100, 200]) {
    svg.append(s('line', {x1: sx(v), x2: sx(v), y1: top, y2: top + plotH, stroke: COLORS.grid, 'stroke-dasharray': '2 5'}));
    svg.append(s('text', {x: sx(v), y: top + plotH + 19, 'text-anchor': 'middle', fill: COLORS.faint, 'font-size': 13}, String(v)));
  }
  svg.append(s('text', {x: left, y: 18, fill: COLORS.dim, 'font-size': 14}, 'Median warning before 38 ft (minutes)'));
  svg.append(s('text', {x: left + plotW, y: height - 10, 'text-anchor': 'end', fill: COLORS.dim, 'font-size': 14}, 'False alarms in 19 years \u2192'));
  for (const key of methods) {
    const pts = lines.map(l => table[key][l.toFixed(1)]).map(r => [sx(r.falseAlarms), sy(r.medianWarning ?? yMin)]);
    svg.append(s('polyline', {points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: METHOD[key].color, 'stroke-width': 2.5, opacity: 0.8}));
    for (const p of pts) svg.append(s('circle', {cx: p[0], cy: p[1], r: 3.5, fill: METHOD[key].color}));
    const r = table[key][line.toFixed(1)];
    const [cx, cy] = [sx(r.falseAlarms), sy(r.medianWarning ?? yMin)];
    svg.append(s('circle', {cx, cy, r: 10, fill: METHOD[key].color, stroke: '#f5f3f0', 'stroke-width': 3}));
    const alignRight = cx > left + plotW * 0.72;
    svg.append(s('text', {x: cx + (alignRight ? -15 : 15), y: cy - 12, 'text-anchor': alignRight ? 'end' : 'start', fill: METHOD[key].color, 'font-size': 14, 'font-weight': 800},
      `${METHOD[key].short}: ${r.medianWarning ?? '\u2014'} min, ${r.falseAlarms} false`));
  }
  return svg;
}

/* ── Forecast bars for one moment ─────────────────────────────────── */
function forecastBars({now, forecasts, actual, width = 640, height = 380}) {
  const left = 56, right = 20, top = 34, bottom = 64;
  const plotW = width - left - right, plotH = height - top - bottom;
  const yMin = 26, yMax = 52;
  const y = v => top + plotH - ((Math.max(yMin, Math.min(yMax, v)) - yMin) / (yMax - yMin)) * plotH;
  const svg = s('svg', {viewBox: `0 0 ${width} ${height}`, class: 'chart', role: 'img', 'aria-label': 'Three forecasts for the level in two hours'});
  for (const b of BANDS) {
    if (b.from >= yMax) continue;
    svg.append(s('rect', {x: left, y: y(Math.min(b.to, yMax)), width: plotW, height: y(b.from) - y(Math.min(b.to, yMax)), fill: b.fill}));
  }
  for (let v = 26; v <= 52; v += 4) {
    svg.append(s('line', {x1: left, x2: left + plotW, y1: y(v), y2: y(v), stroke: COLORS.grid}));
    svg.append(s('text', {x: left - 8, y: y(v) + 5, 'text-anchor': 'end', fill: COLORS.faint, 'font-size': 13}, String(v)));
  }
  svg.append(s('text', {x: left, y: 18, fill: COLORS.dim, 'font-size': 14}, 'Feet at Main St'));
  svg.append(s('line', {x1: left, x2: left + plotW, y1: y(now), y2: y(now), stroke: COLORS.actual, 'stroke-width': 2, 'stroke-dasharray': '4 4'}));
  svg.append(s('text', {x: left + 6, y: y(now) + 18, fill: COLORS.actual, 'font-size': 13, 'font-weight': 700}, `now ${now.toFixed(1)} ft`));
  svg.append(s('line', {x1: left, x2: left + plotW, y1: y(actual), y2: y(actual), stroke: '#fbbf24', 'stroke-width': 2.5}));
  svg.append(s('text', {x: left + plotW - 6, y: y(actual) - 8, 'text-anchor': 'end', fill: '#fbbf24', 'font-size': 14, 'font-weight': 800}, `what really happened: ${actual.toFixed(1)} ft`));
  const slot = plotW / forecasts.length;
  forecasts.forEach((f, i) => {
    const cx = left + slot * i + slot / 2, w = Math.min(70, slot * 0.42);
    const y0 = y(now), y1 = y(f.value);
    svg.append(s('rect', {x: cx - w / 2, y: Math.min(y0, y1), width: w, height: Math.max(3, Math.abs(y1 - y0)), rx: 4, fill: f.color, opacity: 0.9}));
    svg.append(s('text', {x: cx, y: Math.min(y0, y1) - 8, 'text-anchor': 'middle', fill: '#f5f3f0', 'font-size': 16, 'font-weight': 800}, `${f.value.toFixed(1)} ft`));
    svg.append(s('text', {x: cx, y: top + plotH + 22, 'text-anchor': 'middle', fill: f.color, 'font-size': 14, 'font-weight': 800}, f.label));
    svg.append(s('text', {x: cx, y: top + plotH + 40, 'text-anchor': 'middle', fill: COLORS.faint, 'font-size': 13}, `off by ${Math.abs(f.value - actual).toFixed(1)} ft`));
  });
  return svg;
}

function hbars(items, {max, unit = '', color = COLORS.model}) {
  const top = max ?? Math.max(...items.map(i => i.value));
  return h('div', {class: 'hbars'}, ...items.map(i => h('div', {class: 'hbar'},
    h('span', {class: 'hbar-label'}, i.label),
    h('span', {class: 'hbar-track'}, h('span', {class: 'hbar-fill', style: `width:${(100 * i.value / top).toFixed(1)}%;background:${i.color || color}`})),
    h('span', {class: 'hbar-value'}, `${i.text ?? i.value}${unit}`))));
}


/* global FACTS, DATA, DERIVED */
const R = Object.fromEntries(DATA.replays.map(r => [r.id, r]));
const HARVEY = R['2017-08-26'], BERYL = R['2024-07-08'];
const STORMS = {harvey: HARVEY, beryl: BERYL};
const GAUGES = FACTS.gauges;
const fmtFt = v => (v === null || v === undefined ? '\u2014' : `${v.toFixed(1)} ft`);
const series = (replay, key) => (key === 'persistence' ? replay.main : replay[key]);
const stepDelay = () => ({slow: 150, normal: 65, fast: 18})[page.speed];

function gaugeLevels(replay, i) {
  const levels = {}, rises = {};
  for (const g of GAUGES) {
    const v = replay[g.key][i];
    levels[g.key] = v;
    const prev = replay[g.key][i - 1];
    rises[g.key] = v !== null && prev !== null && prev !== undefined ? v - prev : 0;
  }
  return {levels, rises};
}

function stormToggle(value, onChange) {
  const group = h('div', {class: 'toggle', role: 'group', 'aria-label': 'Storm'});
  const render = () => group.replaceChildren(...Object.entries({harvey: 'Harvey 2017', beryl: 'Beryl 2024'}).map(([key, label]) =>
    h('button', {type: 'button', 'aria-pressed': String(key === value), onclick: () => { value = key; render(); onChange(key); }}, label)));
  render();
  return group;
}

function lineSlider(value, onChange, label = 'Alert line') {
  const out = h('span', {class: 'value-out'}, `${value.toFixed(1)} ft`);
  const input = h('input', {type: 'range', min: 34, max: 40, step: 0.5, value, 'aria-label': `${label} in feet`,
    oninput: e => { out.textContent = `${Number(e.target.value).toFixed(1)} ft`; onChange(Number(e.target.value)); }});
  return h('div', {class: 'slider'}, h('label', {}, label), h('div', {class: 'slider-row'}, input, out));
}

// Plays one replay from step `from` to the end, calling draw(i) every 15-minute step.
async function play(ctx, replay, draw, from = 0) {
  const g = ctx.g;
  for (let i = from; i < replay.main.length; i += 1) {
    draw(i);
    await wait(stepDelay());
    if (g !== page.generation || ctx.stopped?.()) return false;
  }
  return true;
}

// A Play/Pause button. Pausing keeps the position; Play resumes, or starts over at the end.
function playControls(ctx, {label, run}) {
  let token = 0, running = false;
  const btn = button(label, async () => {
    if (running) { stop(); return; }
    running = true; btn.textContent = '\u275a\u275a Pause';
    const mine = ++token;
    ctx.stopped = () => mine !== token;
    await run();
    if (mine === token) { running = false; btn.textContent = label; }
  }, {primary: true});
  function stop() { token += 1; running = false; btn.textContent = label; }
  return {button: btn, stop};
}
const resume = (upTo, replay) => (upTo >= 0 && upTo < replay.main.length - 1 ? upTo + 1 : 0);

/* ── Step 1 · The job ─────────────────────────────────────────────── */
function mountJob(ctx) {
  let storm = 'harvey', upTo = -1;
  const chart = new Hydrograph({label: 'Water level at Main St during the storm'});
  ctx.floorWrap.append(chart.el);
  const crossingsOnly = r => ({episodes: [], crossings: alerts.crossings(r.main).map(i => ({i, warning: null}))});
  const draw = i => {
    upTo = i;
    const r = STORMS[storm];
    chart.update({upTo: i, score: crossingsOnly(r)});
    ctx.status.innerHTML = i < 0 ? 'Press <strong>Play the storm</strong> to watch the water rise, 15 minutes at a time.'
      : `<strong>${clock(r, i)}</strong> \u00b7 Main St ${fmtFt(r.main[i])}`;
  };
  const ctl = playControls(ctx, {label: '\u25b6 Play the storm', run: () => play(ctx, STORMS[storm], draw, resume(upTo, STORMS[storm]))});
  ctx.controls.append(
    stormToggle(storm, key => { ctl.stop(); storm = key; chart.setReplay(STORMS[storm]); draw(-1); }),
    ctl.button,
    button('Show the whole storm', () => { ctl.stop(); draw(STORMS[storm].main.length - 1); }));
  ctx.stageCol.insertBefore(legend([['Water level at Main St', COLORS.actual], ['Reached action stage (38 ft)', '#fbbf24']]), ctx.controls);
  chart.setReplay(STORMS[storm]);
  draw(-1);
  const ev = FACTS.events;
  ctx.explain.append(
    card('Houston water moves fast',
      h('p', {}, `In ${DERIVED.rise.within2h} of ${ev.length} floods since 2008, the bayou at Main St went from 30 ft to 38 ft in `,
        h('strong', {}, '2 hours or less'), ` (typical: ${DERIVED.rise.medianText}).`),
      h('p', {class: 'small muted'}, `Harvey reached 38 ft at 10:00 pm on Sat Aug 26, 2017 and peaked at ${FACTS.events.find(e => e.name === 'Hurricane Harvey').peakFt} ft the next day.`)),
    card('Flood stages at Main St (National Weather Service)',
      terms([['Action 38 ft', 'Partners get ready to act'], ['Minor 41 ft', 'Little damage; some public threat'],
        ['Moderate 42 ft', 'Some buildings and roads flooded'], ['Major 43 ft', 'Extensive flooding']])),
    accent('The question',
      h('p', {}, 'If the city wants people off flooded roads ', h('em', {}, 'before'), ' the water arrives, when should it warn? And who decides?'),
      h('p', {class: 'small muted'}, `In this lesson a "flood" means the bayou at Main St reaching 38 ft. That happened ${ev.length} times between Oct 2007 and Sep 2026.`)));
}

/* ── Step 2 · The sensors ─────────────────────────────────────────── */
function mountSensors(ctx) {
  let storm = 'beryl', upTo = -1;
  const map = new RiverMap(DATA.channel, GAUGES, DERIVED.ranges);
  map.addDistance('alief', 'gessner', `${FACTS.riverKm.aliefToGessnerKm} km`, {dx: 58, dy: -22});
  map.addDistance('gessner', 'main', `${FACTS.riverKm.gessnerToMainKm} km along the bayou`, {dy: 78});
  ctx.floorWrap.append(map.el);
  const draw = i => {
    upTo = i;
    const r = STORMS[storm];
    const {levels, rises} = gaugeLevels(r, Math.max(0, i));
    map.update(levels, rises);
    ctx.status.innerHTML = i < 0 ? 'Press <strong>Play the storm</strong>: each dot is a real gauge, and the numbers are its real readings.'
      : `<strong>${clock(r, i)}</strong> \u00b7 ${GAUGES.map(g => `${g.short} ${fmtFt(levels[g.key])}`).join(' \u00b7 ')}`;
  };
  const ctl = playControls(ctx, {label: '\u25b6 Play the storm', run: () => play(ctx, STORMS[storm], draw, resume(upTo, STORMS[storm]))});
  ctx.controls.append(
    stormToggle(storm, key => { ctl.stop(); storm = key; draw(-1); }),
    ctl.button);
  ctx.stageCol.insertBefore(legend([['Calm', '#2f6f86'], ['Rising', '#7eaeb8'], ['High', '#e8913c'], ['Highest seen', '#e5675f']]), ctx.controls);
  draw(-1);
  const rows = GAUGES.map(g => ({cells: [g.short, `${g.areaSqMi} sq mi`, g.key === 'main' ? 'forecast point' : g.key === 'alief' ? `${FACTS.riverKm.aliefToMainKm} km` : g.key === 'gessner' ? `${FACTS.riverKm.gessnerToMainKm} km` : `${FACTS.riverKm.keegansToMainKm} km`]}));
  ctx.explain.append(
    card('Four gauges, one reading every 15 minutes',
      dataTable(['Gauge', 'Land that drains to it', 'To Main St'], rows, {numeric: [1, 2]}),
      h('p', {class: 'small muted'}, 'Keegans Bayou is a tributary that joins Brays above Gessner.')),
    card('Public data',
      h('p', {}, `The U.S. Geological Survey publishes every reading. Main St alone has ${DERIVED.mainReadings} readings since Oct 2007.`),
      h('p', {class: 'small muted'}, 'Newest readings are provisional and can be revised.')),
    accent('What to notice',
      h('p', {}, 'The upstream gauges rise first, but only just. ', h('strong', {}, `In ${DERIVED.lag.withinHour} of ${DERIVED.lag.count} floods, Gessner peaked within an hour of Main St.`)),
      h('p', {class: 'small muted'}, 'Houston\u2019s bayous rise almost together, so every minute of warning counts.')));
}

/* ── Step 3 · The forecast ────────────────────────────────────────── */
function mountForecast(ctx) {
  const w = FACTS.worked;
  const at = w.at.replace('T', ' ');
  ctx.floorWrap.append(forecastBars({now: w.inputs.main, actual: w.actual2h, forecasts: [
    {label: METHOD.persistence.short, value: w.forecast.persistence, color: METHOD.persistence.color},
    {label: METHOD.riseRate.short, value: w.forecast.riseRate, color: METHOD.riseRate.color},
    {label: 'Model', value: w.forecast.model, color: METHOD.model.color}]}));
  ctx.status.innerHTML = `<strong>Beryl, Jul 8, 2024, 5:00 am.</strong> Each forecaster says where Main St will be at 7:00 am.`;
  ctx.controls.append(h('p', {class: 'small muted'}, `At ${at.slice(11)} the bayou was at ${w.inputs.main.toFixed(1)} ft and had risen ${w.inputs.main_1h.toFixed(1)} ft in the last hour.`));
  const g = w.inputs;
  ctx.explain.append(
    card('What the model reads (13 numbers)',
      dataTable(['Gauge', 'Level', 'Last 15 min', 'Last hour'], ['main', 'gessner', 'alief', 'keegans'].map(k => ({cells: [
        GAUGES.find(x => x.key === k).short, g[k].toFixed(1), `+${g[`${k}_15m`].toFixed(1)}`, `+${g[`${k}_1h`].toFixed(1)}`]})), {numeric: [1, 2, 3]}),
      h('p', {class: 'small muted'}, `Plus Main St\u2019s change over 2 hours (+${g.main_2h.toFixed(1)} ft). Feet, every 15 minutes.`)),
    card('The model',
      h('p', {}, 'Gradient boosting: hundreds of small decision trees, each fixing the last one\u2019s mistakes. The same family as the Module 6 demand forecast.'),
      h('p', {class: 'small muted'}, `It predicts the change over the next 2 hours. Every forecast here comes from a model trained on the other ${FACTS.period.years - 1} years, never the one it is tested on.`)),
    card('What it leans on most',
      hbars(FACTS.importance.slice(0, 5).map(i => ({label: i.label, value: i.ftMae, text: `+${i.ftMae.toFixed(2)}`})), {unit: ' ft'}),
      h('p', {class: 'small muted'}, 'Extra error at high water when that input is scrambled. Recent rises matter most, upstream too.')));
}

/* ── Step 4 · Replay a storm (Decide) ─────────────────────────────── */
function mountReplay(ctx) {
  let storm = 'harvey', line = 38, upTo = -1;
  const chart = new Hydrograph();
  ctx.floorWrap.append(chart.el);
  const table = h('div');
  const draw = i => {
    upTo = i;
    const r = STORMS[storm];
    const score = alerts.scoreWindow(r.model, r.main, line);
    chart.update({upTo: i, line, score, forecasts: [{values: r.model, color: COLORS.model}]});
    if (i < 0) ctx.status.innerHTML = 'Press <strong>Play</strong>. The dashed orange line is the model\u2019s forecast, drawn at the time it is about (2 hours ahead).';
    else {
      const f = r.model[i];
      const on = f !== null && f >= line;
      ctx.status.innerHTML = `<strong>${clock(r, i)}</strong> \u00b7 now ${fmtFt(r.main[i])} \u00b7 forecast for ${local(r, i + 8).time}: ${fmtFt(f)}${on ? ' \u00b7 <strong class="alert-word">ALERT ON</strong>' : ''}`;
    }
    drawTable();
  };
  const drawTable = () => {
    const r = STORMS[storm];
    const rows = ['persistence', 'riseRate', 'model'].map(key => {
      const sc = alerts.scoreWindow(series(r, key), r.main, line);
      const c = sc.crossings.find(x => x.i === r.crossingStep);
      const fa = sc.episodes.filter(e => e.falseAlarm).length;
      return {cells: [h('span', {style: `color:${METHOD[key].color};font-weight:700`}, METHOD[key].short), alerts.minutesText(c ? c.warning : null), String(fa)]};
    });
    table.replaceChildren(dataTable(['Forecaster', 'Warning', 'False alarms'], rows, {numeric: [1, 2]}),
      h('p', {class: 'small muted'}, `${r.name}, ${local(r, r.crossingStep).date}. Warning = time between the alert and the bayou reaching 38 ft.`));
  };
  const ctl = playControls(ctx, {label: '\u25b6 Play', run: () => play(ctx, STORMS[storm], draw, resume(upTo, STORMS[storm]))});
  ctx.controls.append(
    stormToggle(storm, key => { ctl.stop(); storm = key; chart.setReplay(STORMS[storm]); draw(-1); }),
    ctl.button,
    button('Show the whole storm', () => { ctl.stop(); draw(STORMS[storm].main.length - 1); }),
    lineSlider(line, v => { line = v; draw(upTo); }));
  ctx.stageCol.insertBefore(legend([['Water level', COLORS.actual], ['Model forecast (2 h ahead)', COLORS.model], ['Alert on', COLORS.alert]]), ctx.controls);
  chart.setReplay(STORMS[storm]);
  draw(-1);
  ctx.explain.append(
    card('The alert rule',
      h('p', {}, 'Alert when the forecast for 2 hours from now reaches the ', h('strong', {}, 'alert line'), '. The model makes the forecast; people choose the line.'),
      h('p', {class: 'small muted'}, 'An alert that pauses for less than 6 hours counts as the same alert.')),
    card('This storm, three forecasters', table),
    accent('Try it',
      h('p', {}, 'Move the alert line down to 36 ft, then up to 39 ft. What happens to the warning?'),
      h('p', {class: 'small muted'}, 'A lower line warns earlier, but it also fires for storms that never reach 38 ft. Next step counts those.')));
}

/* ── Step 5 · Every storm since 2008 (Does it work?) ──────────────── */
function mountResults(ctx) {
  let line = 38;
  const slot = h('div', {class: 'wide-chart'});
  ctx.floorWrap.append(slot);
  const table = h('div');
  const draw = () => {
    slot.replaceChildren(tradeoffChart({table: FACTS.alertTable, lines: FACTS.lines, line, methods: ['persistence', 'riseRate', 'model'], width: 980, height: 430}));
    const rows = ['persistence', 'riseRate', 'model'].map(key => {
      const r = FACTS.alertTable[key][line.toFixed(1)];
      return {cells: [h('span', {style: `color:${METHOD[key].color};font-weight:700`}, METHOD[key].short), r.medianWarning === null ? '\u2014' : `${r.medianWarning} min`, `${r.caught} of 11`, String(r.falseAlarms)]};
    });
    table.replaceChildren(dataTable(['Forecaster', 'Median warning', 'Warned early', 'False alarms'], rows, {numeric: [1, 2, 3]}));
    ctx.status.innerHTML = `Alert line <strong>${line.toFixed(1)} ft</strong>. Each dot is one alert line from 34 to 40 ft; the big dots are the line you chose.`;
  };
  ctx.controls.append(lineSlider(line, v => { line = v; draw(); }),
    h('p', {class: 'small muted'}, 'Up = more warning. Right = more false alarms. The best place is top-left.'));
  draw();
  const st = FACTS.strict.results;
  ctx.explain.append(
    card(`All 11 floods and 19 years of storms`, table,
      h('p', {class: 'small muted'}, 'False alarm = an alert, and the bayou never reached 38 ft.')),
    card('How we tested',
      h('p', {}, `Each year was forecast by a model trained on the other years. Stricter check: train on 2007\u20132019 only, test on 2020\u20132026.`),
      h('p', {class: 'small muted'}, `Strict check at 38 ft: Beryl ${alerts.minutesText(st.model.warnings[1] / 15)} warning, Beta ${alerts.minutesText(st.model.warnings[0] / 15)}, ${st.model.falseAlarms} false alarms. Only 2 floods: a small test.`)),
    accent('A threshold is a policy choice',
      h('p', {}, 'No line gives more warning ', h('em', {}, 'and'), ' fewer false alarms. The model moves the whole curve up and left; people still choose the point.')));
}

/* ── Step 6 · A gauge goes dark ───────────────────────────────────── */
function mountDark(ctx) {
  let storm = 'harvey', upstream = true, upTo = -1;
  const line = 38;
  const chart = new Hydrograph();
  ctx.floorWrap.append(chart.el);
  const draw = i => {
    upTo = i;
    const r = STORMS[storm];
    const key = upstream ? 'model' : 'noUpstream';
    const score = alerts.scoreWindow(r[key], r.main, line);
    chart.update({upTo: i, line, score, forecasts: [{values: r[key], color: METHOD[key].color}], note: upstream ? 'all four gauges' : 'upstream gauges switched off'});
    const c = score.crossings.find(x => x.i === r.crossingStep);
    ctx.status.innerHTML = i < 0 ? 'Switch the upstream gauges off, then play the storm again.'
      : `<strong>${clock(r, i)}</strong> \u00b7 ${upstream ? 'all four gauges' : '<strong class="alert-word">3 gauges dark</strong>: Main St only'}${c && c.i <= i ? ` \u00b7 warning: ${alerts.minutesText(c.warning)}` : ''}`;
  };
  const toggle = h('div', {class: 'toggle', role: 'group', 'aria-label': 'Upstream gauges'});
  const renderToggle = () => toggle.replaceChildren(...[[true, 'Upstream on'], [false, 'Upstream off']].map(([v, label]) =>
    h('button', {type: 'button', 'aria-pressed': String(v === upstream), onclick: () => { upstream = v; renderToggle(); draw(upTo < 0 ? STORMS[storm].main.length - 1 : upTo); }}, label)));
  renderToggle();
  const ctl = playControls(ctx, {label: '\u25b6 Play', run: () => play(ctx, STORMS[storm], draw, resume(upTo, STORMS[storm]))});
  ctx.controls.append(toggle,
    stormToggle(storm, key => { ctl.stop(); storm = key; chart.setReplay(STORMS[storm]); draw(-1); }),
    ctl.button,
    button('Show the whole storm', () => { ctl.stop(); draw(STORMS[storm].main.length - 1); }));
  ctx.stageCol.insertBefore(legend([['Model, all four gauges', METHOD.model.color], ['Model, Main St only', METHOD.noUpstream.color]]), ctx.controls);
  chart.setReplay(STORMS[storm]);
  draw(-1);
  const a = FACTS.alertTable.model['38.0'], b = FACTS.alertTable.noUpstream['38.0'];
  const wo = DERIVED.whiteOak;
  ctx.explain.append(
    card('What three dark gauges cost (all 19 years, 38 ft line)',
      dataTable(['', 'All four', 'Main St only'], [
        {cells: ['Median warning', `${a.medianWarning} min`, `${b.medianWarning} min`]},
        {cells: ['Typical miss at high water', `${FACTS.errors.model.risingHighWater.toFixed(2)} ft`, `${FACTS.errors.noUpstream.risingHighWater.toFixed(2)} ft`]},
        {cells: ['False alarms', String(a.falseAlarms), String(b.falseAlarms)]}], {numeric: [1, 2]}),
      h('p', {class: 'small muted'}, 'Not every storm gets worse: Beta (2020) was warned earlier without them. On average, they help.')),
    card('It really happens',
      h('p', {}, `During Harvey, the White Oak Bayou gauge (another Houston bayou) has ${wo.readings} of ${wo.expected} expected readings, and `, h('strong', {}, `no published reading for ${wo.longestHours} hours`), ` (${wo.from} to ${wo.to}).`),
      h('p', {class: 'small muted'}, 'That is a gap in the public record; we have not confirmed why.')),
    accent('What the system should do',
      h('ul', {class: 'checklist'}, h('li', {}, 'Say so on screen: \u201c3 of 4 gauges offline\u201d'), h('li', {}, 'Switch to a backup model trained in advance'),
        h('li', {}, 'Tell the people on duty; never fill the gap silently'))));
}

/* ── Step 7 · Who decides ─────────────────────────────────────────── */
function mountDecide(ctx) {
  const a = FACTS.alertTable.model['38.0'];
  const tests = [
    ['Does it work?', `Median ${a.medianWarning} min warning, ${a.falseAlarms} false alarms in 19 years at the 38 ft line. Waiting for the water gives 0 min. Tested on years it never saw.`, 'good'],
    ['Is it fair?', 'Gauges sit on big bayous. Street flooding in many neighborhoods is not measured at all, so those residents get no forecast.', 'warn'],
    ['Can the public see it?', 'Gauge readings are public (USGS). The model, the alert line and its track record should be published too.', 'mixed'],
    ['Can people challenge it?', 'Who set the line, and why? After every storm: review misses and false alarms in public, and adjust.', 'mixed'],
  ];
  ctx.floorWrap.append(h('div', {class: 'tests-grid'}, ...tests.map(([q, text, tone]) => h('section', {class: `test-card ${tone}`}, h('h3', {}, q), h('p', {}, text)))));
  ctx.controls.append(h('p', {class: 'small'}, 'The four tests we use for every public AI system in this module.'));
  ctx.status.textContent = '';
  ctx.explain.append(
    card('The model never closes a road',
      h('p', {}, 'Official flood warnings come from the National Weather Service. Road closures and evacuations are decided by city and county staff.'),
      h('p', {class: 'small muted'}, 'A forecast like ours could help them see sooner. It suggests; people decide (level L1 on our scale).')),
    card('A teaching model',
      h('p', {}, 'Built for this class from public USGS readings. It is not how the Harris County Flood Control District or the National Weather Service forecast.')),
    accent('Your call',
      h('p', {}, 'Where would you set the alert line for Main St, and who should sign off on it: an engineer, the mayor\u2019s office, or the public?')));
}

const steps = [
  {id: 'job', label: 'The job', stage: 'Stage 1 \u00b7 The job', title: 'Houston\u2019s bayous rise in an hour or two.',
    lead: 'Brays Bayou runs through southwest Houston. Watch Hurricane Harvey arrive at the Main St gauge, one real reading every 15 minutes.', mount: mountJob},
  {id: 'sensors', label: 'Sense', stage: 'Stage 2 \u00b7 Sense', title: 'Four gauges along one bayou.',
    lead: 'Real gauges, real readings, on the real channel. Water collects upstream and flows east past Main St.', mount: mountSensors},
  {id: 'forecast', label: 'Predict', stage: 'Stage 3 \u00b7 Predict', title: 'Where will the water be in 2 hours?',
    lead: 'Three forecasters, one moment from Hurricane Beryl. Two simple rules and one trained model.', mount: mountForecast},
  {id: 'replay', label: 'Decide', stage: 'Stage 4 \u00b7 Decide', title: 'When should the alert go out?',
    lead: 'Replay the storm with the model\u2019s forecast. You set the alert line; the page measures the warning you would have given.', mount: mountReplay},
  {id: 'results', label: 'Does it work?', stage: 'Stage 4 \u00b7 Does it work?', title: 'More warning means more false alarms.',
    lead: 'Every storm from October 2007 to September 2026, every alert line from 34 to 40 ft.', mount: mountResults},
  {id: 'dark', label: 'Sensors go dark', stage: 'Stage 5 \u00b7 When sensors fail', title: 'What if the upstream gauges go dark?',
    lead: 'Sensors fail in the storms that matter most. Switch three gauges off and replay.', mount: mountDark},
  {id: 'decide', label: 'Who decides', stage: 'Stage 5 \u00b7 Use and limits', title: 'The model forecasts. People decide.',
    lead: 'Four tests for any public AI, applied to Flood Watch.', mount: mountDecide},
];

/* ── Replay any storm (second tab) ────────────────────────────────── */
function mountLab(root) {
  const g = page.generation;
  const state = {id: '2017-08-26', step: 0, line: 38, method: 'model', speed: 'watch'};
  const map = new RiverMap(DATA.channel, GAUGES, DERIVED.ranges, {width: 760, height: 330});
  const chart = new Hydrograph({height: 400});
  const status = h('p', {class: 'status', 'aria-live': 'polite'});
  const nowSlot = h('div'), stormSlot = h('div'), yearsSlot = h('div'), log = h('ul', {class: 'live-log'});
  const replay = () => R[state.id];
  const dark = () => (state.method === 'noUpstream' ? new Set(['alief', 'keegans', 'gessner']) : new Set());
  const forecast = () => series(replay(), state.method);

  function draw() {
    const r = replay(), i = state.step;
    const score = alerts.scoreWindow(forecast(), r.main, state.line);
    const {levels, rises} = gaugeLevels(r, i);
    map.update(levels, rises, dark());
    chart.update({upTo: i, line: state.line, score, forecasts: state.method === 'persistence' ? [] : [{values: forecast(), color: METHOD[state.method].color}]});
    const f = forecast()[i];
    const on = f !== null && f >= state.line;
    nowSlot.replaceChildren(card(`Right now \u00b7 ${clock(r, i)}`,
      h('div', {class: 'stats'},
        h('div', {class: 'stat'}, h('b', {}, fmtFt(r.main[i])), h('span', {}, 'Main St now')),
        h('div', {class: 'stat'}, h('b', {}, fmtFt(f)), h('span', {}, `forecast for ${local(r, i + 8).time}`)),
        h('div', {class: 'stat'}, h('b', {class: on ? 'alert-word' : ''}, on ? 'ALERT' : 'quiet'), h('span', {}, `line ${state.line.toFixed(1)} ft`)),
        h('div', {class: 'stat'}, h('b', {}, `${dark().size ? 1 : 4} of 4`), h('span', {}, 'gauges in use')))));
    const shown = score.episodes.filter(e => e.a <= i);
    log.replaceChildren(...shown.slice().reverse().map(e => h('li', {}, `${clock(r, e.a)}: alert${e.b < i ? ` until ${local(r, e.b).time}` : ' on'}${e.falseAlarm && e.b + 12 <= i ? ' \u00b7 false alarm' : ''}`)));
    if (!shown.length) log.append(h('li', {}, 'No alert yet.'));
    const c = score.crossings.find(x => x.i <= i);
    stormSlot.replaceChildren(card(r.name,
      h('p', {class: 'small muted'}, `${local(r, 0).date} \u00b7 peak ${r.peakFt.toFixed(2)} ft`),
      r.kind === 'flood'
        ? h('p', {}, c ? h('span', {}, `Reached 38 ft at ${local(r, c.i).time}. Warning: `, h('strong', {}, alerts.minutesText(c.warning))) : 'Has not reached 38 ft yet.')
        : h('p', {}, 'This storm never reached 38 ft. Any alert here is a false alarm.'),
      h('h4', {}, 'Alert log'), log));
    const rows = ['persistence', 'riseRate', 'noUpstream', 'model'].map(key => {
      const t = FACTS.alertTable[key][state.line.toFixed(1)];
      return {className: key === state.method ? 'new' : '', cells: [METHOD[key].short, t.medianWarning === null ? '\u2014' : `${t.medianWarning} min`, String(t.falseAlarms)]};
    });
    yearsSlot.replaceChildren(card(`All 19 years at ${state.line.toFixed(1)} ft`, dataTable(['Forecaster', 'Median warning', 'False alarms'], rows, {numeric: [1, 2]})));
    status.innerHTML = `<strong>${clock(r, i)}</strong> \u00b7 step ${i + 1} of ${r.main.length}${i >= r.main.length - 1 ? ' \u00b7 end of replay' : ''}`;
  }

  function load(id) {
    state.id = id;
    state.step = 0;
    chart.setReplay(replay());
    draw();
  }

  async function unit() {
    const r = replay();
    if (state.step >= r.main.length - 1) { player.stop(); return; }
    state.step = Math.min(r.main.length - 1, state.step + (state.speed === 'fast' ? 4 : 1));
    draw();
    await live.pause(state.speed === 'fast' ? 60 : 110);
  }
  const player = live.player({unit, alive: () => g === page.generation});

  const picker = h('select', {'aria-label': 'Storm', class: 'storm-pick', onchange: e => { player.stop(); load(e.target.value); }},
    h('optgroup', {label: 'Floods (reached 38 ft)'}, ...DATA.replays.filter(r => r.kind === 'flood').map(r => h('option', {value: r.id, selected: r.id === state.id}, `${r.name} (${r.id.slice(0, 4)})`))),
    h('optgroup', {label: 'False alarms of the model at 38 ft'}, ...DATA.replays.filter(r => r.kind !== 'flood').map(r => h('option', {value: r.id}, r.name))));
  const methodPick = h('div', {class: 'toggle', role: 'group', 'aria-label': 'Forecaster'});
  const renderMethod = () => methodPick.replaceChildren(...['model', 'noUpstream', 'riseRate', 'persistence'].map(key =>
    h('button', {type: 'button', 'aria-pressed': String(key === state.method), onclick: () => { state.method = key; renderMethod(); draw(); }}, METHOD[key].short)));
  renderMethod();
  const popup = live.settingsPopup('Flood desk settings',
    h('div', {class: 'settings'},
      h('label', {}, 'Alert line'), lineSlider(state.line, v => { state.line = v; draw(); }, 'Alert line'),
      h('label', {}, 'Forecaster'), methodPick),
    h('p', {class: 'pop-note'}, '\u201cMain St only\u201d is the backup model for when the three upstream gauges are dark.'),
    h('h4', {}, 'Things to try'),
    h('ol', {class: 'steps-list small'},
      h('li', {}, 'Harvey at 38 ft, then at 36 ft. How much warning do you gain?'),
      h('li', {}, 'Pick a false alarm (bottom of the storm list). Would a person on duty have sent that alert?'),
      h('li', {}, 'Tropical Storm Beta (2020) with the model: why was it late? Try Main St only.'),
      h('li', {}, 'Keeps rising: count its alerts in the 19-year table. Would residents still listen?')));
  const layout = h('div', {class: 'live-lab'},
    h('div', {class: 'live-head'},
      h('div', {}, h('p', {class: 'step-kicker'}, 'Flood desk \u00b7 replay any storm'),
        h('h2', {}, 'Run the flood desk for any storm since 2008.'),
        h('p', {class: 'lead'}, 'Real readings, replayed 15 minutes at a time. The gear sets the alert line and the forecaster.')),
      popup.gear),
    popup.dialog,
    h('div', {class: 'live-stage duo'}, h('div', {class: 'scene map-scene'}, map.el), h('div', {class: 'scene'}, chart.el)),
    h('div', {class: 'live-bar'},
      h('div', {class: 'controls live-controls'}, picker, player.button,
        live.speedSwitch(state.speed, v => { state.speed = v; }),
        button('Restart', () => { player.stop(); load(state.id); }),
        button('Jump to end', () => { player.stop(); state.step = replay().main.length - 1; draw(); })),
      status),
    h('div', {class: 'live-panels'}, nowSlot, h('div', {class: 'wide'}, stormSlot), yearsSlot));
  root.replaceChildren(layout);
  live.fillWindow(layout, {minHeight: 760});
  load(state.id);
}

startPage(steps, mountLab);

</script>
