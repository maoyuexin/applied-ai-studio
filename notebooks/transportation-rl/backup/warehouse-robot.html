function stepShell(ctx, view, {caption} = {}) {
  ctx.floorWrap.append(view.el);
  if (caption) ctx.stageCol.insertBefore(h('p', {class: 'floor-caption'}, caption), ctx.controls);
}

function mountJob(ctx) {
  const floor = rl.parseFloor(MINI_FLOOR);
  const view = new FloorView(floor, {label: 'Small warehouse: robot at A3, packing station at E3, shelves on B2, C2 and D2'});
  stepShell(ctx, view);
  ctx.stageCol.insertBefore(floorLegend(), ctx.controls);
  let pos = floor.start, moves = 0, points = 0, busy = false, done = false;
  const trips = [];
  const readout = h('p', {class: 'big-number'}, '0 points');
  const detail = h('p', {class: 'muted'}, 'Moves this trip: 0');
  const tripList = h('div', {class: 'log'});

  const pad = h('div', {class: 'pad', role: 'group', 'aria-label': 'Drive the robot'},
    ...rl.ACTIONS.map((a, index) => h('button', {class: a.key, type: 'button', 'aria-label': `Move ${a.label}`, onclick: () => drive(index)}, a.arrow)));
  const again = button('Start a new trip', reset);
  ctx.controls.append(pad, again);

  function reset() {
    pos = floor.start; moves = 0; points = 0; done = false;
    view.placeRobot(pos, 0);
    readout.textContent = '0 points';
    detail.textContent = 'Moves this trip: 0';
    ctx.status.textContent = 'The robot is back at the start (A3).';
    pad.querySelectorAll('button').forEach(b => { b.disabled = false; });
  }

  async function drive(a) {
    if (busy || done) return;
    busy = true;
    const g = ctx.g;
    const {next, bumped} = rl.move(floor, pos, a);
    const p = rl.moveReward(floor, next, REWARDS);
    moves += 1; points += p;
    if (bumped) await view.bump(pos, a, timing().move); else await view.placeRobot(next, timing().move);
    if (g !== generation) return;
    pos = next;
    readout.textContent = `${minus(points)} points`;
    detail.textContent = `Moves this trip: ${moves}`;
    if (bumped) ctx.status.innerHTML = `<strong>Bump.</strong> Something is in the way. \u22121, and it is still on ${rl.cellName(floor, pos)}.`;
    else if (next === floor.station) {
      done = true;
      ctx.status.innerHTML = `<strong>Delivered in ${moves} moves.</strong> Trip points = ${REWARDS.delivery} \u2212 ${moves} = ${minus(points)}.`;
      trips.push({moves, points});
      tripList.replaceChildren(...trips.map((t, index) => h('div', {class: `entry ${t.moves === 4 ? 'ok' : ''}`},
        h('strong', {}, `Your trip ${index + 1}: ${t.moves} moves \u2192 ${minus(t.points)} points`),
        t.moves === 4 ? 'The shortest trip on this floor.' : t.moves === 8 ? 'The long way over the top.' : null)));
      pad.querySelectorAll('button').forEach(b => { b.disabled = true; });
    } else ctx.status.textContent = `Moved ${rl.ACTIONS[a].label.toLowerCase()} to ${rl.cellName(floor, pos)}: \u22121.`;
    busy = false;
  }

  keyHandler = event => {
    const map = {ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3};
    if (event.key in map) { event.preventDefault(); drive(map[event.key]); }
  };

  ctx.explain.append(
    card('The points', pointsTable(), h('p', {class: 'small muted', style: 'margin-top:8px'}, `So a whole trip earns ${REWARDS.delivery} minus the number of moves.`)),
    card('This trip', readout, detail),
    card('Try this', h('p', {}, 'Deliver along the bottom. Then press Start a new trip and go the long way over the top. Which trip earns more?'), tripList),
    card('Three words for what you just did',
      h('dl', {class: 'terms'},
        h('dt', {}, 'State'), h('dd', {}, 'Where the robot is: its square, such as A3.'),
        h('dt', {}, 'Action'), h('dd', {}, 'What it can do: up, right, down or left.'),
        h('dt', {}, 'Reward'), h('dd', {}, 'The points it receives after each move.')),
      h('p', {class: 'small muted', style: 'margin-top:8px'}, 'Earlier modules started by loading a dataset. Here there is no dataset: the robot makes its own data by trying moves.')));
  ctx.status.textContent = 'The robot is on A3. The packing station is E3.';
}

function mountTable(ctx) {
  const floor = rl.parseFloor(MINI_FLOOR);
  const table = rl.createTable(floor);
  const view = new FloorView(floor, {label: 'Each open square shows four blank scores, one per arrow'});
  view.showRobot(false);
  stepShell(ctx, view, {caption: 'Each small box is one score. Top box = up, right box = right, bottom box = down, left box = left.'});
  view.showScores(table, {mode: 'slots'});
  const example = rl.createTable(floor);
  const C3 = cellIndex(floor, 'C3');
  [[0, -1], [1, 18], [2, -1], [3, 16]].forEach(([a, v]) => { example[C3 * 4 + a] = v; });
  let showing = false;
  const toggle = button('Show an example square (C3)', () => {
    showing = !showing;
    view.showScores(showing ? example : table, {mode: 'slots'});
    toggle.textContent = showing ? 'Back to the blank table' : 'Show an example square (C3)';
    ctx.status.innerHTML = showing
      ? 'On C3: up \u22121, right 18, down \u22121, left 16. The highest is <strong>right (18)</strong>, so that is the move it picks \u2014 unless this is one of its random moves.'
      : 'All 44 scores are blank before training.';
    if (showing) view.flash(C3);
  });
  ctx.controls.append(toggle);
  ctx.status.textContent = 'All 44 scores are blank before training.';
  ctx.explain.append(
    card('What a score means',
      h('p', {}, 'The points the robot expects to collect from here to the end of the trip if it takes this arrow now.'),
      h('p', {class: 'muted small'}, `Example: if D3 \u2192 is 19, going right from D3 delivers: \u22121 for the move, +${REWARDS.delivery} for the delivery.`)),
    card('How it picks a move (its policy)',
      h('ol', {class: 'steps-list'},
        h('li', {}, 'Read the four scores for the square it is on.'),
        h('li', {}, 'Take the arrow with the highest score. A blank counts as 0. If two are tied, flip a coin.'),
        h('li', {}, 'But 1 move in 5 is a random arrow instead, so it keeps trying new things. This is called exploration.'))),
    card('Its name',
      h('p', {}, 'This is a Q-table (Q for quality: how good each move is). It is the whole model: 11 squares \u00d7 4 arrows = 44 numbers. Nothing else is stored.'),
      qTable(floor, table)));
}

function mountFirstTrip(ctx) {
  const session = miniSession();
  const floor = session.floor;
  const view = new FloorView(floor, {label: 'Small warehouse during the first practice trip'});
  stepShell(ctx, view);
  ctx.stageCol.insertBefore(scoreLegend(), ctx.controls);
  let pos = floor.start, index = 0, busy = false, done = false;
  const moveSlot = h('div');
  const cardSlot = h('div');
  const summarySlot = h('div');
  const one = button('One move', () => step(timing().move), {primary: true});
  const finish = button('Finish the trip', finishTrip);
  const restart = button('Start over', () => renderStep(2));
  ctx.controls.append(one, finish, restart);

  async function step(ms) {
    if (busy || done) return false;
    busy = true;
    const g = ctx.g;
    const m = rl.takeMove(session, pos);
    index += 1;
    await animateMove(view, m, ms);
    if (g !== generation) return false;
    pos = m.to;
    view.showScores(session.table);
    view.flash(m.from);
    moveSlot.replaceChildren(describeMove(floor, m, 1, index));
    cardSlot.replaceChildren(card(`Scores on ${rl.cellName(floor, m.from)} now`, compass(session.table, m.from, m.action)));
    ctx.status.innerHTML = `Move ${index}: ${rl.cellName(floor, m.from)} ${arrowOf(m.action)}${m.explored ? ' (random move)' : ''}. New score for that arrow: <strong>${minus(m.after)}</strong>.`;
    if (m.delivered) {
      done = true;
      const trip = {moves: index};
      const good = trail(floor, session.table);
      summarySlot.replaceChildren(h('section', {class: 'card accent'}, h('h3', {}, 'Trip 1 is over'),
        h('p', {}, `${trip.moves} moves. Points: ${REWARDS.delivery} \u2212 ${trip.moves} = ${minus(REWARDS.delivery - trip.moves)}.`),
        h('p', {}, `What did it learn? One good score: ${good.map(t => `${t.name} ${t.arrow} ${t.score}`).join(', ')}. Every other arrow it tried is \u22121: \u201cthat cost a point and led nowhere yet.\u201d`),
        h('p', {class: 'muted small'}, 'Next step: what happens on trip 2?')));
      one.disabled = true; finish.disabled = true;
    }
    busy = false;
    return !done;
  }

  async function finishTrip() {
    const g = ctx.g;
    finish.disabled = true;
    while (!done && g === generation) {
      const more = await step(Math.max(timing().trip * 2, 60));
      if (!more) break;
    }
  }

  ctx.explain.append(formulaCard(), moveSlot, cardSlot, summarySlot,
    card('Why does it keep trying new arrows?', h('p', {class: 'small'}, 'A blank counts as 0, and 0 is better than \u22121. So an arrow it has never tried looks better than one that only cost a point. Early on, that makes the robot curious for free.')));
  moveSlot.append(card('Before the first move', h('p', {}, 'The robot is on A3 and all 44 scores are blank. Press One move.')));
  ctx.status.textContent = 'Trip 1, move 0.';
}

function mountTrips(ctx) {
  const session = miniSession();
  const floor = session.floor;
  rl.trainTrip(session);
  const view = new FloorView(floor, {label: 'Small warehouse between practice trips'});
  stepShell(ctx, view);
  ctx.stageCol.insertBefore(scoreLegend(), ctx.controls);
  view.showScores(session.table);
  const lastTrip = 5;
  let tripNo = 1, busy = false;
  const rows = h('tbody');
  const addRow = (n, moves, points, fresh) => rows.append(h('tr', {class: fresh.length ? 'new' : ''},
    h('td', {}, String(n)), h('td', {class: 'num'}, String(moves)), h('td', {class: 'num'}, minus(points)),
    h('td', {}, fresh.length ? fresh.map(t => `${t.name} ${t.arrow} ${t.score}`).join(', ') : '\u2014')));
  addRow(1, session.trips[0].moves, session.trips[0].points, trail(floor, session.table));
  const callout = h('div');
  const run = button('Run trip 2', () => runTrip(), {primary: true});
  const runAll = button(`Run to trip ${lastTrip}`, async () => { while (tripNo < lastTrip && await runTrip()); });
  const restart = button('Start over', () => renderStep(3));
  ctx.controls.append(run, runAll, restart);

  async function runTrip() {
    if (busy || tripNo >= lastTrip) return false;
    busy = true; run.disabled = true; runAll.disabled = true;
    const g = ctx.g;
    const before = new Set(trail(floor, session.table).map(t => t.name));
    tripNo += 1;
    ctx.status.textContent = `Trip ${tripNo} is running\u2026`;
    await view.placeRobot(floor.start, 0);
    let pos = floor.start, moves = 0, points = 0;
    while (moves < session.maxMoves) {
      const m = rl.takeMove(session, pos);
      moves += 1; points += m.points;
      await animateMove(view, m, timing().trip);
      if (g !== generation) return false;
      view.showScores(session.table);
      pos = m.to;
      if (m.delivered) break;
    }
    session.trips.push({moves, points});
    const fresh = trail(floor, session.table).filter(t => !before.has(t.name));
    fresh.forEach(t => view.flash(t.cell));
    addRow(tripNo, moves, points, fresh);
    ctx.status.innerHTML = `Trip ${tripNo}: ${moves} moves, ${minus(points)} points. ${fresh.length ? `New good score: <strong>${fresh.map(t => `${t.name} ${t.arrow} ${t.score}`).join(', ')}</strong>.` : 'No new good scores.'}`;
    if (tripNo >= lastTrip) {
      run.textContent = `${lastTrip} trips done`;
      const start = rl.bestTried(session.table, floor.start);
      callout.replaceChildren(h('section', {class: 'card accent'}, h('h3', {}, 'The good news reached the start'),
        h('p', {}, `A3 now scores ${minus(start.score)}. That is ${REWARDS.delivery} \u2212 4: exactly the points of the shortest possible trip. Nobody told it the route; the scores add up to it.`)));
    } else { run.textContent = `Run trip ${tripNo + 1}`; run.disabled = false; runAll.disabled = false; }
    busy = false;
    return tripNo < lastTrip;
  }

  ctx.explain.append(
    card('Why the good news moves backward',
      h('p', {}, 'Suppose D3 \u2192 already scores 19. When the robot steps right from C3 onto D3:'),
      h('div', {class: 'formula'}, h('span', {class: 'term t-now'}, '\u22121'), '+', h('span', {class: 'term t-next'}, '19'), '=', h('span', {class: 'term t-new'}, '18')),
      h('p', {class: 'small muted', style: 'margin-top:8px'}, 'So C3 becomes good, one point less. Next time, the square before C3 learns 17, and so on.')),
    card('Practice trips',
      h('table', {class: 'data'}, h('thead', {}, h('tr', {}, h('th', {}, 'Trip'), h('th', {class: 'num'}, 'Moves'), h('th', {class: 'num'}, 'Points'), h('th', {}, 'New good score'))), rows),
      h('p', {class: 'small muted', style: 'margin-top:8px'}, 'One complete trip is called an episode. Training means running many episodes.')),
    callout);
  ctx.status.textContent = 'Trip 1 is done. Press Run trip 2.';
}

function mountTest(ctx) {
  const session = miniSession();
  const floor = session.floor;
  rl.train(session, LESSON.trainedTrips);
  const view = new FloorView(floor, {label: 'Small warehouse after 20 practice trips'});
  stepShell(ctx, view, {caption: 'Click any open square to test drive from there.'});
  view.showScores(session.table);
  const dist = rl.shortestMoves(floor);
  const result = h('div');
  let busy = false;
  async function drive(start) {
    if (busy) return;
    busy = true;
    const g = ctx.g;
    view.clearPaths();
    const d = rl.testDrive(floor, session.table, start, 40);
    view.drawPath(d.path);
    const rows = h('tbody');
    const note = h('p', {class: 'small muted', style: 'margin-top:8px'});
    result.replaceChildren(card(`Test drive from ${rl.cellName(floor, start)}, move by move`,
      h('table', {class: 'data q'}, h('thead', {}, h('tr', {}, h('th', {}, 'On'), ...rl.ACTIONS.map(a => h('th', {}, a.arrow)), h('th', {}, 'Takes'))), rows), note));
    const addRow = k => {
      const from = d.path[k - 1];
      const action = d.actions[k - 1];
      const scores = [0, 1, 2, 3].map(a => rl.scoreOf(session.table, from, a));
      const tie = scores.filter(v => v === scores[action]).length > 1;
      rows.append(h('tr', {},
        h('td', {}, rl.cellName(floor, from)),
        ...[0, 1, 2, 3].map(a => {
          const v = session.table[from * 4 + a];
          return h('td', {class: v === null ? 'muted' : null, style: a === action ? 'outline:2px solid #e8913c;font-weight:700;color:#f5f3f0' : null}, v === null ? 'blank' : minus(v));
        }),
        h('td', {}, `${arrowOf(action)} ${scores[action]}${tie ? ' (tie: coin flip)' : ''}`)));
    };
    await animateDrive(view, d, timing().move, g, addRow);
    if (g !== generation) return;
    const shortest = dist[start];
    const same = d.delivered && d.moves === shortest;
    const bumpWins = d.path.slice(0, -1).some((c, k) => [0, 1, 2, 3].some(a => a !== d.actions[k] && rl.move(floor, c, a).bumped && session.table[c * 4 + a] !== null && session.table[c * 4 + a] > 0));
    note.textContent = `${same ? '\u2713' : '\u2717'} ${d.moves} moves, ${minus(REWARDS.delivery - d.moves)} points. Shortest route on the map: ${shortest} moves.`
      + (bumpWins ? ' A bump arrow (into a shelf or wall) can score high, but always 1 less than the best arrow on the same square, so it never wins.' : '');
    ctx.status.innerHTML = `Test drive from ${rl.cellName(floor, start)}: <strong>${d.moves} moves</strong>. Shortest possible: ${shortest}.`;
    busy = false;
  }
  view.setClickable(cell => { if (cell !== floor.station && floor.open[cell]) drive(cell); });
  view.showScores(session.table);
  ctx.controls.append(
    button('Test drive from A3', () => drive(floor.start), {primary: true}),
    button('Show the shortest route on the map', () => {
      const path = [floor.start];
      let c = floor.start;
      while (c !== floor.station) {
        for (let a = 0; a < 4; a += 1) { const m = rl.move(floor, c, a); if (!m.bumped && dist[m.next] === dist[c] - 1) { c = m.next; break; } }
        path.push(c);
      }
      view.drawPath(path, 'map');
      ctx.status.innerHTML = `Dashed line: a shortest route found by <strong>searching the map</strong> (${dist[floor.start]} moves). No learning involved.`;
    }),
    button('Clear lines', () => { view.clearPaths(); ctx.status.textContent = ''; }));
  const moves = session.trips.map(t => t.moves);
  ctx.explain.append(
    card('The test-drive rule',
      h('ol', {class: 'steps-list'},
        h('li', {}, 'Read the four scores on the square the robot is on.'),
        h('li', {}, 'Take the arrow with the highest score. A blank counts as 0; a tie is a coin flip.'),
        h('li', {}, 'No random moves and no learning: the scores do not change during a test.')),
      h('p', {class: 'small', style: 'margin-top:8px'}, `Why this finds the shortest route: after practice, each score is ${REWARDS.delivery} minus the moves still needed. The highest score is the way with the fewest moves left.`),
      h('p', {class: 'small muted'}, 'The robot never looks at the next square. Each arrow\u2019s score already includes the best score of the square it leads to: that is what the update in Step 3 did.')),
    result,
    card('Moves per practice trip',
      barChart({values: moves, ref: dist[floor.start], refLabel: `shortest = ${dist[floor.start]}`, title: 'Moves in each of the 20 practice trips'}),
      h('p', {class: 'small'}, `Trips 1\u20133 wander (${moves.slice(0, 3).join(', ')} moves). From trip 4 on it takes ${Math.min(...moves.slice(3))}\u2013${Math.max(...moves.slice(3))} moves. Practice trips include random moves, so some are longer than the test.`)),
    card('Why we can grade it',
      h('p', {class: 'small'}, 'Because we know this map, a search program can compute the shortest route exactly, just like a GPS. That gives us an answer key to check the robot against. Reinforcement learning is meant for problems where nobody can write that answer down, such as how long a traffic light should stay green.')));
  result.append(card('Test drive', h('p', {}, 'Press Test drive from A3, or click any square on the floor.')));
  ctx.status.textContent = 'Practice is over: 20 trips.';
}

function mountBigger(ctx) {
  let session = bigSession();
  const floor = session.floor;
  const view = new FloorView(floor, {big: true, label: 'Large warehouse with 52 open squares'});
  stepShell(ctx, view, {caption: 'Click any square to test drive from there.'});
  const corner = cellIndex(floor, 'A1');
  view.placeRobot(corner, 0);
  const curve = [];
  let busy = false;
  const chartSlot = h('div');
  const stats = h('div', {class: 'stats'});
  const target = LESSON.bigTrips;
  const watch = button('Watch 1 practice trip', () => watchTrip(), {primary: true});
  const practice = button('Practice 50 trips', () => train(50));
  const restart = button('Start over', () => renderStep(5));
  ctx.controls.append(watch, practice, restart);

  function drawChart() {
    chartSlot.replaceChildren(lineChart({xMax: target, yMax: 52, title: 'Test drives from all 52 squares, after every 10 practice trips',
      yLabel: 'Squares (of 52)', xLabel: 'Practice trips',
      series: [
        {name: 'reaches the station', color: '#7eaeb8', points: curve.map(p => [p.trips, p.delivered])},
        {name: 'takes the shortest route', color: '#e8913c', points: curve.map(p => [p.trips, p.shortest])},
      ]}));
  }
  function drawStats() {
    const last = curve[curve.length - 1] || {delivered: 0, shortest: 0, squares: 52};
    const moves = session.trips.map(t => t.moves);
    const recent = moves.slice(-50);
    const mean = recent.length ? Math.round(10 * recent.reduce((a, b) => a + b, 0) / recent.length) / 10 : 0;
    stats.replaceChildren(
      h('div', {class: 'stat'}, h('b', {}, String(session.trips.length)), h('span', {}, 'practice trips')),
      h('div', {class: 'stat'}, h('b', {}, `${last.delivered}/${last.squares}`), h('span', {}, 'squares that reach the station')),
      h('div', {class: 'stat'}, h('b', {}, `${last.shortest}/${last.squares}`), h('span', {}, 'squares that take the shortest route')),
      h('div', {class: 'stat'}, h('b', {}, String(mean)), h('span', {}, 'average moves, last 50 trips')));
  }
  function checkpoint() {
    if (session.trips.length % LESSON.bigCheckEvery !== 0) return;
    curve.push({trips: session.trips.length, ...rl.coverage(floor, session.table)});
    drawChart(); drawStats();
  }
  function finished() {
    const done = session.trips.length >= target;
    watch.disabled = done; practice.disabled = done;
    if (done) practice.textContent = `${target} trips done`;
  }
  // Same random draws as rl.trainTrip, so watched trips keep the page in step with the facts file.
  async function watchTrip() {
    if (busy || session.trips.length >= target) return;
    busy = true;
    const g = ctx.g;
    view.clearPaths();
    let pos = rl.tripStart(session);
    const start = pos;
    await view.placeRobot(pos, 0);
    const record = {moves: 0, delivered: false, points: 0, explored: 0};
    while (record.moves < session.maxMoves) {
      const m = rl.takeMove(session, pos);
      record.moves += 1; record.points += m.points; if (m.explored) record.explored += 1;
      await animateMove(view, m, timing().trip);
      if (g !== generation) return;
      view.showScores(session.table);
      ctx.status.textContent = `Practice trip ${session.trips.length + 1}, move ${record.moves}${m.explored ? ' (random move)' : ''}.`;
      pos = m.to;
      if (m.delivered) { record.delivered = true; break; }
    }
    session.trips.push(record);
    checkpoint(); drawStats();
    ctx.status.innerHTML = `Practice trip ${session.trips.length}: started on ${rl.cellName(floor, start)} and delivered in <strong>${record.moves} moves</strong>. The green scores grew along its path.`;
    busy = false;
    finished();
  }
  async function train(count) {
    if (busy) return;
    busy = true; watch.disabled = true; practice.disabled = true;
    const g = ctx.g;
    view.clearPaths(); view.showRobot(false);
    for (let k = 0; k < count && session.trips.length < target; k += 1) {
      rl.trainTrip(session);
      checkpoint();
      view.showScores(session.table);
      ctx.status.textContent = `Practice trip ${session.trips.length}: ${session.trips.at(-1).moves} moves (fast-forward).`;
      await wait(timing().batch);
      if (g !== generation) return;
    }
    const last = curve[curve.length - 1];
    const summary = `After ${session.trips.length} trips: from <strong>${last.delivered} of ${last.squares}</strong> squares the test drive reaches the station, and from <strong>${last.shortest}</strong> it takes the shortest route.`;
    ctx.status.innerHTML = summary;
    // Show the robot using what it learned: a test drive from the far corner.
    view.showRobot(true);
    const d = rl.testDrive(floor, session.table, corner, 80);
    view.drawPath(d.path);
    await animateDrive(view, d, Math.max(timing().move / 3, 40), g);
    if (g !== generation) return;
    const shortest = rl.shortestMoves(floor)[corner];
    ctx.status.innerHTML = `${summary} Test drive from A1: ${d.delivered ? `<strong>${d.moves} moves</strong> (shortest ${shortest})` : '<strong>did not arrive</strong> yet'}.`;
    busy = false;
    finished();
  }
  view.setClickable(async cell => {
    if (busy || cell === floor.station || !floor.open[cell]) return;
    busy = true;
    const g = ctx.g;
    view.clearPaths(); view.showRobot(true);
    const d = rl.testDrive(floor, session.table, cell, 80);
    view.drawPath(d.path);
    await animateDrive(view, d, Math.max(timing().move / 2, 60), g);
    if (g !== generation) return;
    const shortest = rl.shortestMoves(floor)[cell];
    ctx.status.innerHTML = d.delivered
      ? `From ${rl.cellName(floor, cell)}: <strong>${d.moves} moves</strong> (shortest possible ${shortest}).`
      : `From ${rl.cellName(floor, cell)}: <strong>did not arrive</strong> \u2014 this square has not learned enough yet.`;
    busy = false;
  });
  drawChart(); drawStats();
  ctx.explain.append(
    card('Progress', stats),
    card('Test drives from every square', chartSlot,
      h('p', {class: 'small'}, 'Every 10 practice trips we pause and test drive from each of the 52 squares, using the Step 5 rule: highest score, no random moves, no learning. Each test drive ends one of three ways:'),
      h('ul', {class: 'checklist small'},
        h('li', {}, h('strong', {}, 'Takes the shortest route'), ' (orange): it reaches the station in the fewest possible moves.'),
        h('li', {}, h('strong', {}, 'Reaches the station'), ' (teal): it gets there, sometimes by a detour. This line includes the orange squares.'),
        h('li', {}, h('strong', {}, 'Does not arrive'), ': its scores are still blank or all negative, so it bumps or wanders. That is the gap under the teal line.')),
      h('p', {class: 'small muted'}, 'The two lines meet at 52 when every square takes the shortest route. Click a square on the floor to test drive from it yourself.')),
    card('What to notice',
      h('ul', {class: 'checklist'},
        h('li', {}, 'Watch 1 practice trip: each trip starts on a random square, like a new order arriving. Early trips wander for a long time.'),
        h('li', {}, 'Practice 50 trips fast-forwards, then the robot test drives from the far corner (A1) with what it has learned.'),
        h('li', {}, 'Squares near the station learn first. Far corners are visited less, so they learn last.'),
        h('li', {}, 'The recipe did not change at all. Only the amount of practice did.'))));
  ctx.status.textContent = 'A fresh robot: every score is blank. Press Practice 50 trips.';
}

function mountChange(ctx) {
  let session = miniSession();
  const floor = session.floor;
  rl.train(session, LESSON.trainedTrips);
  const pallet = cellIndex(floor, LESSON.palletCell);
  const view = new FloorView(floor, {label: 'Small warehouse where the floor changes'});
  stepShell(ctx, view);
  view.showScores(session.table);
  const log = h('div', {class: 'log'});
  let stage = 0, busy = false;
  const entry = (title, text, kind = '') => log.append(h('div', {class: `entry ${kind}`}, h('strong', {}, title), text));
  const labels = [
    `Drop a pallet on ${LESSON.palletCell}`,
    'Test drive',
    `Practice ${LESSON.changeTrips} trips, then test`,
    'Remove the pallet, then test',
    `Erase the table, practice ${LESSON.changeTrips} trips, test`,
  ];
  const buttons = labels.map((label, index) => h('button', {class: 'btn', type: 'button', onclick: () => act(index)}, h('span', {class: 'n'}, String(index + 1)), label));
  ctx.controls.append(...buttons, button('Start over', () => renderStep(6)));
  const sync = () => buttons.forEach((b, index) => { b.disabled = busy || index !== stage; b.classList.toggle('primary', index === stage); });

  async function test(g) {
    view.clearPaths();
    const d = rl.testDrive(floor, session.table, floor.start, 40);
    view.drawPath(d.path);
    view.showRobot(true);
    await animateDrive(view, d, timing().move, g);
    return d;
  }

  async function practice(count, g) {
    const moves = [];
    view.clearPaths();
    for (let k = 0; k < count; k += 1) {
      moves.push(rl.trainTrip(session).moves.length);
      view.showScores(session.table);
      ctx.status.textContent = `Practice trip ${k + 1} of ${count}: ${moves.at(-1)} moves.`;
      await wait(timing().trip * 4);
      if (g !== generation) return null;
    }
    return moves;
  }

  async function act(index) {
    if (busy || index !== stage) return;
    busy = true; sync();
    const g = ctx.g;
    if (index === 0) {
      floor.open[pallet] = false;
      view.setPallet(pallet, true);
      view.showScores(session.table);
      entry(`1. A pallet now blocks ${LESSON.palletCell}.`, ' The robot does not know. Its scores still point along the bottom aisle.');
    } else if (index === 1) {
      const B3 = cellIndex(floor, 'B3');
      const before = rl.bestTried(session.table, B3);
      const d = await test(g);
      if (g !== generation) return;
      entry('2. Stuck.', ` It drives to B3 and bumps into the pallet ${d.path.length - 2} times. B3 \u2192 still says ${minus(before.score)}: a test drive does not learn.`, 'bad');
    } else if (index === 2) {
      const moves = await practice(LESSON.changeTrips, g);
      if (!moves) return;
      const d = await test(g);
      if (g !== generation) return;
      entry(`3. Practice again: ${moves.join(', ')} moves.`, ` Every bump costs a point, so the blocked arrow's score falls until going over the top looks better. Test: ${d.moves} moves, ${minus(REWARDS.delivery - d.moves)} points.`, 'ok');
    } else if (index === 3) {
      floor.open[pallet] = true;
      view.setPallet(pallet, false);
      view.showScores(session.table);
      const d = await test(g);
      if (g !== generation) return;
      const scores = [0, 1, 2, 3].map(a => `${arrowOf(a)} ${minus(session.table[floor.start * 4 + a])}`).join(', ');
      entry(`4. The pallet is gone, but it still takes ${d.moves} moves.`, ` Scores at A3: ${scores}. It remembers going right as a bad idea. To find out the aisle is open, it would need several random moves in a row in the right direction, which is rare.`, 'bad');
    } else if (index === 4) {
      session = miniSession();
      session.floor = floor;
      view.showScores(session.table);
      const moves = await practice(LESSON.changeTrips, g);
      if (!moves) return;
      const d = await test(g);
      if (g !== generation) return;
      entry(`5. Fresh table, ${LESSON.changeTrips} practice trips: ${d.moves} moves again.`, ' Starting over was faster than waiting for it to rediscover the aisle.', 'ok');
      ctx.explain.append(h('section', {class: 'card accent'}, h('h3', {}, 'The lesson'),
        h('p', {}, 'A trained model only knows the world it practiced in. When the world changes, it must practice again, and sometimes start fresh.'),
        h('p', {class: 'small muted'}, 'Real warehouse systems watch the floor for changes and plan routes from a live map. Learning is saved for decisions nobody can write down.')));
    }
    stage += 1;
    ctx.status.textContent = stage < labels.length ? `Next: press button ${stage + 1}.` : 'Done. Press Start over to replay.';
    busy = false; sync();
  }

  ctx.explain.append(card('What happened', log));
  entry('The trained robot', ' After 20 practice trips it drives A3 \u2192 E3 in 4 moves.', 'ok');
  sync();
  ctx.status.textContent = 'Press button 1.';
}

function renderChapters() {
  const list = document.getElementById('chapters');
  list.replaceChildren(...steps.map((step, index) => h('li', {},
    h('button', {type: 'button', 'aria-current': index === current ? 'step' : null, class: index < current ? 'done' : '',
      onclick: () => renderStep(index)}, h('span', {class: 'num'}, String(index + 1)), h('span', {class: 'label'}, step.label)))));
}

let current = 0;
function renderStep(index) {
  generation += 1;
  keyHandler = null;
  current = Math.max(0, Math.min(steps.length - 1, index));
  const step = steps[current];
  const article = document.getElementById('step');
  const floorWrap = h('div', {class: 'floor-wrap'});
  const controls = h('div', {class: 'controls'});
  const status = h('p', {class: 'status', 'aria-live': 'polite'});
  const stageCol = h('div', {class: 'stage-col'}, controls, status);
  const explain = h('aside', {class: 'explain', 'aria-label': 'Explanation'});
  const body = h('div', {class: 'step-body fit-top'}, h('div', {class: 'fit-stage'}, stageCol, floorWrap), explain);
  article.replaceChildren(
    h('div', {class: 'step-head'}, h('p', {class: 'step-kicker'}, `Step ${current + 1} of ${steps.length} \u00b7 ${step.stage}`),
      h('h2', {}, step.title), h('p', {class: 'lead'}, step.lead)),
    body);
  step.mount({floorWrap, controls, status, explain, stageCol, g: generation});
  live.fitLesson(body, floorWrap);
  renderChapters();
  document.getElementById('count').textContent = `${current + 1} / ${steps.length}`;
  document.getElementById('back').disabled = current === 0;
  const next = document.getElementById('next');
  next.disabled = current === steps.length - 1;
  if (location.hash !== `#${step.id}`) history.replaceState(null, '', `#${step.id}`);
}

/* ── Training lab: watch the robot learn ───────────────────────────── */

function mountLab() {
  generation += 1;
  keyHandler = null;
  const g0 = generation;
  const root = document.getElementById('lab');
  const settings = {floor: 'mini', exploration: 0.2, delivery: REWARDS.delivery, moveCost: REWARDS.moveCost, startMode: 'fixed', seed: 1};
  // Robot animation time per move and pause after each move, per speed.
  const PACE = {watch: {ms: 280, rest: 60, tripRest: 600}, fast: {ms: 45, rest: 5, tripRest: 80}};
  let floor, session, view, edit = false, speed = 'watch', trip = null, latest = null, drawnAt = 0, testing = false;
  const floorWrap = h('div', {class: 'scene'});
  const status = h('p', {class: 'status', 'aria-live': 'off'});
  const stats = h('div', {class: 'stats'});
  const nowSlot = h('div', {class: 'wide'});
  const chartSlot = h('div');
  const log = h('ol', {class: 'live-log', 'aria-label': 'Finished practice trips'});
  const testSlot = h('div');
  const cellSlot = h('div');
  const tripNo = () => session.trips.length + 1;

  function fresh(keepFloor = false) {
    if (!keepFloor) {
      floor = rl.parseFloor(settings.floor === 'mini' ? MINI_FLOOR : BIG_FLOOR);
      view = new FloorView(floor, {big: settings.floor === 'big', label: 'Training lab floor'});
      view.setClickable(onCell);
      floorWrap.replaceChildren(view.el);
    }
    session = rl.createSession({floor, seed: settings.seed, exploration: settings.exploration,
      rewards: {delivery: settings.delivery, moveCost: settings.moveCost}, startMode: settings.startMode,
      maxMoves: settings.floor === 'mini' ? LESSON.miniMaxMoves : LESSON.bigMaxMoves});
    trip = null;
    latest = null;
    view.clearPaths();
    view.showScores(session.table, {delivery: settings.delivery});
    view.placeRobot(floor.start, 0);
    log.replaceChildren();
    nowSlot.replaceChildren(card('What just happened', h('p', {class: 'small muted'},
      'Each move the robot picks an arrow (the highest score, or sometimes a random one), gets points, and rewrites the score of that arrow: points now + the best score where it landed. The latest move appears here.')));
    testSlot.replaceChildren(card('Test drive', h('p', {class: 'small muted'}, 'Press Test drive from START, or click any square. A test drive always takes the highest score: no random moves, no learning.')));
    cellSlot.replaceChildren(card('Scores on a square', h('p', {class: 'small muted'}, 'After each move, the four scores of the square the robot just left appear here, with the one it rewrote outlined.')));
    drawTrips();
    drawLive(true);
  }

  function drawTrips() {
    const recent = session.trips.slice(-60).map(t => t.moves);
    const shortest = settings.startMode === 'fixed' ? rl.shortestMoves(floor)[floor.start] : null;
    chartSlot.replaceChildren(recent.length
      ? barChart({values: recent, ref: Number.isFinite(shortest) ? shortest : null, refLabel: `shortest = ${shortest}`, title: 'Moves per practice trip', firstIndex: session.trips.length - recent.length + 1, width: 400, height: 220})
      : h('p', {class: 'small muted'}, 'A bar appears each time the robot reaches the packing station.'));
  }

  // The live panels. At Fast they are redrawn a few times a second, not after every move.
  function drawLive(force = false) {
    if (!force && speed !== 'watch' && performance.now() - drawnAt < 350) return;
    drawnAt = performance.now();
    const last = session.trips.at(-1);
    const cov = rl.coverage(floor, session.table);
    stats.replaceChildren(
      h('div', {class: 'stat'}, h('b', {}, `Trip ${tripNo()}`), h('span', {}, `practising, ${trip ? trip.moves.length : 0} moves so far`)),
      h('div', {class: 'stat'}, h('b', {}, last ? String(last.moves) : '\u2014'), h('span', {}, 'moves, last finished trip')),
      h('div', {class: 'stat'}, h('b', {}, `${cov.delivered}/${cov.squares}`), h('span', {}, 'squares it can deliver from')),
      h('div', {class: 'stat'}, h('b', {}, `${cov.shortest}/${cov.squares}`), h('span', {}, 'on a shortest route')),
      h('div', {class: 'stat'}, h('b', {}, `${Math.round(settings.exploration * 100)}%`), h('span', {}, 'random moves')));
    if (latest) {
      const {m} = latest;
      nowSlot.replaceChildren(describeMove(floor, m, latest.trip, latest.index,
        {title: `What just happened \u00b7 trip ${latest.trip}, move ${latest.index}`, exploration: settings.exploration, delivery: settings.delivery}));
      cellSlot.replaceChildren(card(`Scores on ${rl.cellName(floor, m.from)}`, compass(session.table, m.from, m.action),
        h('p', {class: 'small muted', style: 'margin-top:8px'}, `Outlined: ${arrowOf(m.action)}, the score it just rewrote. The test drive takes the highest of the four.`)));
    }
  }

  function startTrip() {
    const start = rl.tripStart(session);
    trip = {start, moves: [], steps: rl.tripMoves(session, start, session.maxMoves)};
    view.clearPaths();
    view.placeRobot(start, 0);
  }

  function finishTrip() {
    const done = rl.recordTrip(session, rl.tripOf(trip.start, trip.moves));
    trip = null;
    const n = session.trips.length;
    log.prepend(h('li', {}, `Trip ${n}: ${done.moves.length} moves, ${done.delivered ? 'delivered' : 'gave up'}, ${minus(done.points)} points`));
    while (log.children.length > 40) log.lastChild.remove();
    if (done.delivered) view.flash(floor.station);
    drawTrips();
  }

  function remember(m) {
    trip.moves.push(m);
    latest = {m, trip: tripNo(), index: trip.moves.length};
  }

  async function unit() {
    const pace = PACE[speed];
    if (!trip) {
      startTrip();
      status.textContent = `Trip ${tripNo()} starts on ${rl.cellName(floor, trip.start)}.`;
      drawLive(true);
      await wait(pace.tripRest / 2);
      return;
    }
    const next = trip.steps.next();
    if (next.done) {
      finishTrip();
      const last = session.trips.at(-1);
      status.textContent = `Trip ${session.trips.length} ${last.delivered ? 'delivered' : 'stopped'} after ${last.moves} moves.`;
      drawLive(true);
      await wait(pace.tripRest);
      return;
    }
    const m = next.value;
    remember(m);
    view.showScores(session.table, {delivery: settings.delivery});
    status.textContent = `Trip ${latest.trip}, move ${latest.index}: ${arrowOf(m.action)}${m.explored ? ' (random)' : ''} ${m.bumped ? 'bumped' : `to ${rl.cellName(floor, m.to)}`}, ${minus(m.points)} points.`;
    drawLive();
    await animateMove(view, m, pace.ms);
    await wait(pace.rest);
  }

  const player = live.player({unit, alive: () => generation === g0});

  async function testFrom(cell) {
    if (testing) return;
    const wasPlaying = player.playing;
    testing = true;
    player.stop();
    await wait(PACE.watch.ms + 60);
    const g = generation;
    view.clearPaths();
    const d = rl.testDrive(floor, session.table, cell, 4 * rl.openCells(floor).length);
    view.drawPath(d.path);
    await animateDrive(view, d, Math.max(timing().move / 2, 90), g);
    if (g !== generation) return;
    const shortest = rl.shortestMoves(floor)[cell];
    const result = d.delivered
      ? `${d.moves} moves (shortest possible ${shortest})${d.moves === shortest ? ': a shortest route.' : '.'}`
      : `did not arrive (${d.stuck === 'bump' ? 'bumped three times in a row' : 'too many moves'}).`;
    testSlot.replaceChildren(card(`Test drive from ${rl.cellName(floor, cell)} after ${session.trips.length} trips`,
      h('p', {}, h('strong', {}, result)),
      h('p', {class: 'small muted'}, 'Orange line = the test route. Practice carries on from where the robot was.')));
    status.textContent = `Test drive from ${rl.cellName(floor, cell)}: ${result}`;
    await wait(900);
    if (g !== generation) return;
    view.placeRobot(trip ? (trip.moves.length ? trip.moves.at(-1).to : trip.start) : floor.start, 0);
    testing = false;
    if (wasPlaying) player.play();
  }

  function onCell(cell) {
    if (testing || cell === floor.station) return;
    if (edit) {
      if (cell === floor.start) { status.textContent = 'The start square must stay open.'; return; }
      const isPallet = view.pallets.has(cell);
      if (!floor.open[cell] && !isPallet) { status.textContent = 'Shelves stay put. Click an open square to drop a pallet.'; return; }
      floor.open[cell] = isPallet;
      view.setPallet(cell, !isPallet);
      view.showScores(session.table, {delivery: settings.delivery});
      drawLive(true);
      status.textContent = isPallet ? `Pallet removed from ${rl.cellName(floor, cell)}. The score table was not changed.` : `Pallet dropped on ${rl.cellName(floor, cell)}. The score table was not changed.`;
      return;
    }
    if (!floor.open[cell]) return;
    testFrom(cell);
  }

  const changed = keepFloor => { fresh(keepFloor); status.textContent = 'Setting changed: the robot starts again from a blank table.'; };
  const range = (label, min, max, stepSize, key, format, parse = Number) => {
    const out = h('span', {class: 'value-out'}, format(settings[key]));
    const input = h('input', {type: 'range', min, max, step: stepSize, value: key === 'exploration' ? settings[key] * 100 : settings[key], 'aria-label': label,
      oninput: event => { out.textContent = format(parse(event.target.value)); },
      onchange: event => { settings[key] = parse(event.target.value); changed(true); }});
    return [h('label', {}, label), h('div', {}, input, out)];
  };
  const pick = (label, key, options) => {
    const group = h('div', {class: 'toggle', role: 'group', 'aria-label': label});
    const renderPick = () => group.replaceChildren(...options.map(([value, text]) => h('button', {type: 'button', 'aria-pressed': String(settings[key] === value),
      onclick: () => { if (testing) return; settings[key] = value; renderPick(); changed(key !== 'floor'); }}, text)));
    renderPick();
    return [h('label', {}, label), group];
  };
  const seedInput = h('input', {type: 'number', min: 1, max: 9999, value: settings.seed, 'aria-label': 'Random seed',
    onchange: event => { settings.seed = Math.max(1, Math.min(9999, Math.round(Number(event.target.value) || 1))); event.target.value = settings.seed; changed(true); }});
  const editBtn = button('Edit floor: off', () => {
    edit = !edit;
    editBtn.textContent = `Edit floor: ${edit ? 'on \u2014 click squares to add or remove pallets' : 'off'}`;
    editBtn.classList.toggle('primary', edit);
  });
  const popup = live.settingsPopup('Training lab settings',
    h('div', {class: 'settings'},
      ...pick('Floor', 'floor', [['mini', 'Small (11 squares)'], ['big', 'Large (52 squares)']]),
      ...range('Random moves', 0, 50, 5, 'exploration', v => `${Math.round(v * 100)}%`, v => Number(v) / 100),
      ...range('Delivery points', 5, 40, 1, 'delivery', v => `+${v}`),
      ...range('Cost per move', 0, 3, 1, 'moveCost', v => (v ? `\u2212${v}` : '0')),
      ...pick('Each trip starts', 'startMode', [['fixed', 'At START'], ['random', 'Random square']]),
      h('label', {}, 'Random seed'), seedInput),
    h('p', {class: 'pop-note'}, 'Any change starts the robot again from a blank table. Pallets you dropped stay unless you change the floor.'),
    h('h4', {}, 'Experiments to try'),
    h('ol', {class: 'steps-list small'},
      h('li', {}, 'Random moves 0%. Does it still find the 4-move route? (Blank arrows count as 0, so it still tries new things.)'),
      h('li', {}, 'After about 20 trips, turn on Edit floor and drop a pallet on its route. Test drive, then let it practise on.'),
      h('li', {}, 'Cost per move 0. Do the trips get shorter?'),
      h('li', {}, 'Large floor, starts At START, Fast for about 100 trips. Click a far corner: has it learned there?')));

  const layout = h('div', {class: 'live-lab'},
    h('div', {class: 'live-head'},
      h('div', {}, h('p', {class: 'step-kicker'}, 'Training lab \u00b7 watch it learn'),
        h('h2', {}, 'Watch the robot learn, one move at a time.'),
        h('p', {class: 'lead'}, 'It starts knowing nothing and practises trip after trip while you watch. Click a square to test drive from it; the gear changes the floor and the points.')),
      popup.gear),
    popup.dialog,
    h('div', {class: 'live-stage'}, legend([['Robot', '#7eaeb8'], ['Packing station', '#e8913c'], ['Arrow + number = best score found on that square', '#4f7780'], ['Grey = tried, nothing good yet', '#3b3f4a']]), floorWrap),
    h('div', {class: 'live-bar'},
      h('div', {class: 'controls live-controls'}, player.button, live.speedSwitch(speed, value => { speed = value; drawLive(true); }),
        button('Test drive from START', () => testFrom(floor.start)), button('Restart', () => { if (!testing) { fresh(true); status.textContent = 'Restarted: blank table, same floor.'; } }), editBtn),
      status),
    h('div', {class: 'live-panels'},
      h('div', {class: 'stack'}, card('Training, live', stats), testSlot),
      nowSlot,
      card('Practice trips', chartSlot, log),
      cellSlot));
  root.replaceChildren(layout);
  live.fillWindow(layout);
  fresh();
  status.textContent = live.REDUCED ? 'Press Play to start practice.' : 'Practice has started. Pause any time, or switch to Fast.';
  if (!live.REDUCED) player.play();
  return g0;
}

/* ── Wiring ────────────────────────────────────────────────────────── */

function showMode(mode) {
  const lab = mode === 'lab';
  document.getElementById('lesson').hidden = lab;
  document.getElementById('lab').hidden = !lab;
  document.getElementById('mode-lesson').setAttribute('aria-selected', String(!lab));
  document.getElementById('mode-lab').setAttribute('aria-selected', String(lab));
  document.body.classList.toggle('lab-mode', lab);
  if (lab) { mountLab(); history.replaceState(null, '', '#lab'); } else renderStep(current);
}

function routeFromHash() {
  const hash = location.hash.slice(1);
  if (hash === 'lab') { showMode('lab'); return; }
  const index = steps.findIndex(step => step.id === hash);
  current = index >= 0 ? index : 0;
  showMode('lesson');
}

document.getElementById('mode-lesson').addEventListener('click', () => showMode('lesson'));
document.getElementById('mode-lab').addEventListener('click', () => showMode('lab'));
document.getElementById('back').addEventListener('click', () => { renderStep(current - 1); window.scrollTo({top: 0}); });
document.getElementById('next').addEventListener('click', () => { renderStep(current + 1); window.scrollTo({top: 0}); });
document.getElementById('speed').addEventListener('change', event => { speed = event.target.value; });
window.addEventListener('keydown', event => {
  const tag = (event.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea'].includes(tag)) return;
  if (keyHandler) keyHandler(event);
});
window.addEventListener('hashchange', routeFromHash);
function showError(message) {
  const banner = document.getElementById('error-banner');
  banner.textContent = `Something went wrong (${message}). Reload the page before continuing; do not trust the current result.`;
  banner.hidden = false;
}
window.addEventListener('error', event => showError(event.message));
window.addEventListener('unhandledrejection', event => showError(String(event.reason)));
routeFromHash();

</script>
