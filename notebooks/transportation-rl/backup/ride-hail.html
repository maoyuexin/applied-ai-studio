<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train a Ride-Hail Driver</title>
<style>
:root {
  --bg: #111318;
  --panel: #181a20;
  --panel-2: #222530;
  --line: #2e323d;
  --text: #f5f3f0;
  --dim: #b9bdc6;
  --faint: #858a97;
  --orange: #e8913c;
  --orange-soft: #3a2a17;
  --teal: #7eaeb8;
  --teal-bright: #a8d4dd;
  --red: #e5675f;
  --green: #7cc59a;
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-size: 17px; line-height: 1.45; }
button, select, input { font: inherit; }
[hidden] { display: none !important; }

.top {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  max-width: 1440px; margin: 0 auto; padding: 18px 32px 14px;
  border-bottom: 1px solid var(--line);
}
.brand { flex: 1 1 380px; }
.kicker { margin: 0; color: var(--teal); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.brand h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.15; }
.modes { display: flex; gap: 6px; }
.modes button, .speed select {
  min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--dim); cursor: pointer;
}
.modes button[aria-selected="true"] { background: var(--panel-2); color: var(--text); border-color: var(--teal); }
.speed { color: var(--dim); font-size: 15px; }
.speed select { margin-left: 6px; min-height: 40px; padding: 6px 10px; }

main { max-width: 1440px; margin: 0 auto; padding: 14px 32px 28px; }

.chapters { display: flex; gap: 6px; list-style: none; margin: 0 0 14px; padding: 0; flex-wrap: wrap; }
.chapters button {
  display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px 6px 6px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; font-size: 15px;
}
.chapters .num {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--faint); font-size: 14px; font-weight: 700;
}
.chapters button[aria-current="step"] { color: var(--text); border-color: var(--orange); }
.chapters button[aria-current="step"] .num { background: var(--orange); border-color: var(--orange); color: #1b1206; }
.chapters button.done .num { border-color: var(--teal); color: var(--teal); }

.step-kicker { margin: 0; color: var(--orange); font-size: 14px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.step-head h2 { margin: 4px 0 6px; font-size: 32px; line-height: 1.15; }
.lead { margin: 0 0 14px; color: var(--dim); font-size: 19px; max-width: 1000px; }

.step-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.95fr); gap: 22px; align-items: start; }
.stage-col { min-width: 0; }
.floor-wrap {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
  display: grid; place-items: center;
}
.floor-wrap.pair { grid-template-columns: 1fr 1fr; gap: 10px; }
svg.floor { width: 100%; height: auto; max-height: 440px; display: block; user-select: none; }
svg.floor.big { max-height: 470px; }
.floor-caption { margin: 8px 4px 0; color: var(--faint); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 4px 0; color: var(--dim); font-size: 14px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--swatch); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
.btn {
  min-height: 46px; padding: 9px 18px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); cursor: pointer; font-weight: 600;
}
.btn:hover:not(:disabled) { border-color: var(--teal); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #1b1206; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn:focus-visible, .chapters button:focus-visible, .modes button:focus-visible, .pad button:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
.btn .n { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: rgba(0,0,0,.25); font-size: 13px; }

.pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 48px); gap: 6px; }
.pad button { border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; }
.pad button:disabled { opacity: .4; }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }

.status { min-height: 26px; margin: 10px 4px 0; color: var(--dim); font-size: 16px; }
.status strong { color: var(--text); }

.explain { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.card h3 { margin: 0 0 8px; font-size: 14px; color: var(--teal); letter-spacing: .07em; text-transform: uppercase; }
.card p { margin: 0 0 8px; }
.card p:last-child { margin-bottom: 0; }
.card.accent { border-color: var(--orange); background: linear-gradient(0deg, rgba(232,145,60,.06), rgba(232,145,60,.06)), var(--panel); }
.card.good { border-color: var(--teal); }
.card.warn { border-color: var(--red); }
.muted { color: var(--dim); }
.small { font-size: 15px; }
.big-number { font-size: 34px; font-weight: 800; color: var(--orange); line-height: 1.1; }

.points { width: 100%; border-collapse: collapse; }
.points td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.points tr:last-child td { border-bottom: 0; }
.points td:last-child { text-align: right; font-weight: 800; font-size: 20px; white-space: nowrap; }
.plus { color: var(--green); }
.minus { color: var(--red); }

.formula {
  font-size: 19px; font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--panel-2);
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.formula .term { padding: 2px 8px; border-radius: 7px; background: var(--bg); }
.formula .t-new { color: var(--orange); }
.formula .t-now { color: var(--red); }
.formula .t-next { color: var(--teal-bright); }

.moveline { display: grid; grid-template-columns: 150px 1fr; gap: 3px 10px; font-size: 16px; }
.moveline dt { color: var(--faint); }
.moveline dd { margin: 0; }
.calc { margin-top: 8px; font-size: 21px; font-weight: 800; }
.calc .eq { color: var(--orange); }

.compass { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 40px); gap: 4px; justify-content: start; }
.compass div { display: grid; place-items: center; border-radius: 8px; background: var(--panel-2); font-weight: 700; }
.compass .c { background: transparent; color: var(--faint); font-size: 14px; }
.compass .hl { outline: 2px solid var(--orange); }
.compass .blank { color: var(--faint); }

table.data { width: 100%; border-collapse: collapse; font-size: 15px; }
table.data th { text-align: left; color: var(--faint); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.data td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.new td { background: rgba(126,174,184,.12); }
table.q { font-size: 14px; }
table.q td, table.q th { padding: 2px 6px; }
table.q td { text-align: center; }
table.q td:first-child, table.q th:first-child { text-align: left; }
table.q th { text-align: center; }

.terms { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; margin: 0; font-size: 16px; }
.terms dt { font-weight: 800; color: var(--text); }
.terms dd { margin: 0; color: var(--dim); }

.checklist { margin: 0; padding-left: 20px; }
.checklist li { margin: 4px 0; }
.steps-list { margin: 0; padding-left: 22px; }
.steps-list li { margin: 5px 0; }

.log { display: grid; gap: 8px; }
.log .entry { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.log .entry.bad { border-color: var(--red); }
.log .entry.ok { border-color: var(--teal); }
.log .entry strong { display: block; }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: inherit; }

.stepnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.stepnav .count { color: var(--faint); }

/* Floor drawing */
.tile { fill: #1d2028; stroke: #2c303a; stroke-width: 2; }
.tile.clickable { cursor: pointer; }
.tile.clickable:hover { stroke: var(--teal); }
.shelf-body { fill: #2a3446; stroke: #3a4760; stroke-width: 2; }
.shelf-line { stroke: #43506a; stroke-width: 3; }
.shelf-box { fill: #6a5238; }
.station-body { fill: var(--orange-soft); stroke: var(--orange); stroke-width: 3; }
.station-label { fill: var(--orange); font-size: 15px; font-weight: 800; letter-spacing: 1px; }
.coord { fill: var(--faint); font-size: 18px; font-weight: 700; }
.start-label { fill: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.score-tint { fill: var(--teal); }
.score-num { fill: var(--text); font-size: 30px; font-weight: 800; }
.score-num.low { fill: var(--faint); font-size: 22px; font-weight: 700; }
.score-arrow { fill: var(--teal-bright); font-size: 24px; font-weight: 800; }
.score-arrow.low { fill: var(--faint); font-size: 18px; }
.slot { fill: var(--faint); font-size: 16px; font-weight: 800; }
.slot.filled { fill: var(--text); }
.slot-box { fill: none; stroke: #4d5362; stroke-width: 2; stroke-dasharray: 4 3; }
.slot-box.filled { fill: #2b3140; stroke: var(--teal); stroke-dasharray: none; }
.flash { fill: none; stroke: var(--orange); stroke-width: 5; }
.path-test { fill: none; stroke: var(--orange); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.path-map { fill: none; stroke: var(--text); stroke-width: 4; stroke-dasharray: 10 10; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.robot { transition-property: transform; transition-timing-function: ease-in-out; }
.robot-body { fill: var(--teal); stroke: #d9eef2; stroke-width: 2; }
.robot-face { fill: #173038; }
.robot-eye { fill: #e8fbff; }
.robot-load { fill: var(--orange); }
.robot.bumped .robot-body { fill: var(--red); }
.pallet-body { fill: #7a4e24; stroke: #c98a4b; stroke-width: 3; }
.pallet-strap { stroke: #c98a4b; stroke-width: 4; }
.pallet-label { fill: #fbe3c8; font-size: 14px; font-weight: 800; letter-spacing: .5px; }

/* Lab */
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.95fr); gap: 22px; align-items: start; }
.settings { display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px; align-items: center; }
.settings label { color: var(--dim); font-size: 15px; }
.settings > div { display: flex; align-items: center; gap: 10px; }
.settings input[type="range"] { flex: 1; min-width: 0; accent-color: var(--orange); }
.settings select, .settings input[type="number"] {
  min-height: 40px; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
}
.value-out { color: var(--text); font-weight: 700; min-width: 44px; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 24px; }
.stat span { color: var(--faint); font-size: 13px; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.toggle button { min-height: 40px; padding: 6px 14px; border: 0; background: var(--panel); color: var(--dim); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -3px 0 var(--orange); }

/* Live labs: header gear, settings pop-up, play button, live panel */
.lab-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.gear-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.gear-btn svg { width: 22px; height: 22px; color: var(--orange); }
.gear-btn:hover { border-color: var(--teal); }
.gear-btn:focus-visible, .pop-close:focus-visible, .toggle button:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
dialog.settings-pop { position: fixed; inset: 88px 24px auto auto; margin: 0; width: min(470px, calc(100vw - 32px)); max-height: calc(100vh - 112px);
  padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: auto; }
dialog.settings-pop::backdrop { background: rgba(8,9,12,.55); }
.pop-inner { padding: 16px 18px 18px; }
.pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.pop-head h3 { margin: 0; font-size: 19px; }
.pop-inner h4 { margin: 18px 0 6px; font-size: 15px; color: var(--dim); }
.pop-close { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; }
.pop-note { color: var(--faint); font-size: 13px; margin: 12px 0 0; }
.help-btn { flex: none; width: 34px; height: 34px; margin-left: auto; border: 1px solid var(--line); border-radius: 50%; background: var(--panel);
  color: var(--orange); font: inherit; font-size: 18px; font-weight: 800; line-height: 1; cursor: pointer; }
.help-btn:hover { border-color: var(--teal); }
.help-btn:focus-visible { outline: 3px solid var(--teal-bright); outline-offset: 2px; }
.card h3.with-help { display: flex; align-items: center; gap: 8px; }
.card h3.with-help .help-btn { width: 28px; height: 28px; font-size: 15px; }
dialog.settings-pop.help-pop { inset: 0; margin: auto; height: fit-content; width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
.help-pop p { margin: 0 0 10px; }
.help-pop .formula { font-size: 16px; margin-bottom: 12px; }
.help-pop .terms { font-size: 15px; }
.help-pop .steps-list { font-size: 15px; }
.play-btn { min-width: 124px; }
.live-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.live-now { border-left: 3px solid var(--orange); padding-left: 10px; margin: 0 0 8px; color: var(--dim); font-size: 14px; }
.live-log { list-style: none; margin: 0; padding: 0; font-size: 14px; max-height: 150px; overflow: auto; }
.live-log li { padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--dim); }
.live-log li:first-child { color: var(--text); }

/* One-screen live lab: scene across the top, one control bar, then a row of panels. */
body.lab-mode .top .speed { display: none; }
body.lab-mode main { padding-bottom: 0; }
.live-lab { display: flex; flex-direction: column; gap: 10px; }
.live-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.live-head .step-kicker { margin: 0; }
.live-head h2 { margin: 2px 0 0; font-size: 24px; line-height: 1.2; }
.live-head .lead { margin: 3px 0 0; font-size: 15px; max-width: none; }
.live-stage { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; align-items: stretch;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.live-stage .legend { flex: 0 0 170px; flex-direction: column; align-self: flex-start; gap: 7px; margin: 4px 0 0; font-size: 13px; }
.live-stage .scene { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.live-stage .scene > svg { width: 100%; height: 100%; max-height: none; }
.live-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.live-bar .controls { margin: 0; }
.live-bar .status { flex: 1 1 320px; margin: 0; min-height: 0; font-size: 15px; }
.live-panels { flex: 0 0 clamp(210px, 29vh, 290px); display: flex; gap: 10px; min-height: 0; }
.live-panels > * { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; }
.live-panels > .wide { flex-grow: 1.35; }
.live-panels > .wider { flex-grow: 1.7; }
.live-panels > .widest { flex-grow: 2; }
.live-panels > .narrow { flex-grow: 0.8; }
.live-panels > .stack { display: flex; flex-direction: column; gap: 10px; }
.live-panels .card { height: 100%; overflow: auto; padding: 10px 12px; }
.live-panels > .stack > .card { height: auto; flex: 0 0 auto; }
.live-panels .card h3 { font-size: 12.5px; margin-bottom: 6px; }
.live-panels .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.live-panels .stat { padding: 5px 8px; }
.live-panels .stat b { font-size: 18px; }
.live-panels .stat span { font-size: 12px; }
.live-panels .moveline { grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 13.5px; }
.live-panels .calc { font-size: 15px; margin-top: 6px; }
.live-panels .live-log { max-height: none; font-size: 13px; }
.live-panels table.data { font-size: 13px; }
.live-panels .pgrids { gap: 8px; }
.live-panels .pgrid h4 { font-size: 12.5px; margin-bottom: 4px; }
.live-panels .pgrid table { font-size: 11.5px; border-spacing: 2px; }
.live-panels .pgrid td { padding: 3px 1px; }
.live-panels .axis-note { display: none; }
.live-panels table.qd td, .live-panels table.qd th { padding: 3px 4px; font-size: 12px; }
.live-panels .steps-list { margin: 0 0 8px; }
/* Side layout (square scenes such as the New York map): columns of panels left and right of a full-height scene. */
.live-main { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
.live-side { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.live-side.right { flex-grow: 1.2; }
.live-side .card { flex: 0 0 auto; padding: 10px 12px; }
.live-side .card h3 { font-size: 12.5px; margin-bottom: 6px; }
.live-side .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.live-side .stat { padding: 5px 8px; }
.live-side .stat b { font-size: 18px; }
.live-side .stat span { font-size: 12px; }
.live-side .moveline { grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 13.5px; }
.live-side .calc { font-size: 15px; margin-top: 6px; }
.live-side .live-log { max-height: 96px; font-size: 13px; }
.live-side table.data { font-size: 13px; }
.live-side table.qd td, .live-side table.qd th { padding: 3px 4px; font-size: 12px; }
.live-side .steps-list { margin: 0 0 8px; }
.live-main > .live-stage { flex: 0 0 auto; position: relative; padding: 6px; }
.live-main > .live-stage .legend { position: absolute; top: 12px; left: 12px; z-index: 1; margin: 0; padding: 8px 10px; border-radius: 10px;
  background: rgba(14, 24, 34, .86); flex-direction: column; gap: 5px; font-size: 12.5px; }
@media (max-width: 900px) {
  .live-main { flex: none; flex-direction: column; }
  .live-main > .live-stage .legend { position: static; flex-direction: row; background: none; padding: 0 0 6px; }
  .live-side { flex: none; overflow: visible; }
}
.rule-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; font-size: 13px; color: var(--dim); }
.rule-list strong { color: var(--text); }

/* Guided lesson on one screen: controls column + scene, then explanation cards in a row ('top')
   or a column beside a height-sized square scene ('side'). Narrow screens keep the stacked page. */
.fit-stage { display: contents; }
.explain > div:empty { display: none; }
@media (max-width: 900px) {
  .fit-stage > .floor-wrap { order: -1; }
}
@media (min-width: 901px) {
  #lesson .chapters { margin-bottom: 8px; }
  #lesson .chapters button { min-height: 34px; padding: 3px 10px 3px 4px; font-size: 14px; }
  #lesson .chapters .num { width: 24px; height: 24px; font-size: 13px; }
  #lesson .step-head h2 { font-size: 25px; margin: 2px 0 4px; }
  #lesson .lead { font-size: 16px; margin-bottom: 8px; max-width: none; }
  #lesson .stepnav { margin-top: 10px; padding-top: 10px; }
  .step-body.fit-top, .step-body.fit-side { display: flex; gap: 10px; min-height: 0; align-items: stretch; }
  .step-body.fit-top { flex-direction: column; }
  .fit-stage { display: flex; gap: 14px; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
  .fit-top .fit-stage { flex: 1 1 0; }
  .fit-side .fit-stage { flex: 0 0 auto; }
  .fit-stage > .stage-col { flex: 0 0 300px; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }

// Seeded random numbers (mulberry32), identical to src/robot-lab/rl.js and the notebooks' Python port.
function seededRandom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === false || value === null || value === undefined) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

function s(tag, attrs = {}, content) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (content !== undefined) node.textContent = content;
  return node;
}

function niceMax(value) {
  const steps = [5, 10, 20, 25, 50, 100, 150, 200, 250, 300, 400, 500, 600, 800, 1000];
  return steps.find(step => step >= value) || Math.ceil(value / 100) * 100;
}

function chartFrame(title, width, height) {
  return s('svg', {viewBox: `0 0 ${width} ${height}`, class: 'chart', role: 'img', 'aria-label': title});
}

function axes(chart, {left, top, plotW, plotH, yMax, yLabel, xLabel, width}) {
  for (const fraction of [0, 0.5, 1]) {
    const y = top + plotH - fraction * plotH;
    chart.append(s('line', {x1: left, y1: y, x2: left + plotW, y2: y, stroke: '#2e323d', 'stroke-width': 1}));
    chart.append(s('text', {x: left - 8, y: y + 5, 'text-anchor': 'end', fill: '#858a97', 'font-size': 13}, String(Math.round(fraction * yMax))));
  }
  if (yLabel) chart.append(s('text', {x: left, y: top - 9, fill: '#b9bdc6', 'font-size': 13}, yLabel));
  if (xLabel) chart.append(s('text', {x: width - 12, y: top + plotH + 32, 'text-anchor': 'end', fill: '#b9bdc6', 'font-size': 13}, xLabel));
}

function barChart({values, ref = null, refLabel = '', max, title, yLabel = '', xLabel = '', color = '#7eaeb8', height = 210, firstIndex = 1, labels = null, valueLabels = false, width = 560}) {
  const left = 44, right = ref === null ? 14 : 96, top = 26, bottom = 38;
  const plotW = width - left - right, plotH = height - top - bottom;
  const yMax = niceMax(max ?? Math.max(1, ...values, ref ?? 0));
  const chart = chartFrame(title, width, height);
  axes(chart, {left, top, plotW, plotH, yMax, yLabel, xLabel, width});
  const slot = plotW / Math.max(values.length, 1);
  values.forEach((v, index) => {
    const barH = Math.max(1.5, (Math.min(v, yMax) / yMax) * plotH);
    const fill = Array.isArray(color) ? color[index] : color;
    chart.append(s('rect', {x: left + index * slot + slot * 0.15, y: top + plotH - barH, width: slot * 0.7, height: barH, rx: 2, fill}));
    if (valueLabels) chart.append(s('text', {x: left + index * slot + slot / 2, y: top + plotH - barH - 6, 'text-anchor': 'middle', fill: '#f5f3f0', 'font-size': 13, 'font-weight': 700}, typeof valueLabels === 'function' ? valueLabels(v) : String(v)));
    const label = labels ? labels[index] : firstIndex + index;
    if (labels || values.length <= 20 || label === firstIndex || label % 10 === 0) {
      chart.append(s('text', {x: left + index * slot + slot / 2, y: top + plotH + 17, 'text-anchor': 'middle', fill: '#858a97', 'font-size': 12}, String(label)));
    }
  });
  if (ref !== null) {
    const y = top + plotH - (ref / yMax) * plotH;
    chart.append(s('line', {x1: left, y1: y, x2: left + plotW + 4, y2: y, stroke: '#e8913c', 'stroke-width': 2, 'stroke-dasharray': '7 6'}));
    chart.append(s('text', {x: left + plotW + 8, y: y + 5, fill: '#e8913c', 'font-size': 13, 'font-weight': 700}, refLabel));
  }
  return chart;
}

function lineChart({series, xMax, yMax, title, yLabel, xLabel, height = 240, refs = []}) {
  const width = 560;
  const left = 44, right = refs.length ? 110 : 18, top = 40, bottom = 38;
  const plotW = width - left - right, plotH = height - top - bottom;
  const chart = chartFrame(title, width, height);
  axes(chart, {left, top, plotW, plotH, yMax, yLabel, xLabel, width});
  for (const x of [0, xMax / 2, xMax]) {
    chart.append(s('text', {x: left + (x / xMax) * plotW, y: top + plotH + 17, 'text-anchor': 'middle', fill: '#858a97', 'font-size': 12}, String(x)));
  }
  for (const ref of refs) {
    const y = top + plotH - (Math.min(ref.value, yMax) / yMax) * plotH;
    chart.append(s('line', {x1: left, y1: y, x2: left + plotW + 4, y2: y, stroke: ref.color, 'stroke-width': 2, 'stroke-dasharray': '7 6'}));
    chart.append(s('text', {x: left + plotW + 8, y: y + 5, fill: ref.color, 'font-size': 12, 'font-weight': 700}, ref.label));
  }
  for (const line of series) {
    if (!line.points.length) continue;
    const pts = line.points.map(([x, y]) => `${left + (x / xMax) * plotW},${top + plotH - (Math.min(y, yMax) / yMax) * plotH}`);
    chart.append(s('polyline', {points: pts.join(' '), fill: 'none', stroke: line.color, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-dasharray': line.dash || ''}));
  }
  let lx = width - right;
  for (const line of [...series].reverse()) {
    lx -= 26 + line.name.length * 7.4;
    chart.append(s('rect', {x: lx, y: 9, width: 16, height: 5, fill: line.color}));
    chart.append(s('text', {x: lx + 21, y: 16, fill: '#b9bdc6', 'font-size': 13}, line.name));
  }
  return chart;
}

function renderStep(index) {
  page.generation += 1;
  page.keyHandler = null;
  page.current = Math.max(0, Math.min(page.steps.length - 1, index));
  const step = page.steps[page.current];
  const layout = step.layout || page.layout;
  const article = document.getElementById('step');
  const floorWrap = h('div', {class: 'floor-wrap'});
  const controls = h('div', {class: 'controls'});
  const status = h('p', {class: 'status', 'aria-live': 'polite'});
  const stageCol = h('div', {class: 'stage-col'}, controls, status);
  const explain = h('aside', {class: 'explain', 'aria-label': 'Explanation'});
  const body = h('div', {class: `step-body fit-${layout}`}, h('div', {class: 'fit-stage'}, stageCol, floorWrap), explain);
  article.replaceChildren(
    h('div', {class: 'step-head'}, h('p', {class: 'step-kicker'}, `Step ${page.current + 1} of ${page.steps.length} \u00b7 ${step.stage}`),
      h('h2', {}, step.title), h('p', {class: 'lead'}, step.lead)),
    body);
  step.mount({floorWrap, controls, status, explain, stageCol, g: page.generation});
  live.fitLesson(body, floorWrap, {layout, ratio: page.ratio});
  renderChapters();
  document.getElementById('count').textContent = `${page.current + 1} / ${page.steps.length}`;
  document.getElementById('back').disabled = page.current === 0;
  document.getElementById('next').disabled = page.current === page.steps.length - 1;
  if (location.hash !== `#${step.id}`) history.replaceState(null, '', `#${step.id}`);
}

function showMode(mode) {
  const lab = mode === 'lab';
  document.getElementById('lesson').hidden = lab;
  document.getElementById('lab').hidden = !lab;
  document.getElementById('mode-lesson').setAttribute('aria-selected', String(!lab));
  document.getElementById('mode-lab').setAttribute('aria-selected', String(lab));
  document.body.classList.toggle('lab-mode', lab);
  if (lab) {
    page.generation += 1;
    page.keyHandler = null;
    page.mountLab(document.getElementById('lab'));
    history.replaceState(null, '', '#lab');
  } else renderStep(page.current);
}

function routeFromHash() {
  const hash = location.hash.slice(1);
  if (hash === 'lab') { showMode('lab'); return; }
  const index = page.steps.findIndex(step => step.id === hash);
  page.current = index >= 0 ? index : 0;
  showMode('lesson');
}

function showError(message) {
  const banner = document.getElementById('error-banner');
  banner.textContent = `Something went wrong (${message}). Reload the page before continuing; do not trust the current result.`;
  banner.hidden = false;
}

function startPage(steps, mountLab, {layout = 'top', ratio = 1} = {}) {
  page.steps = steps;
  page.mountLab = mountLab;
  page.layout = layout;
  page.ratio = ratio;
  document.getElementById('mode-lesson').addEventListener('click', () => showMode('lesson'));
  document.getElementById('mode-lab').addEventListener('click', () => showMode('lab'));
  document.getElementById('back').addEventListener('click', () => { renderStep(page.current - 1); window.scrollTo({top: 0}); });
  document.getElementById('next').addEventListener('click', () => { renderStep(page.current + 1); window.scrollTo({top: 0}); });
  document.getElementById('speed').addEventListener('change', event => { page.speed = event.target.value; });
  window.addEventListener('keydown', event => {
    const tag = (event.target.tagName || '').toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag)) return;
    if (page.keyHandler) page.keyHandler(event);
  });
  window.addEventListener('hashchange', routeFromHash);
  window.addEventListener('error', event => showError(event.message));
  window.addEventListener('unhandledrejection', event => showError(String(event.reason)));
  routeFromHash();
}

const dp = (() => {
// A ride-hail driver who learns where to wait (tabular Q-learning over NYC's five boroughs).
// Shared by the lesson page, the build checks, the deck and (as a Python port) the notebook.

const BLOCK_MINUTES = 15;
const SHIFT_BLOCKS = 32;
const DEFAULTS = {topChance: 0.8, costPerMile: 0.5, alpha: 0.05, gamma: 0.9, exploration: 0.2, bonus: [0, 0, 0, 0, 0]};

// Turn the real borough summary into the lesson's city. Two assumptions are named here:
// the chance of a request while waiting 15 minutes (scaled from real pickups per hour) and the cost of driving empty.
function buildCity(nyc, {topChance = DEFAULTS.topChance, costPerMile = DEFAULTS.costPerMile, bonus = DEFAULTS.bonus} = {}) {
  const top = Math.max(...nyc.pickupsPerHour);
  const n = nyc.boroughs.length;
  const requestChance = nyc.pickupsPerHour.map(v => Math.round((topChance * v / top) * 1000) / 1000);
  const destShare = nyc.odTrips.map(row => {
    const sum = row.reduce((a, b) => a + b, 0);
    return row.map(v => v / sum);
  });
  const blocks = nyc.odMinutes.map(row => row.map(m => Math.max(1, Math.round(m / BLOCK_MINUTES))));
  const driveCost = nyc.odMiles.map((row, a) => row.map((miles, b) => (a === b ? 0 : Math.round(miles * costPerMile * 100) / 100)));
  return {names: nyc.boroughs, n, requestChance, destShare, pay: nyc.odPay, blocks, driveCost, bonus: bonus.slice(), costPerMile, topChance};
}

function createTable(city) {
  return new Array(city.n * city.n).fill(null);
}

const scoreOf = (city, table, z, a) => (table[z * city.n + a] === null ? 0 : table[z * city.n + a]);

function bestAction(city, table, z) {
  let best = 0;
  for (let a = 1; a < city.n; a += 1) if (scoreOf(city, table, z, a) > scoreOf(city, table, z, best)) best = a;
  return best;
}

const bestScore = (city, table, z) => scoreOf(city, table, z, bestAction(city, table, z));

function pick(shares, u) {
  let acc = 0;
  for (let i = 0; i < shares.length; i += 1) {
    acc += shares[i];
    if (u < acc) return i;
  }
  return shares.length - 1;
}

// One decision. Action a === z means "wait here"; any other a means "drive empty to borough a".
// Waiting: one 15-minute block; if a request comes, the ride follows and pays the real average driver pay.
function act(city, z, a, random) {
  if (a === z) {
    if (random() < city.requestChance[z]) {
      const to = pick(city.destShare[z], random());
      const points = Math.round((city.pay[z][to] + city.bonus[z]) * 100) / 100;
      return {from: z, action: a, to, points, blocks: 1 + city.blocks[z][to], ride: true};
    }
    return {from: z, action: a, to: z, points: 0, blocks: 1, ride: false};
  }
  return {from: z, action: a, to: a, points: -city.driveCost[z][a], blocks: city.blocks[z][a], ride: false};
}

function choose(city, table, z, exploration, random) {
  if (random() < exploration) return {action: Math.floor(random() * city.n), explored: true};
  let best = -Infinity;
  let list = [];
  for (let a = 0; a < city.n; a += 1) {
    const v = scoreOf(city, table, z, a);
    if (v > best) { best = v; list = [a]; } else if (v === best) list.push(a);
  }
  return {action: list.length === 1 ? list[0] : list[Math.floor(random() * list.length)], explored: false};
}

// new score = old + alpha x (points now + gamma^blocks x best score where it ends up - old)
function learn(city, table, step, alpha, gamma) {
  const old = scoreOf(city, table, step.from, step.action);
  // Repeated multiplication (not Math.pow) so the Python notebook reproduces every digit.
  let discount = 1;
  for (let k = 0; k < step.blocks; k += 1) discount *= gamma;
  const target = step.points + discount * bestScore(city, table, step.to);
  const updated = old + alpha * (target - old);
  table[step.from * city.n + step.action] = updated;
  return {old, target, updated};
}

function createSession(city, {seed = 1, alpha = DEFAULTS.alpha, gamma = DEFAULTS.gamma, exploration = DEFAULTS.exploration} = {}) {
  return {city, seed, random: seededRandom(seed), alpha, gamma, exploration, table: createTable(city), shifts: []};
}

// One practice shift, one decision at a time: start in a random borough, decide, act, learn, until 8 hours are used.
function* shiftSteps(session) {
  const {city, random} = session;
  let z = Math.floor(random() * city.n);
  const start = z;
  let used = 0, earned = 0, rides = 0;
  const steps = [];
  while (used < SHIFT_BLOCKS) {
    const {action, explored} = choose(city, session.table, z, session.exploration, random);
    const step = act(city, z, action, random);
    const change = learn(city, session.table, step, session.alpha, session.gamma);
    const record = {...step, explored, ...change};
    steps.push(record);
    used += step.blocks;
    earned += step.points;
    if (step.ride) rides += 1;
    z = step.to;
    yield {...record, used, earned};
  }
  const summary = {start, earned: Math.round(earned * 100) / 100, rides, decisions: steps.length};
  session.shifts.push(summary);
  return {...summary, steps};
}

function trainShift(session, onStep = null) {
  const shift = shiftSteps(session);
  let next = shift.next();
  while (!next.done) {
    if (onStep) onStep(next.value);
    next = shift.next();
  }
  return next.value;
}

function train(session, shifts) {
  let last = null;
  for (let k = 0; k < shifts; k += 1) last = trainShift(session);
  return last;
}

/* Policies for testing: each maps a borough to an action. */
const policies = {
  stay: () => z => z,
  manhattan: () => () => 0,
  learned: (city, table) => z => bestAction(city, table, z),
};

// Test shifts: no random choices, no learning. Same seed = same requests for every policy compared.
function testShifts(city, policy, {shifts = 2000, seed = 2024} = {}) {
  const random = seededRandom(seed);
  const waitBlocks = new Array(city.n).fill(0);
  let earned = 0, rides = 0, emptyMiles = 0, bonusPaid = 0;
  for (let k = 0; k < shifts; k += 1) {
    let z = k % city.n;
    let used = 0;
    while (used < SHIFT_BLOCKS) {
      const a = policy(z);
      const step = act(city, z, a, random);
      if (a === z) waitBlocks[z] += 1;
      else emptyMiles += city.driveCost[z][a] / city.costPerMile;
      used += step.blocks;
      earned += step.points;
      if (step.ride) { rides += 1; bonusPaid += city.bonus[z]; }
      z = step.to;
    }
  }
  const totalWait = waitBlocks.reduce((a, b) => a + b, 0) || 1;
  return {
    perShift: Math.round((earned / shifts) * 100) / 100,
    bonusPerShift: Math.round((bonusPaid / shifts) * 100) / 100,
    ridesPerShift: Math.round((rides / shifts) * 10) / 10,
    emptyMilesPerShift: Math.round((emptyMiles / shifts) * 10) / 10,
    waitShare: waitBlocks.map(b => Math.round((b / totalWait) * 1000) / 1000),
  };
}

return {BLOCK_MINUTES, SHIFT_BLOCKS, DEFAULTS, buildCity, createTable, scoreOf, bestAction, bestScore, act, choose, learn, createSession, shiftSteps, trainShift, train, policies, testShifts};

// Settings and every number the dispatch lesson, the notebook check and the deck quote.

const DISPATCH_LESSON = {
  seed: 4,
  trainShifts: 1000,
  checkEvery: 50,
  stepDecisions: 10,
  playStart: 3,
  playSeed: 12,
  gammas: [0, 0.5, 0.9],
  bonusBorough: 3,
  bonus: 25,
};

const ruleOf = (city, table) => city.names.map((_, z) => dp.bestAction(city, table, z));

function ruleText(city, rule) {
  return rule.map((a, z) => (a === z ? `${city.names[z]}: wait` : `${city.names[z]}: drive to ${city.names[a]}`));
}

function dispatchSession(city, options = {}) {
  return dp.createSession(city, {seed: DISPATCH_LESSON.seed, ...options});
}

// Every one of the 5^5 = 3,125 possible where-to-wait rules, tested on the same requests.
function bestRule(city) {
  let best = null;
  for (let code = 0; code < city.n ** city.n; code += 1) {
    const rule = city.names.map((_, i) => Math.floor(code / city.n ** i) % city.n);
    const result = dp.testShifts(city, z => rule[z]);
    if (!best || result.perShift > best.result.perShift) best = {rule, result};
  }
  return best;
}

function computeDispatchFacts(nyc) {
  const L = DISPATCH_LESSON;
  const city = dp.buildCity(nyc);
  const facts = {lesson: L, defaults: dp.DEFAULTS, blockMinutes: dp.BLOCK_MINUTES, shiftBlocks: dp.SHIFT_BLOCKS,
    data: {rows: nyc.rows, pickupsPerHour: nyc.pickupsPerHour, pickupShare: nyc.pickupShare, uberWait: nyc.uberWait,
      source: nyc.source.dataset},
    city: {names: city.names, requestChance: city.requestChance, blocks: city.blocks, driveCost: city.driveCost,
      pay: city.pay, destShare: city.destShare.map(r => r.map(v => Math.round(v * 1000) / 1000))}};

  const session = dispatchSession(city);
  const first = dp.trainShift(session);
  facts.firstDecisions = first.steps.slice(0, L.stepDecisions).map(st => ({from: city.names[st.from],
    action: st.action === st.from ? 'wait' : `drive to ${city.names[st.action]}`, to: city.names[st.to], ride: st.ride,
    explored: st.explored, points: st.points, blocks: st.blocks, old: Math.round(st.old * 100) / 100,
    target: Math.round(st.target * 100) / 100, updated: Math.round(st.updated * 100) / 100}));

  const curve = [];
  for (let k = 2; k <= L.trainShifts; k += 1) {
    dp.trainShift(session);
    if (k % L.checkEvery === 0) curve.push({shifts: k, test: dp.testShifts(city, dp.policies.learned(city, session.table)).perShift});
  }
  facts.curve = curve;
  const rule = ruleOf(city, session.table);
  facts.rule = rule;
  facts.ruleText = ruleText(city, rule);
  facts.table = session.table.map(v => (v === null ? null : Math.round(v * 100) / 100));
  const earnings = session.shifts.map(sh => sh.earned);
  const mean = list => Math.round((list.reduce((a, b) => a + b, 0) / list.length) * 100) / 100;
  facts.practice = {first100: mean(earnings.slice(0, 100)), last100: mean(earnings.slice(-100))};

  const best = bestRule(city);
  facts.test = {
    stay: dp.testShifts(city, dp.policies.stay()),
    manhattan: dp.testShifts(city, dp.policies.manhattan()),
    learned: dp.testShifts(city, dp.policies.learned(city, session.table)),
    best: {rule: best.rule, ruleText: ruleText(city, best.rule), ...best.result},
  };

  facts.gamma = L.gammas.map(gamma => {
    const s = dispatchSession(city, {gamma});
    dp.train(s, L.trainShifts);
    const r = ruleOf(city, s.table);
    return {gamma, rule: r, ruleText: ruleText(city, r), ...dp.testShifts(city, z => r[z])};
  });

  const bonus = new Array(city.n).fill(0);
  bonus[L.bonusBorough] = L.bonus;
  const bonusCity = dp.buildCity(nyc, {bonus});
  const b = dispatchSession(bonusCity);
  dp.train(b, L.trainShifts);
  const bRule = ruleOf(bonusCity, b.table);
  facts.bonus = {borough: city.names[L.bonusBorough], amount: L.bonus, rule: bRule, ruleText: ruleText(bonusCity, bRule),
    ...dp.testShifts(bonusCity, z => bRule[z])};
  return facts;
}

// Real New York City map for the ride-hail lesson: the 262 NYC TLC taxi zones (simplified), plain SVG, no map tiles.
// NYC_MAP ({width, height, anchors, zones:[{id, name, b, d, c, w}]}) is injected by build.mjs from artifacts/nyc_map.json.
// The map only draws. It never touches the learner's random numbers, so every lesson number stays the same.

const HUES = ['#7eaeb8', '#8fbf8f', '#d9b27a', '#c98fb0', '#9a9fd6'];
const MAP_NAMES = ['Manhattan', 'Brooklyn', 'Queens', 'Bronx', 'Staten Is.'];
// Where each borough's name sits (x, y, text-anchor), chosen to stay clear of the arrows.
const LABEL_AT = [[452, 300, 'end'], [470, 690, 'end'], [880, 395, 'middle'], [835, 92, 'middle'], [150, 628, 'middle']];
const ORANGE = '#e8913c', TEAL = '#a8d4dd', RULE_GREEN = '#7cc59a';
const MAX_W = Math.max(...NYC_MAP.zones.map(z => z.w));
const BY_BOROUGH = [0, 1, 2, 3, 4].map(b => NYC_MAP.zones.filter(z => z.b === b && z.w > 0));

function pickZone(b, random) {
  const list = BY_BOROUGH[b];
  let u = random() * list.reduce((sum, z) => sum + z.w, 0);
  for (const z of list) { u -= z.w; if (u < 0) return z; }
  return list[list.length - 1];
}

function pickIndex(weights, random) {
  let u = random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < weights.length; i += 1) { u -= weights[i]; if (u < 0) return i; }
  return weights.length - 1;
}

const bend = (p0, p1, k = 0.18) => [(p0[0] + p1[0]) / 2 - (p1[1] - p0[1]) * k, (p0[1] + p1[1]) / 2 + (p1[0] - p0[0]) * k];
const bez = (p0, c, p1, t) => [0, 1].map(i => (1 - t) * (1 - t) * p0[i] + 2 * (1 - t) * t * c[i] + t * t * p1[i]);
const heading = (p0, c, p1, t) => {
  const dx = 2 * (1 - t) * (c[0] - p0[0]) + 2 * t * (p1[0] - c[0]);
  const dy = 2 * (1 - t) * (c[1] - p0[1]) + 2 * t * (p1[1] - c[1]);
  return dx === 0 && dy === 0 ? null : (Math.atan2(dy, dx) * 180) / Math.PI;
};
const frame = () => new Promise(resolve => requestAnimationFrame(resolve));

function carIcon(scale = 1) {
  const g = s('g', {class: 'nyc-car'});
  const roof = s('rect', {x: -5 * scale, y: -8 * scale, width: 13 * scale, height: 16 * scale, rx: 3 * scale, fill: '#2f7d8a'});
  g.append(s('rect', {x: -19 * scale, y: -11 * scale, width: 38 * scale, height: 22 * scale, rx: 6 * scale, fill: '#f5f3f0', stroke: '#0b0f14', 'stroke-width': 3 * scale}), roof,
    s('rect', {x: 13 * scale, y: -8 * scale, width: 4 * scale, height: 5 * scale, rx: 1, fill: '#ffe9a8'}),
    s('rect', {x: 13 * scale, y: 3 * scale, width: 4 * scale, height: 5 * scale, rx: 1, fill: '#ffe9a8'}));
  return {g, roof};
}

class NycMap {
  constructor(label = 'Map of New York City by taxi zone', {car = true, chance = null} = {}) {
    const {width, height, anchors} = NYC_MAP;
    this.anchors = anchors;
    this.token = 0;
    this.random = seededRandom(97);
    this.el = s('svg', {viewBox: `0 0 ${width} ${height}`, class: 'citymap nycmap', role: 'img', 'aria-label': label});
    const defs = s('defs');
    for (const [id, color] of [['ride', ORANGE], ['empty', TEAL], ['rule', ORANGE]]) {
      const m = s('marker', {id: `nyc-${id}`, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 4.5, markerHeight: 4.5, orient: 'auto-start-reverse'});
      m.append(s('path', {d: 'M0,0 L10,5 L0,10 z', fill: color}));
      defs.append(m);
    }
    this.el.append(defs, s('rect', {x: 0, y: 0, width, height, rx: 22, fill: '#0e1822'}));
    const land = s('g', {class: 'zones'});
    for (const z of NYC_MAP.zones) {
      const path = s('path', {d: z.d, fill: HUES[z.b], 'fill-opacity': (0.18 + 0.72 * Math.sqrt(z.w / MAX_W)).toFixed(2), stroke: '#0e1822', 'stroke-width': 1.4, class: 'zone'});
      path.append(s('title', {}, `${z.name} (${MAP_NAMES[z.b]}): about ${Math.round(z.w)} pickups an hour`));

    this.reqLayer = s('g');
    this.fleetLayer = s('g');
    const labels = s('g', {class: 'borough-labels'});
    this.chanceText = MAP_NAMES.map((name, b) => {
      const [x, y, anchor] = LABEL_AT[b];
      const w = 172, left = anchor === 'end' ? x - w + 10 : x - w / 2;
      labels.append(s('rect', {x: left, y: y - 34, width: w, height: 62, rx: 12, fill: '#0b1017', opacity: 0.82}),
        s('text', {x: anchor === 'end' ? x - 4 : x, y: y - 6, 'text-anchor': anchor, fill: '#f5f3f0', 'font-size': 26, 'font-weight': 700}, name));
      const t = s('text', {x: anchor === 'end' ? x - 4 : x, y: y + 18, 'text-anchor': anchor, fill: HUES[b], 'font-size': 19}, '');

    this.setCar(this.pos, 0);

  setChance(chance) {

  setCar(pos, angle = this.angle) {

  // Moves the car along a gentle curve. Resolves early (at the end point) if a newer animation starts.
  async drive(p0, p1, ms, token, c = bend(p0, p1)) {

    const start = performance.now();
    while (!REDUCED && ms > 0) {

  request(pos) {

  showRule(rule) {

    this.car.style.display = 'none';
    this.drawRule(rule);
  }

  drawRule(rule) {
    rule.forEach((a, z) => {
      if (a === null || a === undefined) return;

  }

  /* A picture of a rule, not a measurement: many cars all follow the same rule while riders request

  async fleet(rule, city, {cars = 30, blocks = 32, blockMs = 650, perBlock = 9, seed = 11, onTick = null} = {}) {
    this.clear();
    const token = this.token;
    this.car.style.display = 'none';
    this.drawRule(rule);
    // Two random streams: riders get their own, so every rule faces exactly the same requests.
    const random = seededRandom(seed);
    const riders = seededRandom(seed + 1000);
    const n = city.n;
    const shares = city.requestChance;
    const jitter = (p, r = random) => [p[0] + (r() - 0.5) * 26, p[1] + (r() - 0.5) * 26];
    const fleet = Array.from({length: cars}, (_, i) => {
      const b = i % n;
      const pos = jitter(pickZone(b, random).c);
      const icon = carIcon(0.72);
      this.fleetLayer.append(icon.g);
      return {b, icon, legs: [{p0: pos, c: pos, p1: pos, t0: 0, t1: 0, ride: false}], free: 0, angle: 0};

          r.dot.lastChild.setAttribute('fill', '#ff5d5d');

          car.b = a;
          continue;
        }

    const start = performance.now();
    let decided = -1;
    for (;;) {
      await frame();
      if (token !== this.token) return null;
      const now = REDUCED ? blocks : (performance.now() - start) / blockMs;
      while (decided + 1 <= Math.min(Math.floor(now), blocks - 1)) { decided += 1; decide(decided); }
      for (const car of fleet) {
        const leg = car.legs.find(l => now < l.t1) || car.legs[car.legs.length - 1];
        const t = leg.t1 > leg.t0 ? Math.max(0, Math.min(1, (now - leg.t0) / (leg.t1 - leg.t0))) : 1;
        const p = bez(leg.p0, leg.c, leg.p1, t);
        const angle = heading(leg.p0, leg.c, leg.p1, t);
        if (angle !== null && t < 1) car.angle = angle;
        car.icon.g.setAttribute('transform', `translate(${p[0].toFixed(1)} ${p[1].toFixed(1)}) rotate(${car.angle.toFixed(1)})`);
        car.icon.roof.setAttribute('fill', leg.ride && t < 1 ? ORANGE : '#2f7d8a');
      }
      if (now >= blocks) break;
    }
    // Requests still open when the shift ends were not taken either.
    for (const r of open) stats.missed[r.b] += 1;
    if (onTick) onTick({block: blocks - 1, blocks, stats});
    return stats;
  }
}

const live = (() => {
// Shared controls for the three "watch it learn" labs: play/pause loop, speed switch and a gear-button settings pop-up.
// Self-contained (no imports) so every lesson page can include it.

const make = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child.nodeType ? child : String(child));
  return node;
};

const SPEEDS = {watch: 'Watch', fast: 'Fast'};
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const frame = () => new Promise(resolve => requestAnimationFrame(() => resolve()));
const pause = ms => new Promise(resolve => setTimeout(resolve, REDUCED ? 0 : ms));

function gearIcon() {
  const ns = 'http://www.w3.org/2000/svg';

    const tooth = document.createElementNS(ns, 'rect');
    Object.entries({x: 10, y: 1.5, width: 4, height: 5, rx: 1, fill: 'currentColor', transform: `rotate(${k * 45} 12 12)`}).forEach(([a, v]) => tooth.setAttribute(a, v));
    svg.append(tooth);
  }
  const ring = document.createElementNS(ns, 'circle');
  Object.entries({cx: 12, cy: 12, r: 6.2, fill: 'none', stroke: 'currentColor', 'stroke-width': 3.6}).forEach(([a, v]) => ring.setAttribute(a, v));
  svg.append(ring);

}

// A pop-up panel on a native <dialog>: Esc closes it, focus is managed by the browser.
function popup(title, content, closeLabel) {
  const close = make('button', {type: 'button', class: 'pop-close', 'aria-label': closeLabel}, '\u00d7');

    make('div', {class: 'pop-inner'}, make('div', {class: 'pop-head'}, make('h3', {}, title), close), ...content));
  close.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
  return dialog;
}

function settingsPopup(title, ...content) {

}

function speedSwitch(value, onChange) {

// Sizes a lab to exactly fill the window below its top edge, so scene, controls and panels fit on one screen.
// Narrow screens keep the normal stacked page.
let refit = null;
function fillWindow(el, {minHeight = 620, bottom = 28, narrow = 900} = {}) {
  const fit = () => {
    if (!el.isConnected) return;
    if (window.innerWidth <= narrow) { el.style.height = ''; return; }
    const top = el.getBoundingClientRect().top + window.scrollY;
    el.style.height = `${Math.max(minHeight, Math.floor(window.innerHeight - top - bottom))}px`;
  };
  if (refit) window.removeEventListener('resize', refit);
  refit = fit;
  window.addEventListener('resize', fit);
  fit();
  requestAnimationFrame(fit);
}

// Keeps a stage as wide as its scene needs at the row's full height, leaving at least `reserve` px for the side columns.
let stageObserver = null;
function sizeStage(stage, row, {ratio = 1, reserve = 560, inset = 0, narrow = 900} = {}) {
  const fit = () => {
    if (window.innerWidth <= narrow) { stage.style.width = ''; return; }
    stage.style.width = `${Math.floor(Math.max(300, Math.min((row.clientHeight - inset) * ratio, row.clientWidth - reserve)))}px`;
  };
  if (stageObserver) stageObserver.disconnect();
  stageObserver = new ResizeObserver(fit);
  stageObserver.observe(row);
  fit();
}

// Guided-lesson steps: fill the window above the Back/Next bar; square scenes (layout 'side') get a height-sized stage.
function fitLesson(body, floorWrap, {layout = 'top', ratio = 1} = {}) {
  const footer = document.querySelector('.stepnav');
  fillWindow(body, {minHeight: 380, bottom: (footer ? footer.offsetHeight : 50) + 40});
  if (layout === 'side') sizeStage(floorWrap, body, {ratio, reserve: 730, inset: 24});
}

// Runs `unit` again and again while playing. Each unit must await a frame or a timer so the page stays responsive,
// and should change the model before its last await, so a pause never leaves half a step behind.
function player({unit, alive, onChange = () => {}}) {
  let playing = false, token = 0;
  const button = make('button', {type: 'button', class: 'btn primary play-btn'});
  const draw = () => { button.textContent = playing ? '\u275a\u275a Pause' : '\u25b6 Play'; button.setAttribute('aria-pressed', String(playing)); };
  const loop = async mine => {
    while (playing && mine === token && alive()) await unit();
    if (playing && mine === token) { playing = false; draw(); onChange(false); }
  };
  const api = {
    button,
    get playing() { return playing; },
    play() { if (playing) return; playing = true; draw(); onChange(true); loop(++token); },
    stop() { if (!playing) return; playing = false; token += 1; draw(); onChange(false); },
  };
  button.addEventListener('click', () => (playing ? api.stop() : api.play()));
  draw();
  return api;
}

return {SPEEDS, REDUCED, frame, pause, settingsPopup, helpPopup, speedSwitch, fillWindow, sizeStage, fitLesson, player};
})();

function describeDecision(step, index, {title = null, exploration = 0.2, alpha = 0.05, gamma = 0.9} = {}) {
  const what = step.action === step.from
    ? (step.ride ? `Waited in ${city.names[step.from]} and got a request: a ride to ${city.names[step.to]}.` : `Waited in ${city.names[step.from]}: no request this time.`)
    : `Drove empty from ${city.names[step.from]} to ${city.names[step.to]}.`;
  const discount = Math.pow(gamma, step.blocks);
  const bestNext = discount > 0 ? (step.target - step.points) / discount : 0;
  const tries = exploration === 0.2 ? '1 in 5' : `${Math.round(exploration * 100)}% of choices`;
  const shrink = Math.round(discount * 100) / 100;
  return card(title || `Decision ${index}`,
    h('dl', {class: 'moveline'},
      h('dt', {}, 'Where'), h('dd', {}, city.names[step.from]),
      h('dt', {}, 'Chose'), h('dd', {}, `${actionName(step.from, step.action)}${step.explored ? ` (a random try: ${tries})` : ' (the highest score; blank counts as 0)'}`),
      h('dt', {}, 'What happened'), h('dd', {}, what),
      h('dt', {}, 'Money'), h('dd', {}, money(step.points)),
      h('dt', {}, 'Time used'), h('dd', {}, `${step.blocks * 15} minutes`)),
    h('p', {class: 'calc'}, `New score = ${round1(step.old)} + ${alpha} \u00d7 (${round1(step.points)} + ${shrink} \u00d7 ${round1(bestNext)} \u2212 ${round1(step.old)}) `,
      h('span', {class: 'eq'}, `= ${Math.round(step.updated * 100) / 100}`)),
    h('p', {class: 'small muted'}, `\u00d7 ${shrink}: this took ${step.blocks * 15} minutes, and later money counts ${gamma} for every 15 minutes`
      + (step.blocks > 1 ? ` (${Array(step.blocks).fill(gamma).join(' \u00d7 ')} = ${shrink}).` : '.')));
}

function pairChart(title, labels, a, b, names) {
  const width = 560, height = 230, left = 44, top = 34, plotH = 150, plotW = width - left - 14;
  const max = Math.max(...a, ...b, 0.01);
  const yMax = Math.ceil(max * 10) / 10;
  const svg = s('svg', {viewBox: `0 0 ${width} ${height}`, class: 'chart', role: 'img', 'aria-label': title});
  const slot = plotW / labels.length;
  for (const f of [0, 0.5, 1]) {
    const y = top + plotH - f * plotH;
    svg.append(s('line', {x1: left, y1: y, x2: left + plotW, y2: y, stroke: '#2e323d'}));
    svg.append(s('text', {x: left - 6, y: y + 4, 'text-anchor': 'end', fill: '#858a97', 'font-size': 12}, pct(f * yMax)));
  }
  labels.forEach((label, i) => {
    [[a[i], '#b9bdc6', 0.12], [b[i], '#7eaeb8', 0.5]].forEach(([v, color, offset]) => {
      const bh = Math.max(1.5, (v / yMax) * plotH);
      svg.append(s('rect', {x: left + i * slot + slot * offset, y: top + plotH - bh, width: slot * 0.36, height: bh, rx: 2, fill: color}));
      svg.append(s('text', {x: left + i * slot + slot * (offset + 0.18), y: top + plotH - bh - 5, 'text-anchor': 'middle', fill: '#f5f3f0', 'font-size': 12}, pct(v)));
    });
    svg.append(s('text', {x: left + i * slot + slot / 2, y: top + plotH + 18, 'text-anchor': 'middle', fill: '#b9bdc6', 'font-size': 12}, label));
  });
  svg.append(s('rect', {x: left, y: 8, width: 14, height: 8, fill: '#b9bdc6'}));
  svg.append(s('text', {x: left + 20, y: 16, fill: '#b9bdc6', 'font-size': 13}, names[0]));
  svg.append(s('rect', {x: left + 230, y: 8, width: 14, height: 8, fill: '#7eaeb8'}));
  svg.append(s('text', {x: left + 250, y: 16, fill: '#b9bdc6', 'font-size': 13}, names[1]));
  return svg;
}

function mountDecisions(ctx) {
  const session = dispatchSession(city);
  const map = cityMap('Map during the first practice shift');
  ctx.floorWrap.append(map.el);
  ctx.stageCol.insertBefore(mapLegend(), ctx.controls);
  const first = dp.trainShift(dispatchSession(city));
  const decisions = first.steps.slice(0, L.stepDecisions);
  map.place(decisions[0].from);
  const tableSlot = h('div');
  const decisionSlot = h('div');
  tableSlot.append(qTable(session.table), tableNote());
  let index = 0, busy = false;
  // Replay the recorded first shift on a fresh table so the page matches the facts exactly.
  const table = session.table;
  const one = button('One decision', () => step(), {primary: true});
  const run = button(`Run to decision ${L.stepDecisions}`, async () => { while (index < L.stepDecisions && await step()); });
  ctx.controls.append(one, run, button('Start over', () => renderStep(2)));
  async function step() {
    if (busy || index >= decisions.length) return false;
    busy = true;
    const g = ctx.g;
    const st = decisions[index];
    table[st.from * city.n + st.action] = st.updated;
    index += 1;
    map.showStep(st, {ms: timing().move * 2});
    tableSlot.replaceChildren(qTable(table, [st.from, st.action]), tableNote());
    decisionSlot.replaceChildren(describeDecision(st, index));
    ctx.status.innerHTML = `Decision ${index}: ${actionName(st.from, st.action)} in ${city.names[st.from]}. ${money(st.points)}. New score <strong>${Math.round(st.updated * 100) / 100}</strong>.`;
    await wait(timing().move * 2.6);
    busy = false;
    if (g !== page.generation) return false;
    if (index >= decisions.length) { one.disabled = true; run.disabled = true; }
    return index < decisions.length;
  }
  const formula = () => h('div', {class: 'formula'}, h('span', {class: 'term t-new'}, 'new score'), '= old + 0.05 \u00d7 (', h('span', {class: 'term t-now'}, 'money now'), '+',
    h('span', {class: 'term t-next'}, '0.9 per 15 min \u00d7 best score where it ends up'), '\u2212 old)');
  const help = updateRuleHelp(formula());
  const shown = formula();
  shown.append(help.button);
  ctx.explain.append(
    card('The update rule', shown,
      h('p', {class: 'small muted', style: 'margin-top:8px'}, 'Why \u00d7 0.9: $1 that comes 15 minutes later counts as 90 cents now. A 45-minute trip shrinks it three times: 0.9 \u00d7 0.9 \u00d7 0.9 = 0.73, so $1 counts as 73 cents. Requests are random, so each result only moves the score 5% of the way.'),
      terms([
        ['Money now', 'what this one choice paid: the ride\u2019s pay, $0 if no request came, or minus the cost of driving empty.'],
        ['Best score where it ends up', 'the highest score in the borough the car is in afterwards: what it expects to earn from there on.'],
        ['Old', 'the score before this update. The bracket is the surprise: how much better or worse it went than expected.']]),
      help.dialog),
    decisionSlot, card('Score table', tableSlot));
  decisionSlot.append(card('Before the first decision', h('p', {}, `The shift starts in ${city.names[decisions[0].from]}. All 25 scores are blank. Press One decision.`)));
  ctx.status.textContent = 'Practice shift 1, decision 0.';
}

function mountShifts(ctx) {

      title: 'Average earnings per test shift, after each 50 practice shifts', yLabel: 'Dollars per shift', xLabel: 'Practice shifts',
      refs: [{value: t.stay.perShift, label: 'never move', color: '#b9bdc6'}, {value: t.manhattan.perShift, label: 'to Manhattan', color: '#e8913c'}]}));

function mountLookAhead(ctx) {
  const map = cityMap('Rule learned with the chosen look-ahead', {car: false});
  ctx.floorWrap.append(map.el);
  ctx.stageCol.insertBefore(mapLegend(), ctx.controls);
  const rows = h('tbody');
  const note = h('div');
  const done = new Set();
  const options = [
    {gamma: 0, label: 'Looks 0 blocks ahead (0)'},
    {gamma: 0.5, label: 'Looks a little ahead (0.5)'},
    {gamma: 0.9, label: 'Looks far ahead (0.9)'},
  ];
  let busy = false;
  async function run(o) {
    if (busy) return;
    busy = true;
    const g = ctx.g;
    const session = dispatchSession(city, {gamma: o.gamma});
    for (let k = 0; k < L.trainShifts; k += 100) {
      dp.train(session, 100);
      map.showRule(ruleOf(city, session.table));
      await wait(timing().batch * 2);
      if (g !== page.generation) return;
    }
    const rule = ruleOf(city, session.table);
    const test = dp.testShifts(city, z => rule[z]);
    if (!done.has(o.gamma)) {
      done.add(o.gamma);
      const moves = rule.filter((a, z) => a !== z).length;
      rows.append(h('tr', {class: o.gamma === 0.9 ? 'new' : ''}, h('td', {}, String(o.gamma)), h('td', {class: 'num'}, money(test.perShift)),
        h('td', {}, moves ? rule.map((a, z) => (a !== z ? `${SHORT[z]} \u2192 ${SHORT[a]}` : null)).filter(Boolean).join(', ') : 'never drives empty')));
    }
    ctx.status.innerHTML = `Trained with look-ahead ${o.gamma}: <strong>${money(test.perShift)}</strong> per test shift.`;
    if (done.size === options.length) {
      note.replaceChildren(accent('Delayed reward',
        h('p', {}, 'Driving empty always costs money now. Only a driver that values future rides ever does it. That is the heart of reinforcement learning: an action can be worth it because of what it leads to, not what it pays today.')));
    }
    busy = false;
  }
  options.forEach((o, i) => ctx.controls.append(button(o.label, () => run(o), {primary: i === 0})));
  ctx.explain.append(
    card('Three drivers, one difference',
      h('table', {class: 'data'}, h('thead', {}, h('tr', {}, h('th', {}, 'Look-ahead'), h('th', {class: 'num'}, 'Per shift'), h('th', {}, 'Empty drives in its rule'))), rows)),
    note,
    card('What the number means',
      h('p', {}, '0.9 means $1 that arrives 15 minutes from now is worth 90 cents now; an hour from now, about 66 cents. With 0, only the next 15 minutes matter.'),
      h('p', {class: 'small muted'}, 'A job that ends after every trip, like a robot reaching its packing station, needs little look-ahead. A driver\u2019s day has no finish line after each choice.')));
  ctx.status.textContent = 'Press each button. Each trains a fresh driver for 1,000 shifts.';
}

function mountLab(root) {
  const settings = {gamma: 0.9, exploration: 0.2, bonusBX: 0, bonusSI: 0, costPerMile: 0.5, topChance: 0.8, seed: L.seed};
  // Car animation time per decision and pause after it, per speed.
  const PACE = {watch: {ms: 1100, rest: 250}, fast: {ms: 60, rest: 5}};
  const g = page.generation;
  let labCity, session, shift, speed = 'watch', latest = null, decision = 0, where = null, drawnAt = 0, busy = false;
  const status = h('p', {class: 'status', 'aria-live': 'off'});
  const stats = h('div', {class: 'stats'});
  const nowSlot = h('div', {class: 'wide'});
  const chartSlot = h('div');
  const log = h('ol', {class: 'live-log', 'aria-label': 'Finished practice shifts'});
  const ruleSlot = h('div');
  const testSlot = h('div');
  const testCard = card('Test result', testSlot);
  const map = cityMap('Lab: the driver practising on the real New York map');
  const shiftNo = () => session.shifts.length + 1;

  function fresh() {
    labCity = dp.buildCity(NYC, {bonus: [0, 0, 0, settings.bonusBX, settings.bonusSI], costPerMile: settings.costPerMile, topChance: settings.topChance});
    session = dp.createSession(labCity, {seed: settings.seed, gamma: settings.gamma, exploration: settings.exploration});
    shift = dp.shiftSteps(session);
    latest = null; decision = 0; where = null;
    map.setChance(labCity.requestChance);
    map.clear();
    log.replaceChildren();
    nowSlot.replaceChildren(card('What just happened', h('p', {class: 'small muted'},
      'Each decision the driver waits 15 minutes or drives empty to another borough, earns (or pays) money, and nudges the score of what it chose toward: money now + 0.9 per 15 minutes \u00d7 the best score where it ends up.')));
    testSlot.replaceChildren(h('p', {class: 'small muted'}, 'Press Test any time. It copies the rule as it is now and runs 2,000 fixed test shifts, next to never moving and always heading to Manhattan (no random tries, no learning).'));
    drawShifts();
    drawLive(true);
  }

  function drawShifts() {
    const done = session.shifts;
    chartSlot.replaceChildren(done.length ? barChart({values: done.slice(-40).map(x => Math.max(0, Math.round(x.earned))), title: 'Earnings in each practice shift ($)',
      firstIndex: Math.max(1, done.length - 39), yLabel: 'Dollars', xLabel: 'Practice shift', width: 400, height: 220})
      : h('p', {class: 'small muted'}, 'A bar appears when each 8-hour practice shift ends (a few seconds at Fast).'));
  }

  // The live panels. At Fast they are redrawn a few times a second, not after every decision.
  function drawLive(force = false) {
    if (!force && speed !== 'watch' && performance.now() - drawnAt < 350) return;
    drawnAt = performance.now();
    const done = session.shifts;
    const recent = done.slice(-50).map(x => x.earned);
    stats.replaceChildren(
      h('div', {class: 'stat'}, h('b', {}, `Shift ${shiftNo()}`), h('span', {}, `practising, ${latest ? hoursText(Math.min(latest.st.used, dp.SHIFT_BLOCKS)) : '0h 00m'} of 8h`)),
      h('div', {class: 'stat'}, h('b', {}, latest ? money(latest.st.earned) : '$0.00'), h('span', {}, 'earned this shift')),
      h('div', {class: 'stat'}, h('b', {}, done.length ? money(done.at(-1).earned) : '\u2014'), h('span', {}, 'last finished shift')),
      h('div', {class: 'stat'}, h('b', {}, recent.length ? money(recent.reduce((a, c) => a + c, 0) / recent.length) : '\u2014'), h('span', {}, `average, last ${recent.length || 50} shifts`)),
      h('div', {class: 'stat'}, h('b', {}, pct(settings.exploration)), h('span', {}, 'random tries')));
    if (latest) {
      nowSlot.replaceChildren(describeDecision(latest.st, latest.index, {title: `What just happened \u00b7 shift ${latest.shiftNo}, decision ${latest.index}`,
        exploration: settings.exploration, alpha: session.alpha, gamma: settings.gamma}));
    }
    const rule = ruleOf(labCity, session.table);
    ruleSlot.replaceChildren(
      h('ul', {class: 'rule-list'}, ...rule.map((a, z) => h('li', {}, h('strong', {}, `${SHORT[z]}: `),
        session.table.slice(z * city.n, z * city.n + city.n).every(v => v === null) ? 'not tried yet' : a === z ? 'wait here' : `drive empty to ${SHORT[a]}`))),
      qTable(session.table, latest ? [latest.st.from, latest.st.action] : null), tableNote());
  }

  function shiftDone() {
    const last = session.shifts.at(-1);
    log.prepend(h('li', {}, `Shift ${session.shifts.length}: ${money(last.earned)}, ${last.rides} rides, started in ${SHORT[last.start]}`));
    while (log.children.length > 40) log.lastChild.remove();
    shift = dp.shiftSteps(session);
    decision = 0;
    drawShifts();
  }

  async function unit() {
    const pace = PACE[speed];
    const next = shift.next();
    if (next.done) {
      shiftDone();
      const last = session.shifts.at(-1);
      status.textContent = `Shift ${session.shifts.length} over: ${money(last.earned)} from ${last.rides} rides. A new shift starts in a random borough.`;
      drawLive(true);
      await wait(pace.rest * 4);
      return;
    }
    const st = next.value;
    decision += 1;
    latest = {st, index: decision, shiftNo: shiftNo()};
    if (where !== st.from) map.place(st.from);
    where = st.to;
    status.textContent = `Shift ${latest.shiftNo}, ${hoursText(Math.min(st.used, dp.SHIFT_BLOCKS))}: ${actionName(st.from, st.action)} in ${SHORT[st.from]}${st.explored ? ' (random try)' : ''} \u2192 ${st.ride ? `ride to ${SHORT[st.to]}` : st.action === st.from ? 'no request' : `now in ${SHORT[st.to]}`}, ${money(st.points)}.`;
    drawLive();
    await map.showStep(st, {ms: pace.ms});
    await wait(pace.rest);
  }

  const player = live.player({unit, alive: () => g === page.generation});

  function test() {
    const learned = dp.testShifts(labCity, dp.policies.learned(labCity, session.table));
    const stay = dp.testShifts(labCity, dp.policies.stay());
    const man = dp.testShifts(labCity, dp.policies.manhattan());
    testSlot.replaceChildren(dataTable(['Rule', 'Per shift', 'Bonus in it', 'Bronx wait share'], [
      {cells: ['Never move', money(stay.perShift), money(stay.bonusPerShift), pct(stay.waitShare[3])]},
      {cells: ['Always to Manhattan', money(man.perShift), money(man.bonusPerShift), pct(man.waitShare[3])]},
      {cells: [`Your rule after ${session.shifts.length.toLocaleString('en-US')} shifts`, money(learned.perShift), money(learned.bonusPerShift), pct(learned.waitShare[3])], className: 'new'},
    ], {numeric: [1, 2, 3]}),
    h('p', {class: 'small muted', style: 'margin-top:8px'}, 'Practice keeps going. Test again later to see whether more practice helps.'));
    status.textContent = `Tested on 2,000 fixed test shifts after ${session.shifts.length} practice shifts.`;
    testCard.scrollIntoView({block: 'nearest', behavior: live.REDUCED ? 'auto' : 'smooth'});
  }

  async function watchFleet() {
    if (busy) return;
    if (!session.shifts.length) { status.textContent = 'Let it practise at least one shift first: a blank table has no rule to follow.'; return; }
    busy = true;
    player.stop();
    await wait(PACE.watch.ms);
    const rule = ruleOf(labCity, session.table);
    where = null;
    status.textContent = 'Practice paused: 30 cars follow your rule for one shift. Press Play to continue practice.';
    const result = await map.fleet(rule, labCity, {blockMs: fleetMs(), onTick: info => nowSlot.replaceChildren(fleetCard(info.stats, 'lab rule', info.block + 1))});
    busy = false;
    if (g !== page.generation) return;
    if (result) status.textContent = 'The 30-car shift is over. Press Play to continue practice.';
  }

  const changed = () => { fresh(); status.textContent = 'Setting changed: the driver starts again from a blank table.'; };
  const range = (label, min, max, step, key, format) => {
    const out = h('span', {class: 'value-out'}, format(settings[key]));
    const input = h('input', {type: 'range', min, max, step, value: settings[key], 'aria-label': label,
      oninput: e => { out.textContent = format(Number(e.target.value)); },
      onchange: e => { settings[key] = Number(e.target.value); changed(); }});
    return [h('label', {}, label), h('div', {}, input, out)];
  };
  const seedInput = h('input', {type: 'number', min: 1, max: 9999, value: settings.seed, 'aria-label': 'Random seed',
    onchange: e => { settings.seed = Math.max(1, Math.min(9999, Math.round(Number(e.target.value) || 1))); e.target.value = settings.seed; changed(); }});
  const popup = live.settingsPopup('Dispatch lab settings',
    h('div', {class: 'settings'},
      ...range('Look-ahead', 0, 0.95, 0.05, 'gamma', v => String(v)),
      ...range('Random tries', 0, 0.5, 0.05, 'exploration', v => pct(v)),
      ...range('Bronx pickup bonus', 0, 40, 5, 'bonusBX', v => `$${v}`),
      ...range('Staten Island bonus', 0, 60, 5, 'bonusSI', v => `$${v}`),
      ...range('Empty driving cost per mile', 0, 1.5, 0.1, 'costPerMile', v => money(v)),
      ...range('Manhattan chance of a request', 0.3, 1, 0.05, 'topChance', v => pct(v)),
      h('label', {}, 'Random seed'), seedInput),
    h('p', {class: 'pop-note'}, 'Any change starts the driver again from a blank table. Real NYC pay and trip times stay the same; these settings change our assumptions and the reward.'),
    h('h4', {}, 'Experiments to try'),
    h('ol', {class: 'steps-list small'},
      h('li', {}, 'Let it practise at Fast for about 150 shifts (a few minutes), then Test. Try seeds 1 to 5: same rule?'),
      h('li', {}, 'Empty driving $1.50 a mile. Does the driver still leave the Bronx?'),
      h('li', {}, 'Find the smallest Bronx bonus that makes the rule wait there. What does it cost per shift?'),
      h('li', {}, 'Manhattan\u2019s chance 40%. Which boroughs does the rule keep?')));
  const stage = h('div', {class: 'live-stage'}, mapLegend(), h('div', {class: 'scene'}, map.el));
  const main = h('div', {class: 'live-main'},
    h('div', {class: 'live-side'}, card('Training, live', stats), testCard, card('Practice shifts', chartSlot, log)),
    stage,
    h('div', {class: 'live-side right'}, nowSlot, card('What the driver does now', ruleSlot)));
  const layout = h('div', {class: 'live-lab'},
    h('div', {class: 'live-head'},
      h('div', {}, h('p', {class: 'step-kicker'}, 'Dispatch lab \u00b7 watch it learn'),
        h('h2', {}, 'Watch the driver learn where to wait.'),
        h('p', {class: 'lead'}, 'It starts knowing nothing and practises shift after shift on real New York numbers. Test the rule whenever you like; the gear changes the assumptions or adds a bonus.')),
      popup.gear),
    popup.dialog,
    main,
    h('div', {class: 'live-bar'},
      h('div', {class: 'controls live-controls'}, player.button, live.speedSwitch(speed, value => { speed = value; drawLive(true); }),
        button('Test', test), button('Watch 30 cars', watchFleet), button('Restart', () => { if (!busy) { fresh(); status.textContent = 'Restarted: blank table, practice shift 1.'; } })),
      status));
  root.replaceChildren(layout);
  live.fillWindow(layout);
  live.sizeStage(stage, main, {ratio: NYC_MAP.width / NYC_MAP.height, reserve: 620});
  fresh();
  status.textContent = live.REDUCED ? 'Press Play to start practice.' : 'Practice has started. Pause any time, or switch to Fast.';
  if (!live.REDUCED) player.play();
}

startPage(steps, mountLab, {layout: 'side', ratio: NYC_MAP.width / NYC_MAP.height});

</script>
</body>
</html>
